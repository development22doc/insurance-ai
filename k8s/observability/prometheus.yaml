apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: claimassist-core
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'claims-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['claims-service.claimassist-core.svc.cluster.local:80']
      - job_name: 'api-gateway'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['api-gateway.claimassist-core.svc.cluster.local:80']
      - job_name: 'customer-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['customer-service.claimassist-core.svc.cluster.local:80']
      - job_name: 'agent-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['agent-service.claimassist-core.svc.cluster.local:80']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: claimassist-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: claimassist-core
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
