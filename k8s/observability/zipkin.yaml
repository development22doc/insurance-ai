apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: claimassist-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest
          ports:
            - containerPort: 9411
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 9411 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin-service
  namespace: claimassist-core
spec:
  selector:
    app: zipkin
  ports:
    - port: 9411
      targetPort: 9411
