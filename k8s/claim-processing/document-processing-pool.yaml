# The insurance equivalent of the Lovable-clone platform's warm runner-pool
# for live previews: instead of claiming a pod and running `npm run dev`
# inside it, claims-service claims a pod from THIS pool and execs an OCR +
# fraud-signal-scoring job into it whenever a new ClaimDocument is uploaded.
# Same "claim it, exec into it, release it" shape as before - see
# INSURANCE_AI_PLATFORM.md Part 1's mapping table.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-processing-pool
  namespace: claimassist-processing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: document-processor
  template:
    metadata:
      labels:
        app: document-processor
        status: idle
    spec:
      containers:
        - name: processor
          image: ${REGISTRY}/claimassist/document-processor:latest
          # This image bundles an OCR engine (e.g. Tesseract) and a lightweight
          # fraud-signal scoring model - NOT the LLM itself. Keeping the LLM out
          # of this pool is deliberate: fraud scoring here is a deterministic,
          # auditable, versioned model - not something we want an LLM
          # "creatively" reinterpreting per document.
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 2000m, memory: 2Gi }
      volumes:
        - name: shared-doc-storage
          emptyDir: {}
---
# claims-service (in claimassist-core) execs into an idle pod here whenever a
# ClaimDocument is uploaded: mirrors bytes from MinIO into the pod, runs OCR +
# scoring, writes extractedText/fraudSignalScore back via claims-service's own
# internal API - never a direct DB write from the worker pod itself, keeping
# claims-service as the single writer of its own database.
apiVersion: v1
kind: Service
metadata:
  name: document-processing-pool
  namespace: claimassist-processing
spec:
  selector:
    app: document-processor
  ports:
    - port: 80
      targetPort: 80
