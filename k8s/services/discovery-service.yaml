apiVersion: v1
kind: ServiceAccount
metadata:
  name: discovery-service-account
  namespace: claimassist-core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: claimassist-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      serviceAccountName: discovery-service-account
      containers:
        - name: discovery-service
          image: ${REGISTRY}/claimassist/discovery-service:latest
          ports:
            - containerPort: 80
          env:
            - name: ZIPKIN_ENDPOINT
              value: http://zipkin-service:9411/api/v2/spans
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 80 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: claimassist-core
spec:
  selector:
    app: discovery-service
  ports:
    - port: 8761
      targetPort: 8761
