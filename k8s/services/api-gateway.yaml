apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway-account
  namespace: claimassist-core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: claimassist-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: api-gateway-account
      containers:
        - name: api-gateway
          image: ${REGISTRY}/claimassist/api-gateway:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: claimassist-shared-config
            - secretRef:
                name: app-secrets
          env:
            - name: CONFIG_SERVER_URL
              value: http://config-service:8888
            - name: ZIPKIN_ENDPOINT
              value: http://zipkin-service:9411/api/v2/spans
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          startupProbe:
            httpGet: { path: /actuator/health, port: 80 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 80 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: claimassist-core
spec:
  selector:
    app: api-gateway
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: claimassist-core
spec:
  ingressClassName: nginx
  rules:
    - host: claimassist.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
