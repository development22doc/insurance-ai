apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-service-account
  namespace: claimassist-core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: claimassist-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      serviceAccountName: config-service-account
      containers:
        - name: config-service
          image: ${REGISTRY}/claimassist/config-service:latest
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: claimassist-shared-config
            - secretRef:
                name: app-secrets
          env:
            - name: ZIPKIN_ENDPOINT
              value: http://zipkin-service:9411/api/v2/spans
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8888 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8888 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: claimassist-core
spec:
  selector:
    app: config-service
  ports:
    - port: 8888
      targetPort: 8888
