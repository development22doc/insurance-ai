# Same default-deny-then-explicit-allow pattern as the distributed Lovable-
# clone platform (see its k8s/network-policies.yaml) - arguably more
# important here, since claims-service and customer-service's internal
# endpoints return real customer PII (policy coverage, claim status).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: claimassist-core
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-domain-services
  namespace: claimassist-core
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["customer-service", "claims-service", "agent-service"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-domain-services-to-each-other
  namespace: claimassist-core
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["customer-service", "claims-service", "agent-service"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["customer-service", "claims-service", "agent-service"]
      ports:
        - protocol: TCP
          port: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-domain-services-to-stateful-infra
  namespace: claimassist-core
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["postgres", "redis", "kafka", "minio"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["customer-service", "claims-service", "agent-service", "config-service"]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: claimassist-core
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - {}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-services-to-zipkin
  namespace: claimassist-core
spec:
  podSelector:
    matchLabels:
      app: zipkin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["customer-service", "claims-service", "agent-service", "api-gateway"]

---
# claims-service's ServiceAccount is bound (via a RoleBinding in the
# claimassist-processing namespace, not shown here for brevity - same
# cross-namespace RBAC pattern as the Lovable-clone platform's
# workspace-service-account) to a narrowly-scoped Role granting only what's
# needed to claim a worker pod and exec OCR/fraud-scan commands into it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-claims-service-to-processing-namespace
  namespace: claimassist-processing
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: claimassist-core
          podSelector:
            matchLabels:
              app: claims-service
