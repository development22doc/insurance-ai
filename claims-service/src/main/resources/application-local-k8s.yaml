# LOCAL-K8S: Claims Service connecting to OCI K3s dependencies via SSH tunnels
# Profile: local-k8s
#
# This profile is for IntelliJ/local debugging against the real OCI K3s infrastructure.
#
# Prerequisites (run once):
#   scripts/oci-k8s-connect.ps1
#
# This establishes SSH tunnels:
#   PostgreSQL: localhost:15432 â†’ claimassist-postgresql:5432
#   Redis:      localhost:16379 â†’ claimassist-redis:6379
#   Kafka:      localhost:9092  â†’ claimassist-kafka:9092
#   Keycloak:   localhost:18080 â†’ claimassist-keycloak:8080

spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  config:
    import: ""
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:15432}/claimassist_claims?serverTimezone=UTC
    username: ${POSTGRES_USER:claimassist}
    password: ${POSTGRES_PASSWORD:claimassist}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  flyway:
    enabled: false

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 2147483647
      batch-size: 16384
      linger-ms: 10
      compression-type: snappy
      delivery-timeout-ms: 120000
      properties:
        linger.ms: 10
        request.timeout.ms: 30000
        retry.backoff.ms: 1000

    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      group-id: claims-service-local-k8s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:18080/realms/claimassist-dev}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://127.0.0.1:18080/realms/claimassist-dev/protocol/openid-connect/certs}

      client:
        registration:
          internal-service:
            provider: keycloak
            client-id: ${SERVICE_CLIENT_ID:claimassist-admin-service}
            client-secret: ${SERVICE_CLIENT_SECRET:local-dev-admin-client-secret}
            authorization-grant-type: client_credentials

        provider:
          keycloak:
            token-uri: ${SERVICE_TOKEN_URI:http://127.0.0.1:18080/realms/claimassist-dev/protocol/openid-connect/token}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  kafka:
    consumer-groups:
      claims: claims-group-local-${CLAIMASSIST_DEV_ID:local}
      cqrs-read-model-sync: cqrs-read-model-sync-group-local-${CLAIMASSIST_DEV_ID:local}
      claims-saga-orchestrator: claims-saga-orchestrator-group-local-${CLAIMASSIST_DEV_ID:local}
      claims-saga-step-processor: claims-saga-step-processor-group-local-${CLAIMASSIST_DEV_ID:local}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN



