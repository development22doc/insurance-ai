# LOCAL-K8S: Claims Service connecting to OCI K3s dependencies via Tailscale NodePorts
# Profile: local-k8s
#
# This profile is for IntelliJ/local debugging against the real OCI K3s infrastructure.
# All services connect through the shared Tailscale-accessible NodePorts.
#
# Shared infrastructure NodePorts (Tailscale):
#   PostgreSQL: 100.114.133.69:30432
#   Redis:      100.114.133.69:30379
#   Kafka:      100.114.133.69:30092
#   Keycloak:   100.114.133.69:30080
#   Zipkin:     100.114.133.69:30941
#   Loki:       100.114.133.69:30310
#   Prometheus: 100.114.133.69:30900
#   Grafana:    100.114.133.69:30300

spring:
  config:
    import: optional:file:../application-local-k8s.properties
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: false
    openfeign:
      client:
        config:
          customer-service:
            url: ${CUSTOMER_SERVICE_URI:http://localhost:8081}
            connect-timeout: 2000
            read-timeout: 5000
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:100.114.133.69}:${POSTGRES_PORT:30432}/claimassist_claims
    username: ${POSTGRES_USER:claimassist}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  flyway:
    enabled: false

  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:100.114.133.69}
      port: ${REDIS_PORT:30379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.114.133.69:30092}
    producer:
      acks: all
      retries: 2147483647
      batch-size: 16384
      linger-ms: 10
      compression-type: snappy
      delivery-timeout-ms: 120000
      properties:
        linger.ms: 10
        request.timeout.ms: 30000
        retry.backoff.ms: 1000

    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.114.133.69:30092}
      group-id: claims-service-local-k8s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://100.114.133.69:30080/realms/claimassist-dev}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://100.114.133.69:30080/realms/claimassist-dev/protocol/openid-connect/certs}

      client:
        registration:
          internal-service:
            provider: keycloak
            client-id: ${SERVICE_CLIENT_ID}
            client-secret: ${SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials

        provider:
          keycloak:
            token-uri: ${SERVICE_TOKEN_URI}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:false}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://100.114.133.69:30941/api/v2/spans}

app:
  kafka:
    consumer-groups:
      claims: claims-group-local-${CLAIMASSIST_DEV_ID:local}
      cqrs-read-model-sync: cqrs-read-model-sync-group-local-${CLAIMASSIST_DEV_ID:local}
      claims-saga-orchestrator: claims-saga-orchestrator-group-local-${CLAIMASSIST_DEV_ID:local}
      claims-saga-step-processor: claims-saga-step-processor-group-local-${CLAIMASSIST_DEV_ID:local}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
