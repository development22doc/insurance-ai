name: Deploy DEV

# DEV-ONLY deployment workflow.
#
# Security model (HARDENED):
#   - Deploys ONLY to the `dev` GitHub Environment / claimassist-dev namespace.
#   - Uses a DEV-specific GitHub Environment secret (DEV_KUBE_CONFIG). There is
#     NO generic KUBE_CONFIG and NO STAGE/PROD credentials anywhere in this repo.
#   - STAGE and PROD are LOCKED: this file contains no workflow_dispatch input,
#     no environment selector, and no stage/prod values. They cannot be deployed
#     from this workflow until a separate, reviewed workflow is added later.
#   - All deploy targets (namespace/release/values/chart) are hardcoded constants
#     and verified by an explicit safety gate. A user-controlled input can never
#     select a namespace.
#
# Image promotion: the application image is built ONCE per commit by the
# docker-build workflow and tagged with the immutable Git SHA. This workflow
# deploys that same tag (image.tag=<git sha>); nothing is rebuilt here.

on:
  push:
    branches: [ dev ]

env:
  CHART: infrastructure/helm/claimassist
  VALUES: values-dev.yaml
  NAMESPACE: claimassist-dev
  RELEASE: claimassist-dev

concurrency:
  # Only one DEV deployment at a time.
  group: claimassist-dev-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    environment: dev

    permissions:
      contents: read
      packages: read

    steps:
    - name: Enforce DEV-only deployment target
      run: |
        set -euo pipefail
        # Hard safety gate: this workflow may ONLY ever deploy to claimassist-dev.
        # Any deviation fails the job before any cluster action occurs.
        [ "$NAMESPACE" = "claimassist-dev" ] || { echo "FATAL: namespace is not claimassist-dev"; exit 1; }
        [ "$RELEASE" = "claimassist-dev" ] || { echo "FATAL: release is not claimassist-dev"; exit 1; }
        [ "$VALUES" = "values-dev.yaml" ] || { echo "FATAL: values file is not values-dev.yaml"; exit 1; }
        [ "$CHART" = "infrastructure/helm/claimassist" ] || { echo "FATAL: chart path is incorrect"; exit 1; }
        echo "Target verified: namespace=$NAMESPACE release=$RELEASE values=$VALUES chart=$CHART"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.27.0'

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.16.4'

    - name: Configure kubectl (DEV credentials only)
      run: |
        if [ -z "$DEV_KUBE_CONFIG" ]; then
          echo "::error::DEV_KUBE_CONFIG secret is not set on the 'dev' environment."
          exit 1
        fi
        mkdir -p "$HOME/.kube"
        echo "$DEV_KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
        chmod 600 "$HOME/.kube/config"
      env:
        DEV_KUBE_CONFIG: ${{ secrets.DEV_KUBE_CONFIG }}

    - name: Validate chart (helm lint)
      run: helm lint "$CHART"

    - name: Validate Helm template
      run: |
        helm template "$RELEASE" "$CHART" \
          -n "$NAMESPACE" \
          -f "$CHART/$VALUES" \
          --set image.registry="${{ secrets.DOCKER_USERNAME }}" \
          --set image.tag="${{ github.sha }}" \
          > /dev/null

    - name: Kubernetes dry-run validation
      run: |
        helm upgrade --install "$RELEASE" "$CHART" \
          -n "$NAMESPACE" \
          --create-namespace \
          -f "$CHART/$VALUES" \
          --set image.registry="${{ secrets.DOCKER_USERNAME }}" \
          --set image.tag="${{ github.sha }}" \
          --dry-run \
          > /dev/null

    - name: Deploy with Helm
      run: |
        helm upgrade --install "$RELEASE" "$CHART" \
          -n "$NAMESPACE" \
          --create-namespace \
          -f "$CHART/$VALUES" \
          --set image.registry="${{ secrets.DOCKER_USERNAME }}" \
          --set image.tag="${{ github.sha }}" \
          --wait \
          --timeout 10m

    - name: Verify deployment rollout
      run: kubectl rollout status deployment -n "$NAMESPACE" --timeout=5m

    - name: Smoke verification
      run: |
        set -euo pipefail
        echo "=== Pods ($NAMESPACE) ==="
        kubectl get pods -n "$NAMESPACE"
        echo "=== Services ($NAMESPACE) ==="
        kubectl get services -n "$NAMESPACE"
        echo "=== Ingress ($NAMESPACE) ==="
        kubectl get ingress -n "$NAMESPACE"
        # Fail if any deployment is not available.
        UNAVAILABLE=$(kubectl get deployment -n "$NAMESPACE" \
          -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.availableReplicas}{"\n"}{end}' \
          | awk '$2==0 {print $1}' )
        if [ -n "$UNAVAILABLE" ]; then
          echo "::error::Deployments with 0 available replicas: $UNAVAILABLE"
          exit 1
        fi
