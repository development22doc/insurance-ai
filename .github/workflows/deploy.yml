name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.27.0'

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'

    - name: Determine deployment values file
      id: values
      run: |
        ENV=${{ github.event.inputs.environment || 'dev' }}
        echo "values_file=values-${ENV}.yaml" >> $GITHUB_OUTPUT

    - name: Deploy with Helm
      run: |
        helm upgrade --install claimassist-platform ./helm/claimassist \
          -f ./helm/claimassist/${{ steps.values.outputs.values_file }} \
          -n claimassist-core \
          --create-namespace \
          --wait \
          --timeout 10m

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/api-gateway -n claimassist-core --timeout=5m
        kubectl rollout status deployment/customer-service -n claimassist-core --timeout=5m
        kubectl rollout status deployment/claims-service -n claimassist-core --timeout=5m
        kubectl rollout status deployment/agent-service -n claimassist-core --timeout=5m

    - name: Check deployment health
      run: |
        kubectl get pods -n claimassist-core
        kubectl get services -n claimassist-core
        kubectl get ingress -n claimassist-core

