name: Rollback DEV

# DEV-ONLY, SERVICE-WISE rollback workflow.
#
# Security model (HARDENED):
#   - Rolls back ONLY the `dev` GitHub Environment / claimassist-dev namespace.
#   - Uses the DEV-specific GitHub Environment secret DEV_KUBE_CONFIG. No generic
#     KUBE_CONFIG and no STAGE/PROD credentials exist anywhere in this repo.
#   - STAGE and PROD are LOCKED: no environment selector is offered. This file
#     cannot touch any other namespace or release.
#   - All rollback targets are hardcoded constants and verified by a safety gate.
#   - Only ONE application service can be rolled back per run; the service is
#     validated against the four allowed Kubernetes workloads.

# SERVICE-WISE ROLLBACK (NO Helm drift, NO kubectl side-effects):
#   A whole-release `helm rollback` would revert ALL four application Deployments
#   (and any infrastructure change) at once - that is NOT a service-wise rollback
#   and could silently revert sibling services. Instead we restore ONLY the target
#   service to its previously-deployed immutable image tag:
#     1. Read the target service's imageTag from a prior Helm release revision
#        (default: the previous revision) via `helm get values --revision N`.
#     2. Resolve the CURRENT deployed images for all four services from Kubernetes
#        Deployments (authoritative runtime state) using resolve-deployed-images.sh.
#     3. Re-apply the prior tag for the target service with a service-specific
#        `helm upgrade` using the SAME `services.<name>.imageTag` override the CD deploy
#        uses, while preserving the other three services' current resolved tags.
#        Because Helm merges over the current release values, ONLY the target
#        Deployment's pod template changes -> only that one service rolls back.
#        The other three services keep their already-deployed SHA (verified after rollback).
#   Helm is the sole mutator of the Deployments, so Helm release values ALWAYS
#   equal the live Kubernetes Deployment image. There is no `kubectl rollout
#   undo` anywhere, so a rollback can never leave a result that disagrees with
#   Helm's stored values.

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to roll back (one application service only)'
        required: true
        type: choice
        options:
          - api-gateway
          - customer-service
          - claims-service
          - agent-service
      revision:
        description: 'Helm release revision whose image tag to restore (default: previous revision)'
        required: false
        type: string

env:
  CHART: infrastructure/helm/claimassist
  NAMESPACE: claimassist-dev
  RELEASE: claimassist-dev

# Shared namespace-level lock with the CD deploy jobs (cd-deploy-dev): a rollback
# and a deploy of the same env can never run concurrently against the single Helm
# release, otherwise a rollback could be overwritten by an in-flight deploy (and
# vice-versa). The lock also serializes this rollback against the other services.
concurrency:
  group: cd-deploy-dev
  cancel-in-progress: false

jobs:
  rollback-dev:
    runs-on: ubuntu-latest

    environment: dev

    permissions:
      contents: read

    env:
      DOCKER_REGISTRY: claimassistdev

    steps:
    - name: Enforce DEV-only rollback target and valid service
      run: |
        set -euo pipefail
        [ "$NAMESPACE" = "claimassist-dev" ] || { echo "FATAL: namespace is not claimassist-dev"; exit 1; }
        [ "$RELEASE" = "claimassist-dev" ] || { echo "FATAL: release is not claimassist-dev"; exit 1; }
        [ "$CHART" = "infrastructure/helm/claimassist" ] || { echo "FATAL: chart path is incorrect"; exit 1; }
        case "$SERVICE" in
          api-gateway|customer-service|claims-service|agent-service) ;;
          *) echo "FATAL: invalid service '$SERVICE'"; exit 1 ;;
        esac
        echo "Target verified: namespace=$NAMESPACE release=$RELEASE chart=$CHART service=$SERVICE"
      env:
        SERVICE: ${{ github.event.inputs.service }}

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8
      with:
        version: 'v1.27.0'

    - name: Set up Helm
      uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78
      with:
        version: '3.16.4'

    - name: Configure kubectl (DEV credentials only)
      run: |
        if [ -z "$DEV_KUBE_CONFIG" ]; then
          echo "::error::DEV_KUBE_CONFIG secret is not set on the 'dev' environment."
          exit 1
        fi
        mkdir -p "$HOME/.kube"
        echo "$DEV_KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
        chmod 600 "$HOME/.kube/config"
      env:
        DEV_KUBE_CONFIG: ${{ secrets.DEV_KUBE_CONFIG }}

    - name: Get current Helm release history
      run: helm history "$RELEASE" -n "$NAMESPACE"

    - name: Record pre-rollback live image tags (proof sibling services are untouched)
      id: pre
      run: |
        set -euo pipefail
        for svc in api-gateway customer-service claims-service agent-service; do
          tag=$(kubectl -n "$NAMESPACE" get deployment "claimassist-$svc" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*://')
          echo "BEFORE_$svc=$tag" >> "$GITHUB_ENV"
          echo "Before rollback  $svc => $tag"
        done

    - name: Resolve target revision and prior image tag
      id: resolve
      run: |
        set -euo pipefail
        HISTORY=$(helm history "$RELEASE" -n "$NAMESPACE" -o json)
        CURRENT=$(echo "$HISTORY" | jq -r 'map(.revision) | max')
        if [ -n "${REVISION:-}" ]; then
          TARGET_REV=$REVISION
        else
          TARGET_REV=$(( CURRENT - 1 ))
        fi
        if [ "$TARGET_REV" -lt 1 ]; then
          echo "::error::No previous revision to restore from (current revision is $CURRENT)."
          exit 1
        fi
        echo "Current revision: $CURRENT | restoring from revision: $TARGET_REV"

        # NOTE: We use `helm get values --revision` ONLY to determine the prior image
        # tag for the TARGET service being rolled back. This is acceptable here because:
        #   1. The rollback target is determined by the operator (explicit revision choice)
        #   2. We subsequently resolve ALL four current images from Kubernetes Deployments
        #      (authoritative) and use those for the sibling services
        #   3. If the prior revision's values don't contain the imageTag, we fail with
        #      a clear error rather than guessing
        # The authoritative source for current state remains Kubernetes Deployments.
        PRIOR_VALUES=$(helm get values "$RELEASE" -n "$NAMESPACE" --revision "$TARGET_REV" -o json)
        TARGET_TAG=$(echo "$PRIOR_VALUES" | jq -r --arg svc "$SERVICE" '.services[$svc].imageTag // empty')
        if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "null" ]; then
          echo "::error::Could not determine the prior image tag for '$SERVICE' from Helm revision $TARGET_REV."
          echo "::error::The Helm release values at revision $TARGET_REV do not contain services.$SERVICE.imageTag."
          echo "::error::This may mean the prior deployment used an older CD mechanism."
          echo "::error::Recovery: use 'kubectl get deployment claimassist-$SERVICE -n $NAMESPACE -o jsonpath='{.spec.template.spec.containers[0].image}'' to find the currently deployed image, then deploy it manually."
          exit 1
        fi
        echo "Restoring '$SERVICE' to image tag: $TARGET_TAG"
        echo "TARGET_TAG=$TARGET_TAG" >> "$GITHUB_ENV"
      env:
        SERVICE: ${{ github.event.inputs.service }}
        REVISION: ${{ github.event.inputs.revision }}

    - name: Resolve current deployed images (for sibling services)
      run: |
        set -euo pipefail
        # Resolve CURRENT deployed images from Kubernetes Deployments (authoritative runtime state).
        # This ensures sibling services are preserved during rollback with their actual current images.
        # This happens WHILE HOLDING the deployment lock, preventing races.
        echo "Resolving current deployed images from Kubernetes Deployments..."

        RESOLVED_TAGS=$(.github/scripts/resolve-deployed-images.sh "$NAMESPACE" "$DOCKER_REGISTRY")

        # Parse resolved tags into array
        read -r API_TAG CUSTOMER_TAG CLAIMS_TAG AGENT_TAG <<< "$RESOLVED_TAGS"

        echo "Resolved current deployed images:"
        echo "  api-gateway: $API_TAG"
        echo "  customer-service: $CUSTOMER_TAG"
        echo "  claims-service: $CLAIMS_TAG"
        echo "  agent-service: $AGENT_TAG"

        # Store in environment for next step
        echo "CURRENT_API_TAG=$API_TAG" >> "$GITHUB_ENV"
        echo "CURRENT_CUSTOMER_TAG=$CUSTOMER_TAG" >> "$GITHUB_ENV"
        echo "CURRENT_CLAIMS_TAG=$CLAIMS_TAG" >> "$GITHUB_ENV"
        echo "CURRENT_AGENT_TAG=$AGENT_TAG" >> "$GITHUB_ENV"

    - name: Perform service-wise rollback via Helm (no drift)
      run: |
        set -euo pipefail
        # Restore ONLY the target service to its prior immutable SHA while preserving
        # the other three services' current deployed images. Because `helm upgrade`
        # merges over the current release values, the other three services' imageTag
        # values are preserved -> only this Deployment rolls. Helm remains the sole
        # mutator (no kubectl rollout undo).

        # Build image tag arguments: use TARGET_TAG for rollback service, current tags for others
        case "$SERVICE" in
          api-gateway)
            IMAGE_TAG_ARGS=(
              "--set" "services.api-gateway.imageTag=$TARGET_TAG"
              "--set" "services.customer-service.imageTag=$CURRENT_CUSTOMER_TAG"
              "--set" "services.claims-service.imageTag=$CURRENT_CLAIMS_TAG"
              "--set" "services.agent-service.imageTag=$CURRENT_AGENT_TAG"
            )
            ;;
          customer-service)
            IMAGE_TAG_ARGS=(
              "--set" "services.api-gateway.imageTag=$CURRENT_API_TAG"
              "--set" "services.customer-service.imageTag=$TARGET_TAG"
              "--set" "services.claims-service.imageTag=$CURRENT_CLAIMS_TAG"
              "--set" "services.agent-service.imageTag=$CURRENT_AGENT_TAG"
            )
            ;;
          claims-service)
            IMAGE_TAG_ARGS=(
              "--set" "services.api-gateway.imageTag=$CURRENT_API_TAG"
              "--set" "services.customer-service.imageTag=$CURRENT_CUSTOMER_TAG"
              "--set" "services.claims-service.imageTag=$TARGET_TAG"
              "--set" "services.agent-service.imageTag=$CURRENT_AGENT_TAG"
            )
            ;;
          agent-service)
            IMAGE_TAG_ARGS=(
              "--set" "services.api-gateway.imageTag=$CURRENT_API_TAG"
              "--set" "services.customer-service.imageTag=$CURRENT_CUSTOMER_TAG"
              "--set" "services.claims-service.imageTag=$CURRENT_CLAIMS_TAG"
              "--set" "services.agent-service.imageTag=$TARGET_TAG"
            )
            ;;
          *)
            echo "::error::Unknown service: $SERVICE"
            exit 1
            ;;
        esac

        helm upgrade "$RELEASE" "$CHART" -n "$NAMESPACE" \
          -f infrastructure/helm/claimassist/values-dev.yaml \
          --set image.registry="$DOCKER_REGISTRY" \
          "${IMAGE_TAG_ARGS[@]}" \
          --wait \
          --timeout 10m
      env:
        SERVICE: ${{ github.event.inputs.service }}
        TARGET_TAG: ${{ env.TARGET_TAG }}
        CURRENT_API_TAG: ${{ env.CURRENT_API_TAG }}
        CURRENT_CUSTOMER_TAG: ${{ env.CURRENT_CUSTOMER_TAG }}
        CURRENT_CLAIMS_TAG: ${{ env.CURRENT_CLAIMS_TAG }}
        CURRENT_AGENT_TAG: ${{ env.CURRENT_AGENT_TAG }}

    - name: Wait for the rolled-back service rollout to complete
      run: kubectl -n "$NAMESPACE" rollout status "deployment/claimassist-$SERVICE" --timeout=10m
      env:
        SERVICE: ${{ github.event.inputs.service }}

    - name: Verify rolled-back service is healthy
      run: |
        set -euo pipefail
        DEP="claimassist-$SERVICE"
        AVAILABLE=$(kubectl -n "$NAMESPACE" get deployment "$DEP" -o jsonpath='{.status.conditions[?(@.type=="Available")].status}')
        READY=$(kubectl -n "$NAMESPACE" get deployment "$DEP" -o jsonpath='{.status.readyReplicas}')
        DESIRED=$(kubectl -n "$NAMESPACE" get deployment "$DEP" -o jsonpath='{.spec.replicas}')
        echo "Available condition: $AVAILABLE | readyReplicas: ${READY:-0} / desired: $DESIRED"
        if [ "$AVAILABLE" != "True" ] || [ "${READY:-0}" -lt "${DESIRED:-1}" ]; then
          echo "::error::$DEP did not become healthy after rollback."
          exit 1
        fi
      env:
        SERVICE: ${{ github.event.inputs.service }}

    - name: Verify Helm consistency and service-wise scope
      run: |
        set -euo pipefail
        DEP="claimassist-$SERVICE"
        # 1) Helm stored values == live Deployment image for the rolled-back service.
        LIVE_TAG=$(kubectl -n "$NAMESPACE" get deployment "$DEP" \
                   -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*://')
        HELM_TAG=$(helm get values "$RELEASE" -n "$NAMESPACE" -o json \
                   | jq -r --arg svc "$SERVICE" '.services[$svc].imageTag // empty')
        echo "Rolled-back service  $SERVICE  -> Helm=$HELM_TAG  live=$LIVE_TAG"
        if [ -z "$HELM_TAG" ] || [ "$HELM_TAG" = "null" ]; then
          echo "::error::Helm release values do not contain services.$SERVICE.imageTag after rollback."
          echo "::error::This indicates a problem with the rollback operation."
          exit 1
        fi
        [ "$LIVE_TAG" = "$HELM_TAG" ] || {
          echo "::error::Helm release values and live Deployment image disagree for '$SERVICE' (Helm=$HELM_TAG live=$LIVE_TAG)."
          exit 1
        }
        # 2) Sibling services must be UNCHANGED by this rollback.
        for svc in api-gateway customer-service claims-service agent-service; do
          [ "$svc" = "$SERVICE" ] && continue
          before="$(printenv BEFORE_${svc})"
          after=$(kubectl -n "$NAMESPACE" get deployment "claimassist-$svc" \
                  -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*://')
          echo "Sibling service     $svc  -> before=$before  after=$after"
          [ "$before" = "$after" ] || {
            echo "::error::Rollback of '$SERVICE' unexpectedly modified sibling '$svc' (before=$before after=$after)."
            exit 1
          }
        done
        echo "Rollback confirmed service-wise; Helm state == live state for all four services."
      env:
        SERVICE: ${{ github.event.inputs.service }}
