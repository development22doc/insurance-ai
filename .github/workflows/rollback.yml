name: Rollback DEV

# DEV-ONLY rollback workflow.
#
# Security model (HARDENED):
#   - Rolls back ONLY the `dev` GitHub Environment / claimassist-dev namespace.
#   - Uses the DEV-specific GitHub Environment secret DEV_KUBE_CONFIG. No generic
#     KUBE_CONFIG and no STAGE/PROD credentials exist anywhere in this repo.
#   - STAGE and PROD are LOCKED: no environment selector is offered. This file
#     cannot touch any other namespace or release.
#   - All rollback targets are hardcoded constants and verified by a safety gate.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Revision to rollback to (leave empty for previous)'
        required: false
        type: string

env:
  CHART: infrastructure/helm/claimassist
  VALUES: values-dev.yaml
  NAMESPACE: claimassist-dev
  RELEASE: claimassist-dev

# Shared namespace-level lock with the CD deploy jobs (cd-deploy-dev): a rollback
# and a deploy of the same env can never run concurrently against the single Helm
# release, otherwise a rollback could be overwritten by an in-flight deploy.
concurrency:
  group: cd-deploy-dev
  cancel-in-progress: false

jobs:
  rollback-dev:
    runs-on: ubuntu-latest

    environment: dev

    permissions:
      contents: read

    steps:
    - name: Enforce DEV-only rollback target
      run: |
        set -euo pipefail
        [ "$NAMESPACE" = "claimassist-dev" ] || { echo "FATAL: namespace is not claimassist-dev"; exit 1; }
        [ "$RELEASE" = "claimassist-dev" ] || { echo "FATAL: release is not claimassist-dev"; exit 1; }
        [ "$VALUES" = "values-dev.yaml" ] || { echo "FATAL: values file is not values-dev.yaml"; exit 1; }
        [ "$CHART" = "infrastructure/helm/claimassist" ] || { echo "FATAL: chart path is incorrect"; exit 1; }
        echo "Target verified: namespace=$NAMESPACE release=$RELEASE values=$VALUES chart=$CHART"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.27.0'

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.16.4'

    - name: Configure kubectl (DEV credentials only)
      run: |
        if [ -z "$DEV_KUBE_CONFIG" ]; then
          echo "::error::DEV_KUBE_CONFIG secret is not set on the 'dev' environment."
          exit 1
        fi
        mkdir -p "$HOME/.kube"
        echo "$DEV_KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
        chmod 600 "$HOME/.kube/config"
      env:
        DEV_KUBE_CONFIG: ${{ secrets.DEV_KUBE_CONFIG }}

    - name: Get current Helm release history
      run: helm history "$RELEASE" -n "$NAMESPACE"

    - name: Perform rollback
      run: |
        if [ -z "${{ github.event.inputs.revision }}" ]; then
          echo "Rolling back to previous release..."
          helm rollback "$RELEASE" -n "$NAMESPACE"
        else
          echo "Rolling back to revision ${{ github.event.inputs.revision }}..."
          helm rollback "$RELEASE" "${{ github.event.inputs.revision }}" -n "$NAMESPACE"
        fi

    - name: Wait for rollback to complete
      run: kubectl rollout status deployment -n "$NAMESPACE" --timeout=5m

    - name: Verify rollback
      run: |
        set -euo pipefail
        echo "=== Current Deployment Status ($NAMESPACE) ==="
        kubectl get pods -n "$NAMESPACE"
        echo ""
        echo "=== Latest Helm Release ==="
        helm status "$RELEASE" -n "$NAMESPACE"