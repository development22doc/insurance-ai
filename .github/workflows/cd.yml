# =============================================================================
# ClaimAssist - Consolidated Continuous Delivery (CD)
# =============================================================================
# One CD workflow for the FOUR Kubernetes application services only:
#     api-gateway, customer-service, claims-service, agent-service
# discovery-service and config-service are LOCAL/Docker-compose only and are
# NEVER deployed (or built) as Kubernetes workloads.
#
# ----------------------------- ARCHITECTURE ----------------------------------
# * Deployment mechanism: ONE Helm release per environment
#     claimassist-dev / claimassist-stage / claimassist-prod
#   (chart infrastructure/helm/claimassist), which owns BOTH the shared
#   infrastructure (PostgreSQL/Redis/Kafka/Keycloak/Flyway/ingress/networkpolicy)
#   and the four application Deployments.
#
# * SERVICE-WISE INDEPENDENT DEPLOYMENT (NO Helm drift):
#   The chart's image helper supports a PER-SERVICE tag (`services.<name>.imageTag`).
#   Deploying one service runs:
#       helm upgrade <release> <chart> -n <ns> \
#         --set image.registry=claimassistdev \
#         --set services.<svc>.imageTag=<git-sha>
#   Because `helm upgrade` merges over the previous release values, ONLY the
#   targeted service's pod template changes -> only that Deployment rolls out.
#   Untouched services keep their already-deployed immutable SHA tag.
#
# * IMAGE-STATE RESOLUTION (KUBERNETES-AUTHORITATIVE):
#   ** THE AUTHORITATIVE SOURCE OF DEPLOYED IMAGE STATE IS THE KUBERNETES **
#   ** DEPLOYMENT RUNTIME STATE, NOT HELM USER-SUPPLIED VALUES.            **
#
#   Helm user-supplied values (`helm get values`) may be incomplete, stale,
#   or absent entirely (e.g. after a partial deployment or a failed revision).
#   The actual Kubernetes Deployment spec.template.spec.containers[0].image
#   always reflects what is truly running.
#
#   The CD workflow uses the reusable resolve-deployed-images.sh script to:
#     1. Read actual image tags from Kubernetes Deployments (authoritative)
#     2. Validate image format: <registry>/<service>:<SHA>
#     3. Reject invalid tags (latest, 1.0.0, dev, empty, wrong registry)
#     4. Handle bootstrap (force_deploy) and broken states explicitly
#   This resolution happens WHILE HOLDING the deployment lock to prevent races.
#
# * DEPLOYMENT FLOW (per service):
#   acquire environment deployment lock (cd-deploy-<env>)
#     -> record pre-deployment image state (race detection snapshot)
#     -> resolve current deployed images from Kubernetes (authoritative)
#     -> apply requested service override(s)
#     -> verify all four resulting images
#     -> helm upgrade --wait
#     -> verify post-deployment image state (all four services)
#     -> verify Helm release is in 'deployed' state
#     -> release lock
#
# * INFRASTRUCTURE SYNC:
#   Infrastructure changes preserve ALL four application images:
#     1. acquire environment deployment lock
#     2. record pre-deployment image state
#     3. resolve actual current images from Kubernetes Deployments
#     4. pass all four preserved image tags to Helm explicitly
#     5. apply the infrastructure/chart change
#     6. verify that application images did NOT change
#   This guarantees infrastructure-only changes never bump application images.
#
# * CI -> CD ordering (no race):
#   Automatic CD is gated on the COMPLETED post-merge CI run via `workflow_run`
#   (see `on:` below), so CD can never start before CI finishes on the same commit.
#   CD then deploys the exact head_sha that CI validated (resolve-targets outputs
#   `target_sha`). The old `push:[dev]` auto-trigger was removed to avoid running
#   CI and CD concurrently on the same event.
#
# * IMAGE -> CD ordering (no race):
#   Image building lives in the reusable work flow .github/workflows/docker-build.yaml
#   and is invoked by this workflow (job `build-images`). Automatic deploy jobs
#   declare `needs: build-images`, so a deployment can never start before the
#   immutable image for the commit SHA has been built AND pushed. Manual (workflow_dispatch)
#   deploys skip building and instead verify the immutable SHA image already exists
#   via `docker manifest inspect` before touching the cluster.
#
# * BUILD-ONLY DOCKER HUB PATH (independent from deployment):
#   workflow_dispatch with action=build-only selects the services to build/push and runs
#   ONLY the reusable docker-build.yaml (build + push immutable SHA images), then STOPS.
#   Every deployment/infra job is explicitly gated on the `run_deploy` output from
#   resolve-targets (run_deploy=false in build-only), so Helm/kubectl/Kubernetes
#   credentials can NEVER execute in build-only mode, regardless of job ordering.
#   build-only does not initialize Helm, does not call kubectl, and does not require any
#   kubeconfig secret (it only needs the repo-level DOCKER_USERNAME / DOCKER_PASSWORD).
#
# * Concurrency: namespace-level lock `cd-deploy-<env>` for every job that mutates
#   that environment's single Helm release (deploy, infra-sync, rollback). Two
#   different services are independent/serializable, "all" cannot race a service
#   deploy, and two deploys of the same env can never last-writer-wins each other.
#
# * Failure isolation: all service matrices use `fail-fast: false`; an independent
#   service failure does NOT cancel its peers. Each service job fails (and is
#   reported) independently.
#
# * POST-DEPLOYMENT VERIFICATION: after every Helm upgrade, the CD verifies:
#     1. All four Kubernetes Deployment images match the calculated desired state
#     2. Helm release is in 'deployed' state
#     3. For service deploys: sibling services were NOT modified
#     4. For infra sync: ALL four application images are unchanged
#   This catches state drift, failed upgrades, and concurrency issues.
#
# * FIRST-EVER BOOTSTRAP / BROKEN ENVIRONMENTS:
#   If any Deployment is missing or has an invalid image, the resolver fails
#   with a clear diagnostic. Recovery requires force_deploy=true which
#   explicitly supplies all four image tags. The resolver never guesses or
#   falls back to default values.
#
# * Environments: dev/stage/prod namespaces + env-scoped kubeconfig secrets:
#     dev   -> claimassist-dev   (DEV_KUBE_CONFIG)
#     stage -> claimassist-stage (STAGE_KUBE_CONFIG)
#     prod  -> claimassist-prod  (PROD_KUBE_CONFIG)  [approval gate via `prod` env]
# =============================================================================

name: CD

on:
  # Automatic CD keys off the COMPLETED post-merge CI run on dev (NOT the push
  # itself), so CD can never start before CI finishes. workflow_run fires after
  # CI completes; CD deploys exactly the head_sha that CI validated. PR-CI runs
  # are excluded below via branches:[dev] plus a job-level head_branch == 'dev'
  # and event == 'push' guard in resolve-targets.
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ dev ]
  # Manual deployment: pick environment + service (independent, no "all-or-nothing").
  workflow_dispatch:
    inputs:
      action:
        description: 'Docker-only build+push (BUILD-ONLY: STOPS after Docker Hub) OR deploy'
        type: choice
        options:
          - build-only
          - deploy
        default: deploy
        required: true
      environment:
        description: 'Target environment (only used by the deploy action)'
        type: choice
        options:
          - dev
          - stage
          - prod
        default: dev
        required: true
      service:
        description: 'Service to build (build-only) or deploy'
        type: choice
        options:
          - all
          - api-gateway
          - customer-service
          - claims-service
          - agent-service
        default: all
        required: true
      force_deploy:
        description: 'Full DEV bootstrap: build + deploy ALL four services + infra. Requires action=deploy and environment=dev.'
        type: boolean
        default: false
        required: false

# Generic no-op job anchors are avoided; each matrix deploy job below declares its
# own environment-scoped, namespace-level concurrency lock.
#
# Concurrency strategy (SAFE DESIGN):
# - Workflow-level: UNIQUE group per run (cd-auto-{run_id} or cd-manual-{run_id})
#   with cancel-in-progress: FALSE. This NEVER cancels an in-progress Helm operation.
#   Each workflow run gets its own concurrency group so multiple runs can coexist.
# - Job-level: namespace-level lock `cd-deploy-<env>` with cancel-in-progress: FALSE.
#   This serializes Helm mutations across ALL runs (auto + manual) for the same env.
#   An in-progress `helm upgrade --wait` is NEVER interrupted.
# - Stale-run detection: In resolve-targets, auto runs compare CI_SHA vs origin/dev.
#   If stale (CI_SHA != origin/dev), the run exits early with run_deploy=false.
#   This makes stale runs no-ops WITHOUT cancelling them mid-Helm-operation.
# - Result: Rapid merges queue at the job-level lock. Latest commit wins because
#   stale runs become no-ops; the non-stale run acquires the lock and deploys.
#   Manual deployments wait for the lock but are never auto-cancelled.

concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('cd-auto-{0}', github.run_id) || format('cd-manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 - Change detection (automatic CI-triggered runs only)
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only a completed CI run triggers CD. On a failed CI run there is nothing to
    # deploy, so change detection is skipped (deployment is refused downstream in
    # resolve-targets). workflow_dispatch (manual) never runs change detection.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      customer-service: ${{ steps.filter.outputs.customer-service }}
      claims-service: ${{ steps.filter.outputs.claims-service }}
      agent-service: ${{ steps.filter.outputs.agent-service }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout code at CI head SHA
        uses: actions/checkout@v4
        with:
          # Diff exactly the commit CI validated, not the default-branch head.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        run: |
          # GitHub expressions cannot express HEAD~1, so compute it in the shell.
          # First parent of the CI-validated commit = the prior dev tip = exactly
          # the base for what the merged PR (or push) introduced.
          BASE_REF="$(git rev-parse "$GITHUB_SHA"^ 2>/dev/null || echo 'HEAD')"
          echo "base=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "Resolved diff base: $BASE_REF"

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          # Under workflow_run there is no implicit base, so provide it explicitly.
          ref: ${{ github.event.workflow_run.head_sha }}
          base: ${{ steps.base.outputs.base }}
          # Service filters fan out shared code:
          #  - common-lib/** and pom.xml -> all four (all depend on them)
          filters: |
            api-gateway:
              - 'api-gateway/**'
              - 'common-lib/**'
              - 'pom.xml'
            customer-service:
              - 'customer-service/**'
              - 'common-lib/**'
              - 'pom.xml'
            claims-service:
              - 'claims-service/**'
              - 'common-lib/**'
              - 'pom.xml'
            agent-service:
              - 'agent-service/**'
              - 'common-lib/**'
              - 'pom.xml'
            # Chart / values / deployment-config changes need a Helm sync.
            infra:
              - 'infrastructure/**'

  # ---------------------------------------------------------------------------
  # Job 2 - Resolve deployment targets
  # ---------------------------------------------------------------------------
  resolve-targets:
    name: Resolve Deployment Targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: detect-changes
    # detect-changes is SKIPPED on workflow_dispatch (its `if` requires a
    # workflow_run success) AND on failed CI runs. A job's implicit success()
    # would otherwise treat that skip as a failure and skip this resolver,
    # breaking manual deploys. Including a status function (`!cancelled()`) plus
    # an explicit result check makes this run for BOTH triggers (detect-changes
    # succeeded on a green CI run, or skipped on dispatch / failed CI) while still
    # being skipped if change detection genuinely failed.
    if: |
      !cancelled() &&
      (needs.detect-changes.result == 'success' || needs.detect-changes.result == 'skipped')
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      app_services: ${{ steps.resolve.outputs.app_services }}
      run_build: ${{ steps.resolve.outputs.run_build }}
      run_infra_sync: ${{ steps.resolve.outputs.run_infra_sync }}
      trigger_kind: ${{ steps.resolve.outputs.trigger_kind }}
      build_only: ${{ steps.resolve.outputs.build_only }}
      force_deploy: ${{ steps.resolve.outputs.force_deploy }}
      run_deploy: ${{ steps.resolve.outputs.run_deploy }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - name: Checkout repository for stale-run verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute deployment target
        id: resolve
        env:
          DISPATCH_ACTION: ${{ github.event.inputs.action }}
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
          DISPATCH_SERVICE: ${{ github.event.inputs.service }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
          CH_API: ${{ needs.detect-changes.outputs.api-gateway }}
          CH_CUSTOMER: ${{ needs.detect-changes.outputs.customer-service }}
          CH_CLAIMS: ${{ needs.detect-changes.outputs.claims-service }}
          CH_AGENT: ${{ needs.detect-changes.outputs.agent-service }}
          CH_INFRA: ${{ needs.detect-changes.outputs.infra }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${DISPATCH_ENV:-dev}"
            ACTION="${DISPATCH_ACTION:-deploy}"
            # Force deploy = full-environment bootstrap (build + deploy ALL four
            # services + install infra) in a single run. Only valid for DEV. It
            # intentionally bypasses change detection and the pre-built-image check.
            #
            # Robust boolean detection: FORCE_DEPLOY is bound to the TYPED
            # `inputs.force_deploy` context (stringifies to exactly "true"/"false"),
            # NOT the raw `github.event.inputs.force_deploy` string, so an enabled
            # checkbox can never be misrepresented and silently dropped.
            FORCE="${FORCE_DEPLOY:-false}"
            if [ "$FORCE" = "true" ]; then
              # An enabled force_deploy must NEVER silently fall through to a normal
              # manual deploy: fail loudly unless it is exactly the DEV bootstrap it
              # is meant for (action=deploy, environment=dev).
              if [ "$ACTION" != "deploy" ] || [ "$ENV" != "dev" ]; then
                echo "::error::force_deploy=true requires action=deploy and environment=dev."
                exit 1
              fi
              {
                echo "environment=$ENV"
                echo "trigger_kind=force-deploy"
                echo "build_only=false"
                echo "run_deploy=true"
                echo "run_build=true"
                echo "run_infra_sync=true"
                echo "force_deploy=true"
                echo "target_sha=${{ github.sha }}"
                echo 'app_services=["api-gateway","customer-service","claims-service","agent-service"]'
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "environment=$ENV"
              echo "run_infra_sync=false"
              echo "force_deploy=false"
              echo "target_sha=${{ github.sha }}"
            } >> "$GITHUB_OUTPUT"
            if [ "$ACTION" = "build-only" ]; then
              # Build & push immutable SHA images, then STOP. No deployment.
              {
                echo "trigger_kind=build-only"
                echo "build_only=true"
                echo "run_deploy=false"
                echo "run_build=true"
              } >> "$GITHUB_OUTPUT"
            else
              # Manual deploy: verify pre-built immutable images, then deploy.
              {
                echo "trigger_kind=manual"
                echo "build_only=false"
                echo "run_deploy=true"
                echo "run_build=false"
              } >> "$GITHUB_OUTPUT"
            fi
            if [ "$DISPATCH_SERVICE" = "all" ]; then
              echo 'app_services=["api-gateway","customer-service","claims-service","agent-service"]' >> "$GITHUB_OUTPUT"
            else
              echo "app_services=[\"$DISPATCH_SERVICE\"]" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Automatic CI-triggered run -> DEV only.
          # This is a `workflow_run` event. Only a SUCCESS post-merge (push) CI run
          # on dev may deploy; anything else (failed CI, PR-CI, other branch) is
          # refused here and degrades to a no-op run with no build/deploy.
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ] || \
             [ "${{ github.event.workflow_run.event }}" != "push" ] || \
             [ "${{ github.event.workflow_run.head_branch }}" != "dev" ]; then
            {
              echo "environment=dev"
              echo "trigger_kind=auto"
              echo "build_only=false"
              echo "force_deploy=false"
              echo "run_deploy=false"
              echo "run_build=false"
              echo "run_infra_sync=false"
              echo "target_sha=${{ github.event.workflow_run.head_sha }}"
              echo 'app_services=[]'
            } >> "$GITHUB_OUTPUT"
            echo "Skipping deployment: CI not a green post-merge run on dev."
            exit 0
          fi

          # Guard against a CI/CD race during PR merge. A successful CI run
          # must still correspond to the current tip of dev before CD deploys.
          CI_SHA="${{ github.event.workflow_run.head_sha }}"

          git fetch origin dev --quiet
          DEV_SHA="$(git rev-parse origin/dev)"

          echo "CI validated SHA: $CI_SHA"
          echo "Current dev SHA:  $DEV_SHA"

          if [ "$CI_SHA" != "$DEV_SHA" ]; then
            echo "::warning::Ignoring stale CI run. CI validated $CI_SHA but current dev is $DEV_SHA."
            {
              echo "environment=dev"
              echo "trigger_kind=auto"
              echo "build_only=false"
              echo "force_deploy=false"
              echo "run_deploy=false"
              echo "run_build=false"
              echo "run_infra_sync=false"
              echo "target_sha=$CI_SHA"
              echo 'app_services=[]'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "environment=dev"
            echo "trigger_kind=auto"
            echo "build_only=false"
            echo "force_deploy=false"
            echo "run_deploy=true"
            echo "target_sha=$CI_SHA"
          } >> "$GITHUB_OUTPUT"
          if [ "$CH_INFRA" = "true" ]; then
            echo "run_infra_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_infra_sync=false" >> "$GITHUB_OUTPUT"
          fi

          ITEMS=""
          for pair in "api-gateway:$CH_API" "customer-service:$CH_CUSTOMER" \
                      "claims-service:$CH_CLAIMS" "agent-service:$CH_AGENT"; do
            name="${pair%%:*}"; changed="${pair##*:}"
            if [ "$changed" = "true" ]; then
              ITEMS="$ITEMS${ITEMS:+,}\"$name\""
            fi
          done
          if [ -n "$ITEMS" ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "app_services=[$ITEMS]" >> "$GITHUB_OUTPUT"
          echo "Detected app services: [$ITEMS]"

  # ---------------------------------------------------------------------------
  # Job 3 - Build only the affected immutable images (reusable workflow)
  # ---------------------------------------------------------------------------
  build-images:
    name: Build Images
    permissions:
      contents: read
    # Explicit status function required: detect-changes is SKIPPED on
    # workflow_dispatch, and GitHub implicitly prepends success() to an if that
    # has none. success() scans the transitive needs closure, sees the skipped
    # detect-changes, and would skip this job even when run_build=true. !cancelled()
    # disables that implicit success() so the build runs on run_build==true.
    if: |
      !cancelled() &&
      needs.resolve-targets.outputs.run_build == 'true'
    needs: resolve-targets
    uses: ./.github/workflows/docker-build.yaml
    with:
      services: ${{ needs.resolve-targets.outputs.app_services }}
      # Build exactly the commit CI validated (target_sha), not the default-branch
      # head. On auto runs this is workflow_run.head_sha; on manual it is github.sha.
      ref: ${{ needs.resolve-targets.outputs.target_sha }}
      tag: ${{ needs.resolve-targets.outputs.target_sha }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Job 4 - Infrastructure / Helm synchronization (automatic push only)
  # ---------------------------------------------------------------------------
  # Re-renders the chart from SAVED release values so the infrastructure change is
  # actually applied while every service keeps its already-deployed SHA (no image
  # bump => no application rollout).
  infra-sync:
    name: Sync Infrastructure DEV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [resolve-targets, build-images]
    # build-images is SKIPPED on infra-only auto runs (run_build=false). A status
    # function is required: without it the implicit success() would treat that skip
    # as a failure and skip this job, breaking infra sync. We accept build-images
    # in 'success' OR 'skipped' and only reject a genuine build FAILURE. This also
    # guarantees the force_deploy bootstrap runs only AFTER all four images exist.
    if: |
      !cancelled() &&
      needs.resolve-targets.outputs.run_deploy == 'true' &&
      needs.resolve-targets.outputs.run_infra_sync == 'true' &&
      needs.resolve-targets.outputs.environment == 'dev' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    environment: dev
    concurrency:
      group: cd-deploy-dev
      cancel-in-progress: false
    env:
      CHART: infrastructure/helm/claimassist
      NAMESPACE: claimassist-dev
      RELEASE: claimassist-dev
      DOCKER_REGISTRY: claimassistdev
      # The exact commit being deployed (workflow_run.head_sha on auto runs,
      # github.sha on manual/force dispatch). GITHUB_SHA is unreliable under
      # workflow_run, so the SHA always comes from resolve-targets.
      TARGET_SHA: ${{ needs.resolve-targets.outputs.target_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-targets.outputs.target_sha }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8
        with:
          version: 'v1.27.0'
      - name: Set up Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78
        with:
          version: '3.16.4'
      - name: Configure kubectl (DEV credentials only)
        env:
          KUBE_CONFIG: ${{ secrets.DEV_KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::DEV_KUBE_CONFIG secret is not set on the 'dev' environment."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Validate chart (helm lint + template)
        run: |
          set -euo pipefail
          helm lint "$CHART"
          helm template "$RELEASE" "$CHART" -n "$NAMESPACE" \
            -f infrastructure/helm/claimassist/values-dev.yaml \
            --set image.registry="$DOCKER_REGISTRY" > /dev/null
      - name: Final stale check (auto runs only)
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          TARGET_SHA="${{ needs.resolve-targets.outputs.target_sha }}"
          echo "Final stale check: target_sha=$TARGET_SHA"
          git fetch origin dev --quiet
          CURRENT_DEV_SHA="$(git rev-parse origin/dev)"
          echo "Current origin/dev: $CURRENT_DEV_SHA"
          if [ "$TARGET_SHA" != "$CURRENT_DEV_SHA" ]; then
            echo "::warning::Stale deployment detected. Target SHA $TARGET_SHA != current dev $CURRENT_DEV_SHA."
            echo "::warning::Skipping infrastructure sync. A newer commit has been merged."
            exit 0
          fi
          echo "Freshness confirmed. Proceeding with Helm upgrade."
      - name: Ensure imagePullSecret exists (DEV)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::DOCKER_USERNAME/DOCKER_PASSWORD are required to create the imagePullSecret."
            exit 1
          fi
          kubectl create secret docker-registry claimassist-registry-credentials \
            --namespace "$NAMESPACE" \
            --docker-server=docker.io \
            --docker-username="$DOCKER_USERNAME" \
            --docker-password="$DOCKER_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Record pre-deployment image state
        id: pre-state
        run: |
          set -euo pipefail
          echo "Recording pre-deployment image state for infrastructure sync verification..."
          for svc in api-gateway customer-service claims-service agent-service; do
            DEP="claimassist-$svc"
            if kubectl get deployment "$DEP" -n "$NAMESPACE" &>/dev/null; then
              TAG=$(kubectl -n "$NAMESPACE" get deployment "$DEP" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*://')
              echo "PRE_${svc//-/_}_TAG=$TAG" >> "$GITHUB_ENV"
              echo "  $svc: $TAG"
            fi
          done
      - name: Apply infrastructure change via Helm (DEV)
        if: needs.resolve-targets.outputs.force_deploy != 'true'
        env:
          DEV_POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER }}
          DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          DEV_KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.DEV_KEYCLOAK_ADMIN_PASSWORD }}
          DEV_KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.DEV_KEYCLOAK_ADMIN_CLIENT_SECRET }}
          DEV_KEYCLOAK_DB_USER: ${{ secrets.DEV_KEYCLOAK_DB_USER }}
          DEV_KEYCLOAK_DB_PASSWORD: ${{ secrets.DEV_KEYCLOAK_DB_PASSWORD }}
        run: |
          set -euo pipefail

          # Fail fast if any required DEV credential is missing.
          for v in DEV_POSTGRES_USER DEV_POSTGRES_PASSWORD \
                    DEV_KEYCLOAK_ADMIN_PASSWORD DEV_KEYCLOAK_ADMIN_CLIENT_SECRET \
                    DEV_KEYCLOAK_DB_USER DEV_KEYCLOAK_DB_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v (GitHub secret, dev environment) is required for DEV infrastructure sync."
              exit 1
            fi
          done

          # Resolve CURRENT deployed images from Kubernetes Deployments (authoritative runtime state).
          # This happens WHILE HOLDING the deployment lock, preventing races with concurrent CD runs.
          # Helm values are NOT used for image-state resolution (they may be incomplete).
          # The resolver validates image format and rejects invalid tags (latest, 1.0.0, etc.).
          # If Deployments don't exist (first-ever bootstrap), use force_deploy=true instead.
          echo "Resolving current deployed images from Kubernetes Deployments..."

          RESOLVED_TAGS=$(.github/scripts/resolve-deployed-images.sh "$NAMESPACE" "$DOCKER_REGISTRY")

          # Parse resolved tags into array
          read -r API_TAG CUSTOMER_TAG CLAIMS_TAG AGENT_TAG <<< "$RESOLVED_TAGS"

          echo "Resolved current deployed images:"
          echo "  api-gateway: $API_TAG"
          echo "  customer-service: $CUSTOMER_TAG"
          echo "  claims-service: $CLAIMS_TAG"
          echo "  agent-service: $AGENT_TAG"

          # Build explicit image tag arguments for Helm
          IMAGE_TAG_ARGS=(
            "--set" "services.api-gateway.imageTag=$API_TAG"
            "--set" "services.customer-service.imageTag=$CUSTOMER_TAG"
            "--set" "services.claims-service.imageTag=$CLAIMS_TAG"
            "--set" "services.agent-service.imageTag=$AGENT_TAG"
          )

          helm upgrade "$RELEASE" "$CHART" -n "$NAMESPACE" \
            --install \
            --create-namespace \
            -f infrastructure/helm/claimassist/values-dev.yaml \
            --set image.registry="$DOCKER_REGISTRY" \
            "${IMAGE_TAG_ARGS[@]}" \
            --set postgresql.credentials.postgresUsername="$DEV_POSTGRES_USER" \
            --set postgresql.credentials.postgresPassword="$DEV_POSTGRES_PASSWORD" \
            --set keycloak.credentials.adminUsername="admin" \
            --set keycloak.credentials.adminPassword="$DEV_KEYCLOAK_ADMIN_PASSWORD" \
            --set keycloak.credentials.adminClientSecret="$DEV_KEYCLOAK_ADMIN_CLIENT_SECRET" \
            --set keycloak.postgresql.credentials.username="$DEV_KEYCLOAK_DB_USER" \
            --set keycloak.postgresql.credentials.password="$DEV_KEYCLOAK_DB_PASSWORD" \
            --wait \
            --timeout 10m
      - name: Bootstrap DEV environment (full install, all services at SHA)
        if: needs.resolve-targets.outputs.force_deploy == 'true'
        env:
          # Deployment-time DEV credentials. Provided as GitHub secrets (scoped to
          # the `dev` environment). A fresh bootstrap has NO prior Helm state to
          # inherit credentials from, so they MUST be injected here or the rendered
          # Secrets come out empty and PostgreSQL / Keycloak DB / Keycloak / Flyway
          # / all apps fail to start. They are referenced - never committed - and are
          # idempotent on retries (same values -> no drift).
          DEV_POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER }}
          DEV_POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          DEV_KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.DEV_KEYCLOAK_ADMIN_PASSWORD }}
          DEV_KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.DEV_KEYCLOAK_ADMIN_CLIENT_SECRET }}
          DEV_KEYCLOAK_DB_USER: ${{ secrets.DEV_KEYCLOAK_DB_USER }}
          DEV_KEYCLOAK_DB_PASSWORD: ${{ secrets.DEV_KEYCLOAK_DB_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          # Guard: fail loudly is any required credential is unset. A bootstrap with
          # an empty password would render an unusable StatefulSet and only fail
          # later inside Kubernetes with a confusing CrashLoopBackOff.
          for v in DEV_POSTGRES_USER DEV_POSTGRES_PASSWORD \
                    DEV_KEYCLOAK_ADMIN_PASSWORD DEV_KEYCLOAK_ADMIN_CLIENT_SECRET \
                    DEV_KEYCLOAK_DB_USER DEV_KEYCLOAK_DB_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v (GitHub secret, dev environment) is required for the DEV bootstrap."
              exit 1
            fi
          done
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::DOCKER_USERNAME/DOCKER_PASSWORD are required to create the imagePullSecret so the ARM64 node can pull claimassistdev images from Docker Hub."
            exit 1
          fi
          # Idempotent docker-registry imagePullSecret referenced by every Deployment
          # (values.image.pullSecret=claimassist-registry-credentials) so pulls on the
          # ARM64 node need no out-of-band kubectl. --dry-run=client | apply avoids
          # clobbering the secret's own .dockercfg token on retries.
          kubectl create secret docker-registry claimassist-registry-credentials \
            --namespace "$NAMESPACE" \
            --docker-server=docker.io \
            --docker-username="$DOCKER_USERNAME" \
            --docker-password="$DOCKER_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          # Verify all four immutable images exist before deploying.
          for svc in api-gateway customer-service claims-service agent-service; do
            IMAGE="claimassistdev/${svc}:${TARGET_SHA}"
            echo "Verifying image exists: $IMAGE"
            docker manifest inspect "$IMAGE" > /dev/null || {
              echo "::error::Image $IMAGE not found in registry. Build may have failed."
              exit 1
            }
            echo "Image verified: $IMAGE"
          done
          # FIRST-EVER DEV bootstrap: install the whole chart (shared infra +
          # all four application Deployments) in ONE helm upgrade, pinning EVERY
          # service to the immutable SHA so no Deployment falls back to the
          # default image.tag (1.0.0). Runs only after build-images has pushed
          # all four images at $TARGET_SHA (== CI-validated head_sha on auto).
          # --install --create-namespace make this idempotent: Helm owns the
          # Namespace, so no manual kubectl label/annotate is ever required and a
          # retry does not depend on prior Helm state or a pre-existing release.
          helm upgrade "$RELEASE" "$CHART" -n "$NAMESPACE" \
            --install \
            --create-namespace \
            -f infrastructure/helm/claimassist/values-dev.yaml \
            --set image.registry="$DOCKER_REGISTRY" \
            --set postgresql.credentials.postgresUsername="$DEV_POSTGRES_USER" \
            --set postgresql.credentials.postgresPassword="$DEV_POSTGRES_PASSWORD" \
            --set keycloak.credentials.adminUsername="admin" \
            --set keycloak.credentials.adminPassword="$DEV_KEYCLOAK_ADMIN_PASSWORD" \
            --set keycloak.credentials.adminClientSecret="$DEV_KEYCLOAK_ADMIN_CLIENT_SECRET" \
            --set keycloak.postgresql.credentials.username="$DEV_KEYCLOAK_DB_USER" \
            --set keycloak.postgresql.credentials.password="$DEV_KEYCLOAK_DB_PASSWORD" \
            --set services.api-gateway.imageTag="$TARGET_SHA" \
            --set services.customer-service.imageTag="$TARGET_SHA" \
            --set services.claims-service.imageTag="$TARGET_SHA" \
            --set services.agent-service.imageTag="$TARGET_SHA" \
            --wait \
            --timeout 10m
      - name: Verify rollout
        run: kubectl rollout status deployment -n "$NAMESPACE" --timeout=5m
      - name: Verify infrastructure sync preserved application images
        run: |
          set -euo pipefail
          echo "=== Infrastructure sync verification: app images unchanged ==="
          CHANGED=0
          for svc in api-gateway customer-service claims-service agent-service; do
            DEP="claimassist-$svc"
            if ! kubectl get deployment "$DEP" -n "$NAMESPACE" &>/dev/null; then
              echo "::error::INFRA-SYNC VERIFICATION FAILED: $DEP does not exist after infra sync."
              exit 1
            fi
            ACTUAL_IMAGE=$(kubectl -n "$NAMESPACE" get deployment "$DEP" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            ACTUAL_TAG="${ACTUAL_IMAGE##*:}"
            ENV_VAR="PRE_${svc//-/_}_TAG"
            EXPECTED_TAG="${!ENV_VAR:-}"
            if [ -n "$EXPECTED_TAG" ] && [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
              echo "::error::INFRA-SYNC VERIFICATION FAILED: $svc image changed during infra-only sync!"
              echo "::error::  Before: $EXPECTED_TAG"
              echo "::error::  After:  $ACTUAL_TAG"
              CHANGED=1
            else
              echo "  $svc: $ACTUAL_TAG (unchanged) [OK]"
            fi
          done
          if [ "$CHANGED" -ne 0 ]; then
            echo "::error::Infrastructure sync unexpectedly modified application images."
            exit 1
          fi
          echo "All four application images preserved after infrastructure sync."
      - name: Verify Helm release deployed state
        run: |
          set -euo pipefail
          RELEASE_STATUS=$(helm status claimassist-dev -n "$NAMESPACE" -o json | jq -r '.info.status')
          echo "Helm release status: $RELEASE_STATUS"
          if [ "$RELEASE_STATUS" != "deployed" ]; then
            echo "::error::Helm release not in 'deployed' state ($RELEASE_STATUS)."
            exit 1
          fi

  # ===========================================================================
  # Per-environment, per-service deployment (SERVICE-WISE, parallel matrix)
  # ===========================================================================
  # Each matrix element runs ONE `helm upgrade` that bumps ONLY that service to
  # the immutable SHA for the commit. `fail-fast: false` isolates failures, and
  # a SINGLE namespace-level concurrency lock serializes every operation on the
  # shared release so "all" and individual services can never race.

  # ------------------------------- DEV ---------------------------------------
  dev-deploy:
    name: Deploy ${{ matrix.service }} DEV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [resolve-targets, build-images]
    # build-images is SKIPPED on manual dispatch (run_build=false) and on
    # infra-only auto runs. A status function is required here: without it the
    # implicit success() would treat that skip as a failure and skip this deploy,
    # breaking manual DEV deploys. We accept build-images in 'success' OR
    # 'skipped' (manual/infra-only) and only reject a genuine build FAILURE, so
    # a manual deploy never rebuilds and never waits for a skipped build.
    # During force_deploy the per-service matrix is skipped entirely: the
    # bootstrap performs ONE whole-chart upgrade with all four SHA image tags, so
    # no service can ever fall back to the default image.tag (1.0.0).
    if: |
      !cancelled() &&
      needs.resolve-targets.outputs.run_deploy == 'true' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') &&
      needs.resolve-targets.outputs.environment == 'dev' &&
      needs.resolve-targets.outputs.force_deploy != 'true' &&
      needs.resolve-targets.outputs.app_services != '[]'
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve-targets.outputs.app_services) }}
    concurrency:
      group: cd-deploy-dev
      cancel-in-progress: false
    env:
      NAMESPACE: claimassist-dev
      DOCKER_REGISTRY: claimassistdev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-targets.outputs.target_sha }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8
        with:
          version: 'v1.27.0'
      - name: Set up Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78
        with:
          version: '3.16.4'
      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Verify immutable image exists
        env:
          IMAGE: claimassistdev/${{ matrix.service }}:${{ needs.resolve-targets.outputs.target_sha }}
        run: |
          set -euo pipefail
          docker manifest inspect "$IMAGE" > /dev/null
          echo "Image verified: claimassistdev/${{ matrix.service }}:${{ needs.resolve-targets.outputs.target_sha }}"
      - name: Configure kubectl (DEV credentials only)
        env:
          KUBE_CONFIG: ${{ secrets.DEV_KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::DEV_KUBE_CONFIG secret is not set on the 'dev' environment."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Final stale check (auto runs only)
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          TARGET_SHA="${{ needs.resolve-targets.outputs.target_sha }}"
          echo "Final stale check: target_sha=$TARGET_SHA"
          git fetch origin dev --quiet
          CURRENT_DEV_SHA="$(git rev-parse origin/dev)"
          echo "Current origin/dev: $CURRENT_DEV_SHA"
          if [ "$TARGET_SHA" != "$CURRENT_DEV_SHA" ]; then
            echo "::warning::Stale deployment detected. Target SHA $TARGET_SHA != current dev $CURRENT_DEV_SHA."
            echo "::warning::Skipping service deployment. A newer commit has been merged."
            exit 0
          fi
          echo "Freshness confirmed. Proceeding with Helm upgrade."
      - name: Record pre-deployment image state (race detection snapshot)
        id: pre-state
        run: |
          set -euo pipefail
          echo "Recording pre-deployment image state for race detection..."
          for svc in api-gateway customer-service claims-service agent-service; do
            DEP="claimassist-$svc"
            if kubectl get deployment "$DEP" -n "$NAMESPACE" &>/dev/null; then
              TAG=$(kubectl -n "$NAMESPACE" get deployment "$DEP" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*://')
              echo "PRE_${svc//-/_}_TAG=$TAG" >> "$GITHUB_ENV"
              echo "  $svc: $TAG"
            else
              echo "PRE_${svc//-/_}_TAG=" >> "$GITHUB_ENV"
              echo "  $svc: (not deployed)"
            fi
          done
      - name: Ensure imagePullSecret exists (DEV)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::DOCKER_USERNAME/DOCKER_PASSWORD are required to create the imagePullSecret."
            exit 1
          fi
          # Idempotent: create-or-update the docker-registry secret referenced by every Deployment.
          kubectl create secret docker-registry claimassist-registry-credentials \
            --namespace "$NAMESPACE" \
            --docker-server=docker.io \
            --docker-username="$DOCKER_USERNAME" \
            --docker-password="$DOCKER_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy ${{ matrix.service }} via Helm (immutable image)
        run: |
          set -euo pipefail
          CHART=infrastructure/helm/claimassist
          RELEASE=claimassist-dev
          # --install --create-namespace: idempotent. After the first bootstrap the
          # release already exists and Helm merges over it (bumping ONLY the targeted
          # service's imageTag to the immutable SHA); untouched services keep their
          # already-deployed SHA, so there is NO drift and NO 1.0.0 fallback.

          # Resolve CURRENT deployed images from Kubernetes Deployments (authoritative runtime state).
          # This happens WHILE HOLDING the deployment lock, preventing races with concurrent CD runs.
          # Helm values are NOT used for image-state resolution (they may be incomplete).
          # The resolver validates image format and rejects invalid tags (latest, 1.0.0, etc.).
          # If Deployments don't exist (first-ever bootstrap), use force_deploy=true instead.
          echo "Resolving current deployed images from Kubernetes Deployments..."

          RESOLVED_TAGS=$(.github/scripts/resolve-deployed-images.sh "$NAMESPACE" "$DOCKER_REGISTRY")

          # Parse resolved tags into array
          read -r API_TAG CUSTOMER_TAG CLAIMS_TAG AGENT_TAG <<< "$RESOLVED_TAGS"

          echo "Resolved current deployed images:"
          echo "  api-gateway: $API_TAG"
          echo "  customer-service: $CUSTOMER_TAG"
          echo "  claims-service: $CLAIMS_TAG"
          echo "  agent-service: $AGENT_TAG"

          # Update ONLY the service represented by this matrix job.
          # Override the resolved current tag with the target SHA for this service.
          case "${{ matrix.service }}" in
            api-gateway)
              API_TAG="${{ needs.resolve-targets.outputs.target_sha }}"
              ;;
            customer-service)
              CUSTOMER_TAG="${{ needs.resolve-targets.outputs.target_sha }}"
              ;;
            claims-service)
              CLAIMS_TAG="${{ needs.resolve-targets.outputs.target_sha }}"
              ;;
            agent-service)
              AGENT_TAG="${{ needs.resolve-targets.outputs.target_sha }}"
              ;;
            *)
              echo "::error::Unknown service: ${{ matrix.service }}"
              exit 1
              ;;
          esac

          echo "Final image tags (after applying target service override):"
          echo "  api-gateway=$API_TAG"
          echo "  customer-service=$CUSTOMER_TAG"
          echo "  claims-service=$CLAIMS_TAG"
          echo "  agent-service=$AGENT_TAG"

          # Verify all four immutable images before changing the release.
          for pair in \
            "api-gateway:$API_TAG" \
            "customer-service:$CUSTOMER_TAG" \
            "claims-service:$CLAIMS_TAG" \
            "agent-service:$AGENT_TAG"; do

            svc="${pair%%:*}"
            tag="${pair#*:}"
            IMAGE="claimassistdev/${svc}:${tag}"

            echo "Verifying image: $IMAGE"
            docker manifest inspect "$IMAGE" > /dev/null
          done

          # Explicitly pass ALL four imageTags.
          # This prevents Helm from falling back to image.tag=1.0.0.
          helm upgrade "$RELEASE" "$CHART" -n "$NAMESPACE" \
            --install \
            --create-namespace \
            -f infrastructure/helm/claimassist/values-dev.yaml \
            --set image.registry="$DOCKER_REGISTRY" \
            --set "services.api-gateway.imageTag=$API_TAG" \
            --set "services.customer-service.imageTag=$CUSTOMER_TAG" \
            --set "services.claims-service.imageTag=$CLAIMS_TAG" \
            --set "services.agent-service.imageTag=$AGENT_TAG" \
            --wait \
            --timeout 10m
      - name: Wait for rollout to complete
        run: kubectl -n "$NAMESPACE" rollout status "deployment/claimassist-${{ matrix.service }}" --timeout=10m
      - name: Verify deployment is healthy
        run: |
          set -euo pipefail
          DEP="claimassist-${{ matrix.service }}"
          AVAILABLE=$(kubectl -n "$NAMESPACE" get deployment "$DEP" -o jsonpath='{.status.conditions[?(@.type=="Available")].status}')
          READY=$(kubectl -n "$NAMESPACE" get deployment "$DEP" -o jsonpath='{.status.readyReplicas}')
          DESIRED=$(kubectl -n "$NAMESPACE" get deployment "$DEP" -o jsonpath='{.spec.replicas}')
          echo "Available condition: $AVAILABLE | readyReplicas: ${READY:-0} / desired: $DESIRED"
          if [ "$AVAILABLE" != "True" ] || [ "${READY:-0}" -lt "${DESIRED:-1}" ]; then
            echo "::error::$DEP did not become healthy after rollout."
            kubectl -n "$NAMESPACE" get pods -l "app.kubernetes.io/component=${{ matrix.service }}"
            exit 1
          fi
      - name: Verify post-deployment image state (all four services)
        run: |
          set -euo pipefail
          echo "=== Post-deployment image verification ==="
          EXPECTED_TAG="${{ needs.resolve-targets.outputs.target_sha }}"
          DEPLOYED_SVC="${{ matrix.service }}"

          for svc in api-gateway customer-service claims-service agent-service; do
            DEP="claimassist-$svc"
            if ! kubectl get deployment "$DEP" -n "$NAMESPACE" &>/dev/null; then
              echo "::error::POST-DEPLOY FAILED: $DEP does not exist."
              exit 1
            fi
            ACTUAL_IMAGE=$(kubectl -n "$NAMESPACE" get deployment "$DEP" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            ACTUAL_TAG="${ACTUAL_IMAGE##*:}"

            if [ "$svc" = "$DEPLOYED_SVC" ]; then
              if [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
                echo "::error::POST-DEPLOY FAILED: $svc expected '$EXPECTED_TAG' but has '$ACTUAL_TAG'"
                exit 1
              fi
              echo "  $svc: $ACTUAL_TAG [UPDATED]"
            else
              ENV_VAR="PRE_${svc//-/_}_TAG"
              EXPECTED_SIBLING="${!ENV_VAR:-}"
              if [ -n "$EXPECTED_SIBLING" ] && [ "$ACTUAL_TAG" != "$EXPECTED_SIBLING" ]; then
                echo "::error::POST-DEPLOY FAILED: Sibling $svc unexpectedly changed ($EXPECTED_SIBLING -> $ACTUAL_TAG)"
                exit 1
              fi
              echo "  $svc: $ACTUAL_TAG [PRESERVED]"
            fi
          done
          echo "All four service images verified."
      - name: Verify Helm release deployed state
        run: |
          set -euo pipefail
          RELEASE_STATUS=$(helm status claimassist-dev -n "$NAMESPACE" -o json | jq -r '.info.status')
          echo "Helm release status: $RELEASE_STATUS"
          if [ "$RELEASE_STATUS" != "deployed" ]; then
            echo "::error::Helm release not in 'deployed' state ($RELEASE_STATUS). Check helm history."
            exit 1
          fi

  dev-validation:
    name: DEV Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [resolve-targets, dev-deploy, infra-sync]
    # infra-sync is SKIPPED when there is no infrastructure change; dev-deploy is
    # skipped when there is no app change. A status function keeps this
    # informational validation running whenever the environment resolves to dev.
    if: |
      !cancelled() &&
      needs.resolve-targets.outputs.run_deploy == 'true' &&
      needs.resolve-targets.outputs.environment == 'dev'
    steps:
      - name: Validate DEV deployment result
        run: |
          echo "=== DEV Deployment Summary ==="
          echo "Services deployed: ${{ needs.resolve-targets.outputs.app_services }}"
          echo "Infra sync triggered: ${{ needs.resolve-targets.outputs.run_infra_sync }}"
          echo "Target SHA: ${{ needs.resolve-targets.outputs.target_sha }}"
          echo "Trigger kind: ${{ needs.resolve-targets.outputs.trigger_kind }}"
          echo ""
          echo "All deployment jobs completed successfully."
          echo "Post-deployment image verification was performed in each deploy job."
          echo "DEV validation passed."

  # ------------------------------- STAGE -------------------------------------
  stage-deploy:
    name: Deploy ${{ matrix.service }} STAGE
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: resolve-targets
    if: needs.resolve-targets.outputs.run_deploy == 'true' && needs.resolve-targets.outputs.environment == 'stage' && needs.resolve-targets.outputs.app_services != '[]'
    environment: stage
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve-targets.outputs.app_services) }}
    concurrency:
      group: cd-deploy-stage
      cancel-in-progress: false
    env:
      NAMESPACE: claimassist-stage
      DOCKER_REGISTRY: claimassistdev
    steps:
      - name: Checkout code at target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-targets.outputs.target_sha }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8
        with:
          version: 'v1.27.0'
      - name: Set up Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78
        with:
          version: '3.16.4'
      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Verify immutable image exists
        env:
          IMAGE: claimassistdev/${{ matrix.service }}:${{ needs.resolve-targets.outputs.target_sha }}
        run: |
          set -euo pipefail
          docker manifest inspect "$IMAGE" > /dev/null
          echo "Image verified: claimassistdev/${{ matrix.service }}:${{ needs.resolve-targets.outputs.target_sha }}"
      - name: Configure kubectl (STAGE credentials only)
        env:
          KUBE_CONFIG: ${{ secrets.STAGE_KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::STAGE_KUBE_CONFIG secret is not set on the 'stage' environment."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy ${{ matrix.service }} via Helm (immutable image)
        run: |
          set -euo pipefail
          CHART=infrastructure/helm/claimassist
          RELEASE=claimassist-stage
          helm upgrade "$RELEASE" "$CHART" -n "$NAMESPACE" \
            --set image.registry="$DOCKER_REGISTRY" \
            --set "services.${{ matrix.service }}.imageTag=${{ needs.resolve-targets.outputs.target_sha }}" \
            --wait \
            --timeout 10m
      - name: Wait for rollout to complete
        run: kubectl -n "$NAMESPACE" rollout status "deployment/claimassist-${{ matrix.service }}" --timeout=10m
      - name: Verify deployment is healthy
        run: |
          set -euo pipefail
          DEP="claimassist-${{ matrix.service }}"
          AVAILABLE=$(kubectl -n "$NAMESPACE" get deployment "$DEP" -o jsonpath='{.status.conditions[?(@.type=="Available")].status}')
          READY=$(kubectl -n "$NAMESPACE" get deployment "$DEP" -o jsonpath='{.status.readyReplicas}')
          DESIRED=$(kubectl -n "$NAMESPACE" get deployment "$DEP" -o jsonpath='{.spec.replicas}')
          echo "Available condition: $AVAILABLE | readyReplicas: ${READY:-0} / desired: $DESIRED"
          if [ "$AVAILABLE" != "True" ] || [ "${READY:-0}" -lt "${DESIRED:-1}" ]; then
            echo "::error::$DEP did not become healthy after rollout."
            kubectl -n "$NAMESPACE" get pods -l "app.kubernetes.io/component=${{ matrix.service }}"
            exit 1
          fi

  stage-validation:
    name: STAGE Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [resolve-targets, stage-deploy]
    if: needs.resolve-targets.outputs.run_deploy == 'true' && needs.resolve-targets.outputs.environment == 'stage'
    steps:
      - name: Validate STAGE deployment result
        run: |
          echo "STAGE services deployed: ${{ needs.resolve-targets.outputs.app_services }}"
          echo "STAGE validation passed."

  # ------------------------------- PROD --------------------------------------
  prod-deploy:
    name: Deploy ${{ matrix.service }} PROD
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: resolve-targets
    if: needs.resolve-targets.outputs.run_deploy == 'true' && needs.resolve-targets.outputs.environment == 'prod' && needs.resolve-targets.outputs.app_services != '[]'
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve-targets.outputs.app_services) }}
    concurrency:
      group: cd-deploy-prod
      cancel-in-progress: false
    env:
      NAMESPACE: claimassist-prod
      DOCKER_REGISTRY: claimassistdev
    steps:
      - name: Checkout code at target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-targets.outputs.target_sha }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8
        with:
          version: 'v1.27.0'
      - name: Set up Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78
        with:
          version: '3.16.4'
      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Verify immutable image exists
        env:
          IMAGE: claimassistdev/${{ matrix.service }}:${{ needs.resolve-targets.outputs.target_sha }}
        run: |
          set -euo pipefail
          docker manifest inspect "$IMAGE" > /dev/null
          echo "Image verified: claimassistdev/${{ matrix.service }}:${{ needs.resolve-targets.outputs.target_sha }}"
      - name: Configure kubectl (PROD credentials only)
        env:
          KUBE_CONFIG: ${{ secrets.PROD_KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::PROD_KUBE_CONFIG secret is not set on the 'prod' environment."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy ${{ matrix.service }} via Helm (immutable image)
        run: |
          set -euo pipefail
          CHART=infrastructure/helm/claimassist
          RELEASE=claimassist-prod
          helm upgrade "$RELEASE" "$CHART" -n "$NAMESPACE" \
            --set image.registry="$DOCKER_REGISTRY" \
            --set "services.${{ matrix.service }}.imageTag=${{ needs.resolve-targets.outputs.target_sha }}" \
            --wait \
            --timeout 10m
      - name: Wait for rollout to complete
        run: kubectl -n "$NAMESPACE" rollout status "deployment/claimassist-${{ matrix.service }}" --timeout=10m
      - name: Verify deployment is healthy
        run: |
          set -euo pipefail
          DEP="claimassist-${{ matrix.service }}"
          AVAILABLE=$(kubectl -n "$NAMESPACE" get deployment "$DEP" -o jsonpath='{.status.conditions[?(@.type=="Available")].status}')
          READY=$(kubectl -n "$NAMESPACE" get deployment "$DEP" -o jsonpath='{.status.readyReplicas}')
          DESIRED=$(kubectl -n "$NAMESPACE" get deployment "$DEP" -o jsonpath='{.spec.replicas}')
          echo "Available condition: $AVAILABLE | readyReplicas: ${READY:-0} / desired: $DESIRED"
          if [ "$AVAILABLE" != "True" ] || [ "${READY:-0}" -lt "${DESIRED:-1}" ]; then
            echo "::error::$DEP did not become healthy after rollout."
            kubectl -n "$NAMESPACE" get pods -l "app.kubernetes.io/component=${{ matrix.service }}"
            exit 1
          fi

  prod-validation:
    name: PROD Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [resolve-targets, prod-deploy]
    if: needs.resolve-targets.outputs.run_deploy == 'true' && needs.resolve-targets.outputs.environment == 'prod'
    steps:
      - name: Validate PROD deployment result
        run: |
          echo "PROD services deployed: ${{ needs.resolve-targets.outputs.app_services }}"
          echo "PROD validation passed."

  # ---------------------------------------------------------------------------
  # Deployment summary
  # ---------------------------------------------------------------------------
  deployment-summary:
    name: Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: always()
    needs: resolve-targets
    steps:
      - name: Print run summary
        run: |
          echo "Action            : ${{ needs.resolve-targets.outputs.trigger_kind }} (build_only=${{ needs.resolve-targets.outputs.build_only }})"
          echo "Environment        : ${{ needs.resolve-targets.outputs.environment }}"
          echo "Services involved  : ${{ needs.resolve-targets.outputs.app_services }}"
          echo "Trigger            : ${{ needs.resolve-targets.outputs.trigger_kind }} (${{ github.event_name }})"
          echo "Target SHA         : ${{ needs.resolve-targets.outputs.target_sha }}"
          echo "Build ran          : ${{ needs.resolve-targets.outputs.run_build }}"
          echo "Deploy ran         : ${{ needs.resolve-targets.outputs.run_deploy }}"
          echo "Infra sync ran     : ${{ needs.resolve-targets.outputs.run_infra_sync }}"
          echo "Workflow run ID    : ${{ github.run_id }}"
