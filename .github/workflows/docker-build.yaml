name: Build Docker Images

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.java'
      - '**.xml'
      - 'Dockerfile*'
      - '.github/workflows/docker-build.yaml'

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [claims-service, customer-service, agent-service, api-gateway, config-service, discovery-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "tag=dev-latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/claimassist-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/claimassist-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/claimassist-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/claimassist-${{ matrix.service }}:buildcache,mode=max
