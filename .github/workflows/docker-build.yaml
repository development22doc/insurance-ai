# =============================================================================
# ClaimAssist - Reusable container image build (Docker)
# =============================================================================
# Builds ONLY the affected application images as IMMUTABLE tags (git SHA) and
# pushes them to Docker Hub: `claimassist/<service>:<sha>`.
# Invoked by .github/workflows/cd.yml (`build-images` job) so that a deployment
# can never start before the exact immutable image for the commit exists.
#
# Context: the repository ROOT is the Docker build context (each service
# Dockerfile does `COPY . .` then builds the reactor subset
# `-pl <service> -am package`). Pushing to the registry gives Helm a concrete
# immutable image tag to reference with NO "latest"-style supply-chain drift.
#
# Inputs:
#   services  - JSON array of the services to build, e.g.
#               '["api-gateway","customer-service"]'
#   tag       - immutable tag to apply (the commit SHA, supplied by the caller)
# =============================================================================

name: docker-build

on:
  workflow_call:
    inputs:
      services:
        description: 'JSON array of services to build, e.g. ["api-gateway"]'
        required: true
        type: string
      tag:
        description: 'Immutable image tag to build and push (git SHA).'
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  docker-build:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Isolate failures: an independent service build failure must not cancel
      # or skip its peers.
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Each Dockerfile builds from the repository root (reactor + common-lib),
        # so a full checkout is required and `path:` context is not used.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: >
            ${{ secrets.DOCKER_USERNAME }}/claimassist/${{ matrix.service }}:${{ inputs.tag }}
          # Buildx-local build cache (GHA cache backend) avoids re-downloading
          # Maven dependencies on every run; keyed by service + tag + runner OS.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Never write the immutable SHA-tagged image without a clean tag-name
          # guarantee; the tag IS the commit SHA, so no retag/alias step is needed.