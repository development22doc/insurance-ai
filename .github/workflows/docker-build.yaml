name: Build and Push Images

# DEV-ONLY image build. Images are built once for the `dev` branch and pushed
# tagged with the immutable Git SHA (claimassist/<service>:<git-sha>). The Deploy
# workflow deploys this same SHA tag (image.tag=<git-sha>); nothing is rebuilt on deploy.
#
# Multi-arch (linux/amd64 + linux/arm64): the DEV K3s node is ARM64 (Oracle Linux
# 9.8 aarch64), so every application image is built as a multi-platform manifest.
# QEMU/binfmt emulation lets buildx produce the arm64 variant on the amd64 runner.
#
# Only the four application services in the Helm chart are built. config-service
# and discovery-service are LOCAL/Docker-compose-only and are NOT deployed by the
# chart, so they are not built here. No `main`/STAGE/PROD build path exists.
on:
  push:
    branches:
      - dev
    paths:
      - '**.java'
      - '**.xml'
      - 'Dockerfile*'
      - '.github/workflows/docker-build.yaml'

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [claims-service, customer-service, agent-service, api-gateway]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # QEMU/binfmt emulation: enables building the arm64 variant on the amd64
      # ubuntu-latest runner (required before Buildx for multi-platform output).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push immutable image (Git SHA tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Multi-platform manifest: amd64 + arm64. The DEV K3s node is ARM64;
          # amd64 is preserved for portability/any x86 tooling. Both archs share
          # the single immutable Git SHA tag below.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/claimassist/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/claimassist/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/claimassist/${{ matrix.service }}:buildcache,mode=max