name: SonarQube Cloud

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
        cache: maven

    - name: Verify and run SonarQube Cloud analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
          -Dsonar.organization=development22doc \
          -Dsonar.projectKey=development22doc_insurance-ai \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.coverage.jacoco.xmlReportPaths="common-lib/target/site/jacoco/jacoco.xml,discovery-service/target/site/jacoco/jacoco.xml,config-service/target/site/jacoco/jacoco.xml,api-gateway/target/site/jacoco/jacoco.xml,customer-service/target/site/jacoco/jacoco.xml,claims-service/target/site/jacoco/jacoco.xml,agent-service/target/site/jacoco/jacoco.xml"