# LOCAL-K8S: API Gateway connecting to OCI K3s dependencies via Tailscale NodePorts
# Profile: local-k8s
#
# This profile is for IntelliJ/local debugging against the real OCI K3s infrastructure.
# All services connect through the shared Tailscale-accessible NodePorts.
#
# Shared infrastructure NodePorts (Tailscale):
#   PostgreSQL: 100.114.133.69:30432
#   Redis:      100.114.133.69:30379
#   Kafka:      100.114.133.69:30092
#   Keycloak:   100.114.133.69:30080
#   Zipkin:     100.114.133.69:30941
#   Loki:       100.114.133.69:30310
#   Prometheus: 100.114.133.69:30900
#   Grafana:    100.114.133.69:30300

server:
  port: 8080
  shutdown: graceful

# Developer identity for observability
claimassist:
  dev:
    id: ${CLAIMASSIST_DEV_ID:local}
    name: ${CLAIMASSIST_DEVELOPER_NAME:unknown}

spring:
  config:
    import: optional:file:../application-local-k8s.properties
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path=/customer/**
              filters:
                - StripPrefix=1

            - id: claims-service
              uri: http://localhost:8082
              predicates:
                - Path=/claims/**
              filters:
                - StripPrefix=1

            - id: agent-service
              uri: http://localhost:8083
              predicates:
                - Path=/agent/**
              filters:
                - StripPrefix=1

            - id: policy-service
              uri: http://localhost:8084
              predicates:
                - Path=/policies/**
              filters:
                - StripPrefix=1

  data:
    redis:
      host: ${REDIS_HOST:100.114.133.69}
      port: ${REDIS_PORT:30379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://100.114.133.69:30080/realms/claimassist-dev}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://100.114.133.69:30080/realms/claimassist-dev/protocol/openid-connect/certs}

  lifecycle:
    timeout-per-shutdown-phase: 15s
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:false}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30

app:
  security:
    public-routes:
      - /customer/auth/signup
      - /customer/auth/authorize
      - /customer/auth/callback
      - /customer/auth/refresh
      - /customer/auth/logout
      - /customer/webhooks/**
      - /api/v1/auth/signup
      - /api/v1/auth/authorize
      - /api/v1/auth/callback
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /customer/actuator/health
      - /customer/actuator/health/**
      - /claims/actuator/health
      - /claims/actuator/health/**
      - /agent/actuator/health
      - /agent/actuator/health/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    enable:
      jvm: true
      process: true
      logback: true
      redis: true

    distribution:
      percentiles-histogram:
        http.server.requests: true
        redis.command.duration: true

    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://100.114.133.69:30941/api/v2/spans}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
    reactor.netty.http.client: DEBUG

  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

commonlib:
  performance:
    info-threshold-ms: 100
    warn-threshold-ms: 500
    error-threshold-ms: 2000
    categories:
      REQUEST:
        info: 100
        warn: 500
        error: 2000
