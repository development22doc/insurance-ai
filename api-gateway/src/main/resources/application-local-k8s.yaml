# LOCAL-K8S: API Gateway connecting to OCI K3s dependencies via SSH tunnels
# Profile: local-k8s
#
# This profile is for IntelliJ/local debugging against the real OCI K3s infrastructure.
#
# Prerequisites (run once):
#   scripts/oci-k8s-connect.ps1
#
# This establishes SSH tunnels:
#   PostgreSQL: localhost:15432 â†’ claimassist-postgresql:5432
#   Redis:      localhost:16379 â†’ claimassist-redis:6379
#   Kafka:      localhost:9092  â†’ claimassist-kafka:9092
#   Keycloak:   localhost:18080 â†’ claimassist-keycloak:8080

server:
  port: 8080
  shutdown: graceful

spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path=/customer/**
              filters:
                - StripPrefix=1

            - id: claims-service
              uri: http://localhost:8082
              predicates:
                - Path=/claims/**
              filters:
                - StripPrefix=1

            - id: agent-service
              uri: http://localhost:8083
              predicates:
                - Path=/agent/**
              filters:
                - StripPrefix=1

            - id: policy-service
              uri: http://localhost:8081
              predicates:
                - Path=/policies/**
              filters:
                - StripPrefix=1

  config:
    import: ""

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:18080/realms/claimassist-dev}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://127.0.0.1:18080/realms/claimassist-dev/protocol/openid-connect/certs}

  lifecycle:
    timeout-per-shutdown-phase: 15s
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  security:
    public-routes:
      - /customer/auth/signup
      - /customer/auth/authorize
      - /customer/auth/callback
      - /customer/auth/refresh
      - /customer/auth/logout
      - /customer/webhooks/**
      - /api/v1/auth/signup
      - /api/v1/auth/authorize
      - /api/v1/auth/callback
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    enable:
      jvm: true
      process: true
      logback: true
      redis: true

    distribution:
      percentiles-histogram:
        http.server.requests: true
        redis.command.duration: true

    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:19411/api/v2/spans}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
    reactor.netty.http.client: DEBUG

  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

commonlib:
  performance:
    info-threshold-ms: 100
    warn-threshold-ms: 500
    error-threshold-ms: 2000
    categories:
      REQUEST:
        info: 100
        warn: 500
        error: 2000

