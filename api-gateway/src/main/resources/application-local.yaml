server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/claimassist}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/claimassist/protocol/openid-connect/certs}

  # Local gateway routes so the gateway can operate without a Config Server during
  # development. The same routes are available from the config repo, but when the
  # config server is unavailable the gateway needs local fallbacks to forward
  # /customer/** to the customer service.
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/customer/**

# Public routes that should be accessible without a bearer JWT. These are
# normally supplied by the centralized config repository (local-config-repo),
# but we provide local defaults so the gateway allows the OAuth authorization
# endpoints to be reached while developing without the config server.
app:
  security:
    public-routes:
      - /customer/auth/signup
      - /customer/auth/authorize
      - /customer/auth/callback
      - /customer/auth/refresh
      - /customer/auth/logout
      - /customer/webhooks/**
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
