server:
  port: 8080

spring:
  cloud:
    gateway:
      default-filters:
        - name: CircuitBreaker
          args:
            name: api-gateway
            fallbackUri: forward:/fallback

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/claimassist}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/claimassist/protocol/openid-connect/certs}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

management:
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG

