server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/claimassist}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/claimassist/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: actuator
            uri: forward:/actuator
            predicates:
              - Path=/actuator/**

          - id: customer-service
            uri: lb://CUSTOMER-SERVICE
            predicates:
              - Path=/customer/**
            filters:
              - StripPrefix=1

      # (removed explicit webflux-namespaced actuator-webflux route) - the
      # gateway's own actuator endpoints are served by the application context
      # and do not require an explicit business route. Previously a WebFlux
      # namespaced `actuator-webflux` route was added to work around a
      # runtime property mapping issue; investigation showed the actuator
      # endpoint is registered and reachable without this route. We remove the
      # synthetic route to avoid confusion and unintended routing behavior.

# Public routes that should be accessible without a bearer JWT.
# normally supplied by the centralized config repository (config-repo),
# but we provide local defaults so the gateway allows the OAuth authorization
# endpoints to be reached while developing without the config server.
app:
  security:
    public-routes:
      - /customer/auth/signup
      - /customer/auth/authorize
      - /customer/auth/callback
      - /customer/auth/refresh
      - /customer/auth/logout
      - /customer/webhooks/**
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: prometheus

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO

# Performance logging thresholds (ms) - api-gateway uses REQUEST category
commonlib:
  performance:
    info-threshold-ms: 100
    warn-threshold-ms: 500
    error-threshold-ms: 2000
    categories:
      REQUEST:
        info: 100
        warn: 500
        error: 2000



