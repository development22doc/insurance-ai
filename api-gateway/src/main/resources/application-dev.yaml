server:
  port: 8080

spring:
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      enabled: true
      import-check:
        enabled: true
    gateway:
      default-filters:
        # No fallbackUri: there is no /fallback handler. When the circuit breaker
        # opens, CallNotPermittedException propagates to GatewayExceptionHandler which
        # returns a controlled 503 (not a misleading 404/loop to a non-existent route).
        - name: CircuitBreaker
          args:
            name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/claimassist}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8180/realms/claimassist/protocol/openid-connect/certs}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://discovery-service:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  tracing:
    sampling:
      probability: 0.5

logging:
  level:
    com.claimassist: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: WARN

# Performance logging thresholds (ms) - api-gateway uses REQUEST category
commonlib:
  performance:
    info-threshold-ms: 100
    warn-threshold-ms: 500
    error-threshold-ms: 2000
    categories:
      REQUEST:
        info: 100
        warn: 500
        error: 2000

