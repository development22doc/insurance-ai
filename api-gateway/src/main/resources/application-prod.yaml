server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024

spring:
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      enabled: true
      import-check:
        enabled: true
    gateway:
      default-filters:
        # No fallbackUri: there is no /fallback handler. When the circuit breaker
        # opens, CallNotPermittedException propagates to GatewayExceptionHandler which
        # returns a controlled 503 (not a misleading 404/loop to a non-existent route).
        - name: CircuitBreaker
          args:
            name: api-gateway
      streamingMediaTypes:
        - text/event-stream
        - application/stream+json

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 50
          max-idle: 25
          min-idle: 10

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
    register-with-eureka: true
    fetch-registry: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  tracing:
    sampling:
      probability: 0.1
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.claimassist: WARN
    org.springframework: WARN
    org.springframework.cloud.gateway: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# Production CORS defaults for the gateway. This can be overridden by
# setting the environment variable CORS_ALLOWED_ORIGINS or the application
# property 'cors.allowed-origins'. Values should be comma-separated.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://gateway.claimassist.example.com,https://app.claimassist.example.com}

