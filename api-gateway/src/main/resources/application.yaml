spring:
  application:
    name: api-gateway

  # API Gateway (WebFlux) does not use a database. common-lib brings
  # spring-boot-starter-data-jpa onto the classpath; without these excludes Boot
  # would attempt to configure a DataSource/EntityManagerFactory and fail because
  # no datasource URL is set.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

  config:
    # Require Config Server import so gateway will not start with missing remote configuration.
    # Changed from `optional:configserver:` to `configserver:` to make the import mandatory.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
