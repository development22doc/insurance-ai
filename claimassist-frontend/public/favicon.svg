<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e9ecef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dee2e6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Antenna -->
  <rect x="30" y="4" width="4" height="8" fill="#adb5bd" rx="1" />
  <circle cx="32" cy="6" r="3" fill="#00d4ff" filter="url(#glow)" />

  <!-- Robot head body -->
  <rect x="12" y="14" width="40" height="44" rx="12" fill="url(#bodyGradient)" stroke="#ced4da" stroke-width="2" />

  <!-- Face/display area -->
  <rect x="18" y="22" width="28" height="28" rx="8" fill="url(#faceGradient)" />

  <!-- Left eye -->
  <ellipse cx="26" cy="36" rx="5" ry="6" fill="url(#eyeGradient)" filter="url(#glow)" />
  <ellipse cx="26" cy="36" rx="3" ry="4" fill="#ffffff" opacity="0.3" />

  <!-- Right eye -->
  <ellipse cx="38" cy="36" rx="5" ry="6" fill="url(#eyeGradient)" filter="url(#glow)" />
  <ellipse cx="38" cy="36" rx="3" ry="4" fill="#ffffff" opacity="0.3" />

  <!-- Subtle highlight on head -->
  <ellipse cx="20" cy="20" rx="4" ry="3" fill="#ffffff" opacity="0.4" />
</svg>
