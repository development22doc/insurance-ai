# Prometheus configuration for ClaimAssist Insurance AI Platform
# Auto-discovers and scrapes metrics from all microservices
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: claimassist-local
    environment: local
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      # Use the prometheus service name so Prometheus scrapes itself when
      # running inside Docker Compose
      - targets: ['prometheus:9090']
  # Discovery Service - Eureka Server
  - job_name: 'discovery-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      # The application services are expected to run on the host during
      # development. From inside Docker Desktop containers use
      # host.docker.internal to reach services running on the host machine.
      - targets: ['host.docker.internal:8761']
        labels:
          service: 'discovery-service'
          instance_type: 'local'
  # Config Service
  - job_name: 'config-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:8888']
        labels:
          service: 'config-service'
          instance_type: 'local'
  # API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'api-gateway'
          instance_type: 'local'
  # Customer Service
  - job_name: 'customer-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'customer-service'
          instance_type: 'local'
  # Claims Service
  - job_name: 'claims-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: 'claims-service'
          instance_type: 'local'
  # Agent Service
  - job_name: 'agent-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          service: 'agent-service'
          instance_type: 'local'
  # Policy Service
  - job_name: 'policy-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:8084']
        labels:
          service: 'policy-service'
          instance_type: 'local'
  # Zipkin - Distributed Tracing
  - job_name: 'zipkin'
    static_configs:
      - targets: ['host.docker.internal:9411']
        labels:
          service: 'zipkin'
