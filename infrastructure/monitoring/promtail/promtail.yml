server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: discovery-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: discovery-service
          service: discovery-service
          application: claimassist
          environment: local
          __path__: /var/log/discovery-service/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            traceId: traceId
            spanId: spanId
            correlationId: correlationId
      - labels:
          level: level
          logger: logger
          traceId: traceId
          spanId: spanId
          correlationId: correlationId
      - timestamp:
          source: timestamp
          format: RFC3339Nano
