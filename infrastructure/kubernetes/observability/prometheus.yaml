apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: claimassist-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claimassist-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claimassist-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claimassist-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: claimassist-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: claimassist-observability
data:
  prometheus.yml: |
    global:
      # Task 6A-14B-4B: scrape/eval interval 30s (halved from 15s) to reduce CPU
      # overhead on the single 2-OCPU Always-Free node while still capturing
      # per-replica application metrics. Retention is 7d (--storage.tsdb.retention.time).
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        cluster: claimassist-k3s
    scrape_configs:
      # Prometheus self-monitoring.
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      # Application services in dev / stage / prod - discovered from pod
      # annotations (prometheus.io/scrape=true, path /actuator/prometheus,
      # port=<service port>). Instead of scraping pod IPs directly (which fails
      # cross-namespace because kube-router doesn't route pod IPs between
      # namespaces), we relabel to scrape via Kubernetes Service DNS names.
      # This uses kube-proxy for routing, which works correctly across namespaces.
      - job_name: claimassist-apps
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: "claimassist-(dev|stage|prod)"
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: "(api-gateway|customer-service|claims-service|agent-service|policy-service)"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Build service FQDN from component label + namespace so Prometheus
          # scrapes through the ClusterIP Service (kube-proxy routing) instead
          # of direct pod-IP access (broken cross-namespace with kube-router).
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: replace
            regex: (.+)
            replacement: claimassist-${1}
            target_label: __tmp_svc
          - source_labels: [__tmp_svc, __meta_kubernetes_namespace]
            action: replace
            regex: ([^;]+);([^;]+)
            replacement: ${1}.${2}.svc.cluster.local
            target_label: __address__
          # Append port from the prometheus.io/port annotation.
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(environment|app\.kubernetes\.io/component)
          - action: labeldrop
            regex: __meta_kubernetes_pod_annotation_.*
          - action: labeldrop
            regex: __tmp_.*

      # IntelliJ local services - scraped via Tailscale from each developer's
      # Windows machine. Targets are loaded from a file_sd_config that reads
      # from a ConfigMap (developer-registry). Each developer adds their entry
      # to infrastructure/monitoring/developers.yml and applies it:
      #   kubectl -n claimassist-observability apply -f infrastructure/monitoring/developers.yml
      #
      # The developer label is automatically added per-entry so Grafana/Loki
      # can filter by developer. No hardcoded IPs or env vars needed.
      - job_name: intellij-local-services
        scrape_interval: 15s
        scrape_timeout: 10s
        file_sd_configs:
          - files:
              - /etc/prometheus/file_sd/developer-registry.yml
            refresh_interval: 30s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: claimassist-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-remote-write-receiver
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            # TASK 6A-14B-4B: CPU request 100m -> 50m (light 30s scrape load on
            # the free-tier node); limits unchanged so burst capacity is preserved.
            # Retention 7d set via --storage.tsdb.retention.time.
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: developer-registry
              mountPath: /etc/prometheus/file_sd
              readOnly: true
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: developer-registry
          configMap:
            name: developer-registry
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: claimassist-observability
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30900
---
# Developer registry for file_sd_configs. Prometheus watches this ConfigMap
# and auto-reloads scrape targets when it changes.
#
# Each developer adds their entry with their Tailscale IP and a developer name.
# To register:
#   1. Edit infrastructure/monitoring/developers.yml
#   2. Apply: kubectl -n claimassist-observability apply -f infrastructure/monitoring/developers.yml
#
# The file format follows Prometheus file_sd_configs YAML:
#   - targets: ["ip:port", ...]
#     labels:
#       developer: name
#       environment: local
#       source: intellij
#       cluster: claimassist-local
apiVersion: v1
kind: ConfigMap
metadata:
  name: developer-registry
  namespace: claimassist-observability
  labels:
    app.kubernetes.io/part-of: claimassist
    app.kubernetes.io/component: observability
data:
  developer-registry.yml: |
    # Developer registry for IntelliJ local services.
    # Each developer adds their entry with their Tailscale IP.
    # To register:
    #   1. Edit this file or infrastructure/monitoring/developers.yml
    #   2. Apply: kubectl -n claimassist-observability apply -f infrastructure/monitoring/developers.yml
    #
    # The file format follows Prometheus file_sd_configs YAML.
    # Prometheus auto-reloads within 30s of ConfigMap change.
    - targets:
        - "100.114.133.69:8080"
        - "100.114.133.69:8081"
        - "100.114.133.69:8082"
        - "100.114.133.69:8083"
      labels:
        developer: mayur
        environment: local
        source: intellij
        cluster: claimassist-local