apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: claimassist-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claimassist-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claimassist-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claimassist-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: claimassist-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: claimassist-observability
data:
  prometheus.yml: |
    global:
      # Task 6A-14B-4B: scrape/eval interval 30s (halved from 15s) to reduce CPU
      # overhead on the single 2-OCPU Always-Free node while still capturing
      # per-replica application metrics. Retention is 7d (--storage.tsdb.retention.time).
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        cluster: claimassist-k3s
    scrape_configs:
      # Prometheus self-monitoring.
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      # Application services in dev / stage / prod - auto-discovered from pod
      # annotations added by the Helm chart (prometheus.io/scrape=true, path
      # /actuator/prometheus, port=<service port>). Metric labels carry
      # `namespace` (=== environment) and `environment`, so queries can filter
      # dev|stage|prod without cross-environment leakage.
      - job_name: claimassist-apps
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: "claimassist-(dev|stage|prod)"
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: "(api-gateway|customer-service|claims-service|agent-service)"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(environment|app\.kubernetes\.io/component)
          - action: labeldrop
            regex: __meta_kubernetes_pod_annotation_.*
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: claimassist-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-remote-write-receiver
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            # TASK 6A-14B-4B: CPU request 100m -> 50m (light 30s scrape load on
            # the free-tier node); limits unchanged so burst capacity is preserved.
            # Retention 7d set via --storage.tsdb.retention.time.
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: claimassist-observability
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090