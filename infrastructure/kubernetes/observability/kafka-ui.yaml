apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: claimassist-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: claimassist-dev

            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: claimassist-kafka.claimassist-dev.svc.cluster.local:9092

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: claimassist-observability
spec:
  type: ClusterIP
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
