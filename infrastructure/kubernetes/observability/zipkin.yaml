# =============================================================================
# ZIPKIN - Distributed tracing collector (Task 6A-14B-4B).
#
# STATUS: ENABLED. Traces are sent by all four Spring Boot services via the
# ZIPKIN_ENDPOINT env var set in the Helm deployment template, pointing at
# zipkin-service.claimassist-observability.svc.cluster.local:9411.
#
# NodePort 30941 exposes the Zipkin UI for developer access through Tailscale.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: claimassist-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: openzipkin/zipkin:3.4
          ports:
            - containerPort: 9411
          readinessProbe:
            httpGet: { path: /health, port: 9411 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9411 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin-service
  namespace: claimassist-observability
spec:
  type: NodePort
  selector:
    app: zipkin
  ports:
    - port: 9411
      targetPort: 9411
      nodePort: 30941