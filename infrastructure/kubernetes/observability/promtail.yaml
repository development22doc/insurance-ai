apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: claimassist-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claimassist-promtail
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claimassist-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claimassist-promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: claimassist-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: claimassist-observability
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki-service.claimassist-observability.svc.cluster.local:3100/loki/api/v1/push
    # Tail ONLY the four application containers in the dev/stage/prod namespaces.
    # Each stream is labeled with the pod's namespace (=== environment) and the
    # `service` label, so Loki queries never mix one environment's logs with
    # another's. High-cardinality structured fields (level, traceId/spanId/
    # correlationId) are NOT promoted to Loki labels - they stay in the structured
    # JSON log content to keep the index bounded on the free-tier node. Only the
    # low-cardinality `level` is used as a label.
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - { cri: {} }
          - json:
              expressions:
                level: level
          - labels:
              level: level
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: "(api-gateway|customer-service|claims-service|agent-service)"
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: "claimassist-(dev|stage|prod)"
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: environment
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - action: replace
            replacement: /var/log/pods/$1/*/*.log
            separator: /
            source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: claimassist-observability
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      securityContext:
        runAsNonRoot: false          # needs access to /var/log/pods
      containers:
        - name: promtail
          image: grafana/promtail:3.2.1
          args:
            - -config.file=/etc/promtail/promtail.yaml
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: logs
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: logs
          hostPath:
            path: /var/log/pods
        - name: positions
          emptyDir: {}