{{- if .Values.keycloak.enabled }}
{{- $realm := .Values.keycloak.realm }}
{{- $defaultRole := printf "default-roles-%s" $realm }}
{{- /* Attempt to read the admin client secret from the Kubernetes Secret created by the chart
     so the realm-export.json and the Secret remain in sync. Falls back to the chart value
     if the Secret does not exist (e.g. first render without an existing Secret). */ -}}
{{- $existingSecret := lookup "v1" "Secret" (include "claimassist.namespace" .) .Values.keycloak.credentials.secretName }}
{{- $existingClientSecret := "" }}
{{- if $existingSecret }}
  {{- if and $existingSecret.data (hasKey $existingSecret.data "KEYCLOAK_ADMIN_CLIENT_SECRET") }}
    {{- $existingClientSecret = index $existingSecret.data "KEYCLOAK_ADMIN_CLIENT_SECRET" | b64dec }}
  {{- end }}
{{- end }}
{{- $adminClientSecret := default (default "" .Values.keycloak.credentials.adminClientSecret) $existingClientSecret }}
# Keycloak realm import - rendered as a deterministic realm-export.json and mounted
# into the official image's import dir, consumed by the SAME `--import-realm`
# mechanism LOCAL uses (no second competing bootstrap). It faithfully mirrors the
# repository's infrastructure/docker/keycloak/realm-export.json:
#   - ONE realm per environment: {{ $realm }}
#   - client claimassist-customer-app (public, Authorization Code + PKCE S256)
#   - client claimassist-admin-service (confidential, service-account)
#   - realm roles CUSTOMER / ADJUSTER / AUDITOR + env-named default-role
#   - client scopes incl. the userId-claim protocol mapper (legacy_user_id -> userId)
# The realm name, the env-dependent default-role name, the confidential admin
# client secret and the registered redirect URIs are parameterized from values so
# every environment gets its own realm, clients and secrets. LOCAL's committed
# `demo.customer` user + plaintext password are intentionally NOT reproduced here
# (users are runtime data created via the app signup / KeycloakUserProvisioningService).
# Non-secret by design: the admin client secret is injected at deploy time via
# values.keycloak.credentials.adminClientSecret; REAL deployment credentials are
# supplied via Secret references, never committed to this chart/Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.keycloak.realmConfigMapName }}
  namespace: {{ include "claimassist.namespace" . | quote }}
  labels:
{{ include "claimassist.labels" . | indent 4 }}
    app.kubernetes.io/component: keycloak
data:
  realm-export.json: |
    {
      "realm": "{{ $realm }}",
      "enabled": true,
      "displayName": "ClaimAssist AI Platform",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "accessTokenLifespan": 6000,
      "ssoSessionIdleTimeout": 36000,
      "ssoSessionMaxLifespan": 36000,
      "roles": {
        "realm": [
          { "name": "CUSTOMER", "description": "Default role for customers" },
          { "name": "ADJUSTER", "description": "Claims Adjuster" },
          { "name": "AUDITOR", "description": "Compliance Auditor" },
          {
            "name": "{{ $defaultRole }}",
            "description": "Default roles assigned to users",
            "composite": true,
            "composites": { "realm": ["CUSTOMER"] }
          }
        ]
      },
      "defaultRole": {
        "name": "{{ $defaultRole }}",
        "composite": true
      },
      "clientScopes": [
        {
          "name": "openid",
          "description": "OpenID Connect",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "false",
            "display.on.consent.screen": "true"
          }
        },
        {
          "name": "profile",
          "description": "OpenID Connect profile scope",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "preferred username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "consentRequired": false,
              "config": {
                "userinfo.token.claim": "true",
                "user.attribute": "username",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "preferred_username",
                "jsonType.label": "String"
              }
            }
          ]
        },
        {
          "name": "email",
          "description": "OpenID Connect email scope",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "email",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "consentRequired": false,
              "config": {
                "userinfo.token.claim": "true",
                "user.attribute": "email",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "email",
                "jsonType.label": "String"
              }
            },
            {
              "name": "email verified",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "consentRequired": false,
              "config": {
                "userinfo.token.claim": "true",
                "user.attribute": "emailVerified",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "email_verified",
                "jsonType.label": "Boolean"
              }
            }
          ]
        },
        {
          "name": "address",
          "description": "OpenID Connect address scope",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          }
        },
        {
          "name": "phone",
          "description": "OpenID Connect phone scope",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          }
        },
        {
          "name": "userId-claim",
          "description": "Adds legacy_user_id as userId claim",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "userId",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "userinfo.token.claim": "true",
                "user.attribute": "legacy_user_id",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "userId",
                "jsonType.label": "long",
                "multivalued": "false"
              }
            }
          ]
        }
      ],
      "clients": [
        {
          "clientId": "{{ .Values.keycloak.client.customerClientId }}",
          "name": "ClaimAssist Customer App",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "fullScopeAllowed": true,
          "redirectUris": [
            {{- $redirectUris := .Values.keycloak.client.redirectUris }}
            {{- if .Values.keycloak.externalRedirectUris }}
            {{- $redirectUris = .Values.keycloak.externalRedirectUris }}
            {{- end }}
            {{- range $i, $u := $redirectUris }}
            {{- if $i }},{{ end }}
            "{{ $u }}"{{- end }}
          ],
          "webOrigins": [
            {{- $webOrigins := .Values.keycloak.client.webOrigins }}
            {{- if .Values.keycloak.externalWebOrigins }}
            {{- $webOrigins = .Values.keycloak.externalWebOrigins }}
            {{- end }}
            {{- range $i, $o := $webOrigins }}
            {{- if $i }},{{ end }}
            "{{ $o }}"{{- end }}
          ],
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "userId-claim"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          }
        },
        {
          "clientId": "{{ .Values.keycloak.client.adminClientId }}",
          "name": "ClaimAssist Admin Service",
          "enabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "secret": "{{ $adminClientSecret }}",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true
        }
      ]
    }
{{- end }}
