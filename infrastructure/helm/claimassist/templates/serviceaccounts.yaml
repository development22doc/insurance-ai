{{- if .Values.serviceAccounts.create }}
# Foundation ServiceAccounts - one per application.
# LEAST PRIVILEGE:
# - No application is granted cluster-admin or additional RBAC permissions.
# - automountServiceAccountToken=false prevents Kubernetes API credentials
#   from being mounted into application pods.
# - ServiceAccounts are namespace-scoped to claimassist-<env>.

{{- $root := . }}
{{- range $svc := list "api-gateway" "customer-service" "claims-service" "agent-service" "frontend" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc }}-sa
  namespace: {{ include "claimassist.namespace" $root | quote }}
  labels:
    {{- include "claimassist.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $svc }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
