{{- if .Values.serviceAccounts.create }}
# Foundation ServiceAccounts - one per application. LEAST PRIVILEGE (Task 6A-14):
#   - No application is granted cluster-admin or any RBAC Role beyond its own
#     pod identity; none of the four apps needs to call the Kubernetes API at
#     runtime (the fabric8 k8s-client in claims-service's build is unused).
#   - automountServiceAccountToken=false => the API token is NOT mounted into the
#     pod, removing any possibility of an app using default cluster credentials.
#   - Each ServiceAccount is namespace-scoped (claimassist-<env>) so pod identity
#     never crosses environments.
apiVersion: v1
kind: List
items:
{{- $root := . }}
{{- range $svc := list "api-gateway" "customer-service" "claims-service" "agent-service" }}
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: {{ $svc }}-sa
      namespace: {{ include "claimassist.namespace" $root | quote }}
      labels:
        {{- include "claimassist.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $svc }}
    automountServiceAccountToken: false
{{- end }}
{{- end }}