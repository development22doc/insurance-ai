{{- if .Values.postgresql.enabled }}
# PostgreSQL StatefulSet - exactly ONE per K8s environment namespace (dev /
# stage / prod each get their own instance + storage). Stable pod identity via a
# dedicated ClusterIP Service + persistent storage via volumeClaimTemplates (a
# PVC per pod). Data is NOT emptyDir. Credentials come from the Secret. Probes
# use pg_isready against the postgres maintenance db (`postgres` always exists),
# matching the LOCAL docker-compose healthcheck. Security context is
# intentionally left unset by default: the official postgres image must start as
# root to chown its volume during init, so runAsNonRoot would break it (see 6A-7
# change log).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.postgresql.serviceName }}
  namespace: {{ include "claimassist.namespace" . | quote }}
  labels:
    {{- include "claimassist.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ .Values.postgresql.serviceName }}
  replicas: {{ .Values.postgresql.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "claimassist.name" . | quote }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "claimassist.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      {{- with .Values.postgresql.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: init-db
          configMap:
            name: {{ .Values.postgresql.initDbConfigMapName }}
            defaultMode: 0755
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.registry }}{{ if .Values.postgresql.image.registry }}/{{ end }}{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: {{ .Values.postgresql.port }}
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.credentials.secretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.credentials.secretName }}
                  key: POSTGRES_PASSWORD
            - name: TZ
              value: {{ .Values.postgresql.timezone | quote }}
            - name: PGTZ
              value: {{ .Values.postgresql.timezone | quote }}
          volumeMounts:
            - name: init-db
              mountPath: /docker-entrypoint-initdb.d
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          {{- with .Values.postgresql.probes.startup }}
          startupProbe:
            exec:
              command: ["/bin/sh","-c","pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
            timeoutSeconds: {{ .timeoutSeconds }}
          {{- end }}
          {{- with .Values.postgresql.probes.liveness }}
          livenessProbe:
            exec:
              command: ["/bin/sh","-c","pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
            timeoutSeconds: {{ .timeoutSeconds }}
          {{- end }}
          {{- with .Values.postgresql.probes.readiness }}
          readinessProbe:
            exec:
              command: ["/bin/sh","-c","pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
            timeoutSeconds: {{ .timeoutSeconds }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "claimassist.labels" . | nindent 10 }}
          app.kubernetes.io/component: postgresql
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storageSize | quote }}
{{- end }}
