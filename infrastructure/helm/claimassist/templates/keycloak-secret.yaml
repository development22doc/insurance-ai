{{- if .Values.keycloak.enabled }}
# Keycloak admin bootstrap + confidential admin-client secret - Kubernetes Secret.
# NO real credentials are committed. Values come from the deploy-time override /
# --set (keycloak.credentials.*) and are referenced by the Keycloak StatefulSet
# and the application deployment Keycloak client wiring. Never place these values
# in a ConfigMap or a values file.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.credentials.secretName }}
  namespace: {{ include "claimassist.namespace" . | quote }}
  labels:
    {{- include "claimassist.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
type: Opaque
stringData:
  KEYCLOAK_ADMIN: {{ .Values.keycloak.credentials.adminUsername | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.keycloak.credentials.adminPassword | quote }}
  KEYCLOAK_ADMIN_CLIENT_ID: {{ .Values.keycloak.client.adminClientId | quote }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ .Values.keycloak.credentials.adminClientSecret | quote }}
{{- end }}
