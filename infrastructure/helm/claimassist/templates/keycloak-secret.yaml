{{- if .Values.keycloak.enabled }}
{{- $existing := lookup "v1" "Secret" (include "claimassist.namespace" .) .Values.keycloak.credentials.secretName }}
{{- $existingAdmin := "" }}
{{- $existingPassword := "" }}
{{- $existingClientSecret := "" }}
{{- if $existing }}
  {{- if and $existing.data (hasKey $existing.data "KEYCLOAK_ADMIN") }}
    {{- $existingAdmin = index $existing.data "KEYCLOAK_ADMIN" | b64dec }}
  {{- end }}
  {{- if and $existing.data (hasKey $existing.data "KEYCLOAK_ADMIN_PASSWORD") }}
    {{- $existingPassword = index $existing.data "KEYCLOAK_ADMIN_PASSWORD" | b64dec }}
  {{- end }}
  {{- if and $existing.data (hasKey $existing.data "KEYCLOAK_ADMIN_CLIENT_SECRET") }}
    {{- $existingClientSecret = index $existing.data "KEYCLOAK_ADMIN_CLIENT_SECRET" | b64dec }}
  {{- end }}
{{- end }}
{{- $admin := default "admin" $existingAdmin }}
{{- $password := default (default "" .Values.keycloak.credentials.adminPassword) $existingPassword }}
{{- $clientSecret := default (default "" .Values.keycloak.credentials.adminClientSecret) $existingClientSecret }}
{{- if eq $password "" }}
  {{- $password = randAlphaNum 32 }}
{{- end }}
{{- if eq $clientSecret "" }}
  {{- $clientSecret = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.credentials.secretName }}
  namespace: {{ include "claimassist.namespace" . | quote }}
  labels:
    {{- include "claimassist.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
type: Opaque
stringData:
  KEYCLOAK_ADMIN: {{ $admin | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ $password | quote }}
  KEYCLOAK_ADMIN_CLIENT_ID: {{ .Values.keycloak.client.adminClientId | quote }}
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ $clientSecret | quote }}
{{- end }}
