{{- if and .Values.postgresql.enabled .Values.postgresql.credentials.create }}
# PostgreSQL credentials - Kubernetes Secret.
# NO real credentials are committed. Values come from the deploy-time override
# file / --set (postgresql.credentials.postgresUsername/postgresPassword) and
# are referenced - never inlined - by the StatefulSet, the app deployments and
# the Flyway Job. Never place these values in a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresql.credentials.secretName }}
  namespace: {{ include "claimassist.namespace" . | quote }}
  labels:
    {{- include "claimassist.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.credentials.postgresUsername | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.credentials.postgresPassword | quote }}
{{- end }}
