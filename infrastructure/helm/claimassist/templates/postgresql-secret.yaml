{{- if and .Values.postgresql.enabled .Values.postgresql.credentials.create }}
{{- $existing := lookup "v1" "Secret" (include "claimassist.namespace" .) .Values.postgresql.credentials.secretName }}
{{- $existingUser := "" }}
{{- $existingPassword := "" }}
{{- if $existing }}
  {{- if and $existing.data (hasKey $existing.data "POSTGRES_USER") }}
    {{- $existingUser = index $existing.data "POSTGRES_USER" | b64dec }}
  {{- end }}
  {{- if and $existing.data (hasKey $existing.data "POSTGRES_PASSWORD") }}
    {{- $existingPassword = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
  {{- end }}
{{- end }}
{{- $user := default "claimassist" $existingUser }}
{{- $password := default (default "" .Values.postgresql.credentials.postgresPassword) $existingPassword }}
{{- if eq $password "" }}
  {{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresql.credentials.secretName }}
  namespace: {{ include "claimassist.namespace" . | quote }}
  labels:
    {{- include "claimassist.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  POSTGRES_USER: {{ $user | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
{{- end }}
