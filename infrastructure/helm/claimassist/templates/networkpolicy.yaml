---
# 4) INGRESS RULES FOR INFRASTRUCTURE PODS
#    These allow application services to connect to infrastructure dependencies.
#    The default-deny blocks all ingress; these policies explicitly permit required connections.

---
# 4a) PostgreSQL INGRESS <- customer-service, claims-service, agent-service, flyway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claimassist-allow-ingress-postgresql
  namespace: {{ $ns | quote }}
  labels:
    {{- include "claimassist.labels" . | nindent 4 }}
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $app | quote }}
      app.kubernetes.io/component: postgresql
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $app | quote }}
              app.kubernetes.io/component: customer-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $app | quote }}
              app.kubernetes.io/component: claims-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $app | quote }}
              app.kubernetes.io/component: agent-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $app | quote }}
              app.kubernetes.io/component: flyway
        - ipBlock:
            cidr: 100.64.0.0/10
      ports:
        - port: {{ .Values.postgresql.port }}
          protocol: TCP

