              app.kubernetes.io/component: api-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $app | quote }}
              app.kubernetes.io/component: customer-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $app | quote }}
              app.kubernetes.io/component: claims-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $app | quote }}
              app.kubernetes.io/component: agent-service
      ports:
        - port: {{ .Values.keycloak.port }}
          protocol: TCP

---
# 5) DNS - cluster DNS (kube-system) is ALWAYS required and NEVER blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claimassist-allow-dns
  namespace: {{ $ns | quote }}
  labels:
    {{- include "claimassist.labels" . | nindent 4 }}
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $app | quote }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $dns.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $dns.selector | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

{{- range $name, $svc := .Values.services }}
---
# 4) PROMETHEUS SCRAPING. The shared Prometheus (claimassist-observability,
#    pod app=prometheus) auto-discoveries each application replica via the
#    prometheus.io/* annotations on the Deployment and scrapes its actuator
#    metrics endpoint on the service's own port. Stateful workloads are NOT
#    scraped (no such annotation), so no Prometheus rule is needed for them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claimassist-allow-prometheus-{{ $name }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "claimassist.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $app | quote }}
      app.kubernetes.io/component: {{ $name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $prom.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $prom.selector | nindent 14 }}
      ports:
        - port: {{ $svc.port }}
          protocol: TCP
{{- end }}

---
# 5) PUBLIC EDGE - nginx ingress-controller -> claimassist-api-gateway:8080.
#    The controller is installed separately (shared cluster component in its own
#    namespace, Service type NodePort on the single free-tier node - no cloud LB),
#    and is the F5 NGINX OSS controller (nginx.org/*), NOT the retired community
#    ingress-nginx project.
#    ONLY the gateway receives external traffic; every other service is internal.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claimassist-allow-ingress-controller
  namespace: {{ $ns | quote }}
  labels:
    {{- include "claimassist.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $app | quote }}
      app.kubernetes.io/component: api-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ing.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $ing.selector | nindent 14 }}
      ports:
        - port: {{ $gw.port }}
          protocol: TCP
{{- end }}