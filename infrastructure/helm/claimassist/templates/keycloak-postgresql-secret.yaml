{{- if and .Values.keycloak.enabled .Values.keycloak.postgresql.enabled }}
# Dedicated Keycloak PostgreSQL credentials - Kubernetes Secret.
# NO real credentials are committed. Values come from the deploy-time override /
# --set (keycloak.postgresql.credentials.username/password) and are referenced -
# never inlined - by the Keycloak PostgreSQL StatefulSet. Never place these values
# in a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.postgresql.credentials.secretName }}
  namespace: {{ include "claimassist.namespace" . | quote }}
  labels:
    {{- include "claimassist.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-postgresql
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.keycloak.postgresql.database | quote }}
  POSTGRES_USER: {{ .Values.keycloak.postgresql.credentials.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.keycloak.postgresql.credentials.password | quote }}
{{- end }}
