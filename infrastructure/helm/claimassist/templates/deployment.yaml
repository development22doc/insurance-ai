{{- range $name, $svc := .Values.services }}
  {{- $root := $ }}
---
# Deployment for {{ $name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimassist-{{ $name }}
  namespace: {{ include "claimassist.namespace" $root | quote }}
  labels:
    {{- include "claimassist.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default $root.Values.replicaCount | default 1 }}
  # Task 6A-11: ZERO-DOWNTIME rolling update. maxUnavailable: 0 guarantees the
  # Deployment never runs below desired replicas during a rollout, so no capacity
  # gap opens; maxSurge: 1 brings one new pod up (and ready) before any old pod is
  # terminated. Readiness gates traffic: the Service only routes to ready pods, and
  # the old ReplicaSet stays ready until the new one passes its probes. Combined
  # with Spring graceful shutdown (server.shutdown: graceful) inside terminationGracePeriodSeconds.
  strategy:
    type: {{ $root.Values.strategy.type | default "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ $root.Values.strategy.rollingUpdate.maxUnavailable | default 0 }}
      maxSurge: {{ $root.Values.strategy.rollingUpdate.maxSurge | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "claimassist.name" $root | quote }}
      app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "claimassist.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      # Task 6A-13: OBSERVABILITY. Advertise the Prometheus scrape target on the
      # pod so the shared Prometheus (kubernetes_sd_configs, role: pod) auto-
      # discovers every application replica via its /actuator/prometheus endpoint.
      # Metrics are tagged by namespace (which equals the env: dev/stage/prod) so
      # no environment's data leaks into another.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "{{ $svc.port }}"
    spec:
      serviceAccountName: {{ $name }}-sa
      {{/* Task 6A-3 / IMAGE PULL: every application Deployment must actually
      consume the image pull credentials. The global image.pullSecret (created
      out-of-band via `kubectl create secret docker-registry` for the Docker Hub
      Registry) is wired in here so it is USED, not merely defined. Per-service
      imagePullSecrets (values.services.<name>.imagePullSecrets) are merged on
      top for any additional registries. */}}
      {{ $pullSecrets := list }}
      {{ if $root.Values.image.pullSecret }}
      {{ $pullSecrets = append $pullSecrets $root.Values.image.pullSecret }}
      {{ end }}
      {{ range $s := $svc.imagePullSecrets }}
      {{ $pullSecrets = append $pullSecrets $s }}
      {{ end }}
      {{ if $pullSecrets }}
      imagePullSecrets:
        {{ range $s := $pullSecrets | uniq }}
        - name: {{ $s }}
        {{ end }}
      {{ end }}
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: {{ $root.Values.terminationGracePeriodSeconds | default 60 }}
      {{ if $root.Values.global.ha.scheduling.enabled }}
      # Task 6A-12 - STATELESS APPLICATION-LEVEL HA SCHEDULING (soft / preferred).
      # topologySpreadConstraints spreads replicas evenly across nodes when more
      # than one exists; whenUnsatisfiable: ScheduleAnyway keeps the current
      # single node fully usable.
      # podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution biases
      # replica placement onto distinct nodes (weight 100) but again never blocks
      # scheduling on the current one-node cluster.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "claimassist.name" $root | quote }}
              app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
              app.kubernetes.io/component: {{ $name }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "claimassist.name" $root | quote }}
                    app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
                    app.kubernetes.io/component: {{ $name }}
      {{ end }}
      containers:
        - name: {{ $name }}
          image: {{ include "claimassist.image" (dict "root" $root "name" $name "svc" $svc) | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            # SPRING_CONFIG_IMPORT must be set as an env var (NOT just in profile-specific
            # application-k8s.yaml) because Spring Boot processes spring.config.import
            # during the bootstrap phase, BEFORE profile-specific config is loaded.
            # The packaged application.yaml has spring.config.import: configserver:... which
            # would cause the Config Client to attempt localhost:8888 connection at startup.
            # Setting SPRING_CONFIG_IMPORT="" here clears the import before any YAML is read.
            - name: SPRING_CONFIG_IMPORT
              value: {{ "" | quote }}
            - name: SPRING_CLOUD_CONFIG_ENABLED
              value: {{ "false" | quote }}
            # Eureka/Config Client must be disabled via property toggles (env vars)
            # because YAML profile-specific properties (from ConfigMap mounted via
            # SPRING_CONFIG_ADDITIONAL_LOCATIONS) are loaded AFTER the auto-configuration
            # phase. Environment variables are processed before any YAML files.
            #
            # These three properties are checked by @ConditionalOnProperty / @ConditionalOnDiscoveryEnabled
            # in the auto-configuration classes themselves:
            #   - eureka.client.enabled=false  → skips EurekaClientAutoConfiguration + EurekaDiscoveryClientConfiguration
            #   - spring.cloud.config.enabled=false → skips ConfigClientAutoConfiguration
            #   - spring.cloud.discovery.enabled=false → skips CompositeDiscoveryClientAutoConfiguration
            - name: SPRING_EUREKA_CLIENT_ENABLED
              value: {{ "false" | quote }}
            - name: SPRING_CLOUD_DISCOVERY_ENABLED
              value: {{ "false" | quote }}
            # Distributed tracing: all four services send spans to the shared Zipkin
            # collector in the observability namespace. Overrides the packaged default
            # of localhost:9411 which is wrong inside Kubernetes.
            - name: ZIPKIN_ENDPOINT
              value: "http://zipkin-service.claimassist-observability.svc.cluster.local:9411/api/v2/spans"
            {{ if eq $name "api-gateway" }}
            # api-gateway is a reactive WebFlux service with no database. Spring Data JPA
            # is on the classpath (common-lib transitive), but without a JDBC URL the
            # DataSource auto-configuration fails. Exclude Hibernate/JPA for the gateway.
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration"
            {{ end }}
            {{ if eq $name "customer-service" }}
            # SharedExceptionAutoConfiguration (common-lib) defines a globalExceptionHandler
            # bean that conflicts with customer-service's own GlobalExceptionHandler class.
            # Allow bean definition overriding to resolve the conflict.
            - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
              value: {{ "true" | quote }}
            {{ end }}
            {{ if $svc.k8sConfig }}
            - name: SPRING_CONFIG_ADDITIONAL_LOCATIONS
              value: "file:/etc/claimassist/config/"
            {{ end }}
            {{ range $e := $svc.env }}
            {{/* Avoid rendering duplicate or null-valued SPRING_CONFIG_IMPORT entries that
            may be supplied inadvertently via values files. Ensure every env value is
            rendered as a quoted string so an explicit empty string becomes `value: ""`
            in the final manifest (prevents Kubernetes from creating an env with only
            a name and no value). */}}
            {{ if ne $e.name "SPRING_CONFIG_IMPORT" }}
            - name: {{ $e.name }}
              value: {{ default "" $e.value | quote }}
            {{ end }}
            {{ end }}
            {{ if and $svc.database $root.Values.postgresql.enabled }}
            # Task 6A-7: PostgreSQL wiring for this service (uses the K8s Service
            # DNS, never localhost). Username/password come from the Secret;
            # Flyway is DISABLED at app startup (migration is the separate Job);
            # ddl-auto is explicitly none (schema owned by Flyway).
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ $root.Values.postgresql.serviceName }}:{{ $root.Values.postgresql.port }}/{{ $svc.database }}"
            # Explicit JDBC driver. agent-service's packaged application.yaml
            # defaults driver-class-name to org.h2.Driver (${SPRING_DATASOURCE_DRIVER:...});
            # without this override it would try to open a Postgres URL with the H2
            # driver and fail to start. Setting it for every DB service is the robust
            # (and harmless) fix.
            - name: SPRING_DATASOURCE_DRIVER
              value: "org.postgresql.Driver"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.postgresql.credentials.secretName }}
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.postgresql.credentials.secretName }}
                  key: POSTGRES_PASSWORD
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "none"
            {{ end }}
            {{ if and $svc.redis $root.Values.redis.enabled }}
            # Task 6A-8: Redis wiring for this service. Uses the K8s Service DNS
            # (claimassist-redis:6379), never localhost. No password env is set:
            # Redis AUTH is intentionally NOT enabled (LOCAL uses no password, and
            # claims-service's manual RedisConfig does not read a password).
            - name: SPRING_DATA_REDIS_HOST
              value: {{ $root.Values.redis.serviceName }}
            - name: SPRING_DATA_REDIS_PORT
              value: {{ $root.Values.redis.port | quote }}
            {{ end }}
            {{ if and $svc.kafka $root.Values.kafka.enabled }}
            # Task 6A-9: Kafka wiring for this service. Uses the K8s Service DNS
            # (claimassist-kafka:9092), never localhost / docker-compose service
            # names. Single property override feeds OutboxKafkaConfig's outbox
            # producer + all outbox consumers (spring.kafka.bootstrap-servers).
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "{{ $root.Values.kafka.serviceName }}:{{ $root.Values.kafka.internalPort }}"
            {{ end }}
            {{ if and (ne $name "api-gateway") (ne $name "customer-service") }}
            # Feign inter-service URLs: @FeignClient interfaces use
            # ${CUSTOMER_SERVICE_URI:} / ${CLAIMS_SERVICE_URI:} for direct K8s
            # Service DNS resolution (no Eureka discovery).
            {{ if ne $name "customer-service" }}
            - name: CUSTOMER_SERVICE_URI
              value: "http://claimassist-customer-service:{{ (index $root.Values.services "customer-service").port }}"
            {{ end }}
            {{ if ne $name "claims-service" }}
            - name: CLAIMS_SERVICE_URI
              value: "http://claimassist-claims-service:{{ (index $root.Values.services "claims-service").port }}"
            {{ end }}
            {{ end }}
            {{ if and (eq $name "api-gateway") $root.Values.keycloak.enabled }}
            # Task 6A-10: Keycloak wiring for api-gateway (reactive resource server).
            # When keycloak.externalUrl is set (DEV), OIDC endpoints use the external
            # URL so the issuer claim in JWTs matches what browsers/clients see.
            # Otherwise, internal Service DNS is used. JWKS is always reachable.
            {{- $kcIssuer := printf "http://%s:%d/realms/%s" $root.Values.keycloak.serviceName $root.Values.keycloak.port $root.Values.keycloak.realm }}
            {{- $kcJwks := printf "http://%s:%d/realms/%s/protocol/openid-connect/certs" $root.Values.keycloak.serviceName $root.Values.keycloak.port $root.Values.keycloak.realm }}
            {{- if $root.Values.keycloak.externalUrl }}
            {{- $kcIssuer = printf "%s/realms/%s" $root.Values.keycloak.externalUrl $root.Values.keycloak.realm }}
            {{- $kcJwks = printf "%s/realms/%s/protocol/openid-connect/certs" $root.Values.keycloak.externalUrl $root.Values.keycloak.realm }}
            {{- end }}
            - name: KEYCLOAK_ISSUER_URI
              value: {{ $kcIssuer | quote }}
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI
              value: {{ $kcJwks | quote }}
            {{ end }}
            {{ if and (ne $name "api-gateway") $root.Values.keycloak.enabled }}
            # Task 6A-10: Keycloak wiring for the servlet resource services.
            # spring.security.oauth2.resourceserver.jwt issuer + JWKS are discovered
            # from KEYCLOAK_ISSUER_URI/KEYCLOAK_JWKS_URI (these exact env placeholders
            # exist in the packaged application YAML and config-repo). The customer
            # public client (claimassist-customer-app) and the confidential admin
            # client (claimassist-admin-service) match the realm import. Internal
            # Service DNS - never localhost. Secrets come from the Keycloak Secret.
            {{- $kcBase := printf "http://%s:%d" $root.Values.keycloak.serviceName $root.Values.keycloak.port }}
            {{- $kcIssuer := printf "%s/realms/%s" $kcBase $root.Values.keycloak.realm }}
            {{- $kcJwks := printf "%s/realms/%s/protocol/openid-connect/certs" $kcBase $root.Values.keycloak.realm }}
            {{- $kcToken := printf "%s/realms/%s/protocol/openid-connect/token" $kcBase $root.Values.keycloak.realm }}
            {{- if $root.Values.keycloak.externalUrl }}
            {{- $kcBase = $root.Values.keycloak.externalUrl }}
            {{- $kcIssuer = printf "%s/realms/%s" $kcBase $root.Values.keycloak.realm }}
            {{- $kcJwks = printf "%s/realms/%s/protocol/openid-connect/certs" $kcBase $root.Values.keycloak.realm }}
            {{- $kcToken = printf "%s/realms/%s/protocol/openid-connect/token" $kcBase $root.Values.keycloak.realm }}
            {{- end }}
            - name: KEYCLOAK_SERVER_URL
              value: {{ $kcBase | quote }}
            - name: KEYCLOAK_REALM
              value: {{ $root.Values.keycloak.realm | quote }}
            - name: KEYCLOAK_ISSUER_URI
              value: {{ $kcIssuer | quote }}
            - name: KEYCLOAK_JWKS_URI
              value: {{ $kcJwks | quote }}
            # Explicit Spring Security resource-server JWKS URI. This is required
            # for Claims/Customer/Agent services to auto-create JwtDecoder.
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI
              value: {{ $kcJwks | quote }}
            - name: KEYCLOAK_TOKEN_URI
              value: {{ $kcToken | quote }}
            - name: SERVICE_TOKEN_URI
              value: {{ $kcToken | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: {{ $root.Values.keycloak.client.adminClientId | quote }}
            - name: SERVICE_CLIENT_ID
              value: {{ $root.Values.keycloak.client.adminClientId | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.keycloak.credentials.secretName }}
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
            - name: SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.keycloak.credentials.secretName }}
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
            {{ end }}
            {{ if and (eq $name "customer-service") $root.Values.keycloak.enabled }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ $root.Values.keycloak.client.customerClientId | quote }}
            - name: KEYCLOAK_TOKEN_CLIENT_ID
              value: {{ $root.Values.keycloak.client.customerClientId | quote }}
            {{- $redirectUris := $root.Values.keycloak.client.redirectUris }}
            {{- if $root.Values.keycloak.externalRedirectUris }}
            {{- $redirectUris = $root.Values.keycloak.externalRedirectUris }}
            {{- end }}
            - name: KEYCLOAK_REDIRECT_URI
              value: {{ first $redirectUris | quote }}
            {{ end }}
          {{ if $svc.k8sConfig }}
          volumeMounts:
            - name: config
              mountPath: /etc/claimassist/config
              readOnly: true
          {{ end }}
          resources:
            {{ toYaml $svc.resources | nindent 12 }}
          securityContext:
            # Numeric UID/GID matching the runtime image user (`USER 1000:1000` in
            # the Dockerfiles). runAsNonRoot then verifies a non-root identity
            # without having to resolve a non-numeric image USER name.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: {{ $root.Values.probes.startup.path }}
              port: {{ $svc.port }}
            periodSeconds: {{ $root.Values.probes.startup.periodSeconds }}
            failureThreshold: {{ $root.Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ $root.Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ $root.Values.probes.liveness.path }}
              port: {{ $svc.port }}
            periodSeconds: {{ $root.Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ $root.Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ $root.Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ $root.Values.probes.readiness.path }}
              port: {{ $svc.port }}
            periodSeconds: {{ $root.Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ $root.Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ $root.Values.probes.readiness.timeoutSeconds }}
            {{ if $root.Values.probes.readiness.initialDelaySeconds }}
            initialDelaySeconds: {{ $root.Values.probes.readiness.initialDelaySeconds }}
            {{ end }}
          {{ if $svc.k8sConfig }}
          {{/* volumeMounts are rendered inside the container above. */}}
          {{ end }}
      {{- /* Render volumes at spec.template.spec level (outside the container) */ -}}
      {{- if $svc.k8sConfig }}
      volumes:
        - name: config
          configMap:
            name: claimassist-{{ $name }}-config
      {{- end }}
        {{ end }}
