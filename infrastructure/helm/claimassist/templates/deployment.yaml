{{- range $name, $svc := .Values.services }}
{{- $root := $ }}
---
# Deployment for {{ $name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimassist-{{ $name }}
  namespace: {{ include "claimassist.namespace" $root | quote }}
  labels:
    {{- include "claimassist.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default $root.Values.replicaCount | default 1 }}
  # Task 6A-11: ZERO-DOWNTIME rolling update. maxUnavailable: 0 guarantees the
  # Deployment never runs below desired replicas during a rollout, so no capacity
  # gap opens; maxSurge: 1 brings one new pod up (and ready) before any old pod is
  # terminated. Readiness gates traffic: the Service only routes to ready pods, and
  # the old ReplicaSet stays ready until the new one passes its probes. Combined
  # with Spring graceful shutdown (server.shutdown: graceful) inside terminationGracePeriodSeconds.
  strategy:
    type: {{ $root.Values.strategy.type | default "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ $root.Values.strategy.rollingUpdate.maxUnavailable | default 0 }}
      maxSurge: {{ $root.Values.strategy.rollingUpdate.maxSurge | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "claimassist.name" $root | quote }}
      app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "claimassist.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      # Task 6A-13: OBSERVABILITY. Advertise the Prometheus scrape target on the
      # pod so the shared Prometheus (kubernetes_sd_configs, role: pod) auto-
      # discovers every application replica via its /actuator/prometheus endpoint.
      # Metrics are tagged by namespace (which equals the env: dev/stage/prod) so
      # no environment's data leaks into another.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "{{ $svc.port }}"
    spec:
      serviceAccountName: {{ $name }}-sa
      {{- /* Task 6A-3 / IMAGE PULL: every application Deployment must actually
          consume the image pull credentials. The global image.pullSecret (created
          out-of-band via `kubectl create secret docker-registry` for the Docker Hub
          Registry) is wired in here so it is USED, not merely defined. Per-service
          imagePullSecrets (values.services.<name>.imagePullSecrets) are merged on
          top for any additional registries. */}}
      {{- $pullSecrets := list }}
      {{- if $root.Values.image.pullSecret }}
      {{- $pullSecrets = append $pullSecrets $root.Values.image.pullSecret }}
      {{- end }}
      {{- range $s := $svc.imagePullSecrets }}
      {{- $pullSecrets = append $pullSecrets $s }}
      {{- end }}
      {{- if $pullSecrets }}
      imagePullSecrets:
        {{- range $s := $pullSecrets | uniq }}
        - name: {{ $s }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: {{ $root.Values.terminationGracePeriodSeconds | default 60 }}
      {{- if $root.Values.global.ha.scheduling.enabled }}
      # Task 6A-12 - STATELESS APPLICATION-LEVEL HA SCHEDULING (soft / preferred).
      # topologySpreadConstraints spreads replicas evenly across nodes when more
      # than one exists; whenUnsatisfiable: ScheduleAnyway keeps the current
      # single node fully usable.
      # podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution biases
      # replica placement onto distinct nodes (weight 100) but again never blocks
      # scheduling on the current one-node cluster.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "claimassist.name" $root | quote }}
              app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
              app.kubernetes.io/component: {{ $name }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "claimassist.name" $root | quote }}
                    app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
                    app.kubernetes.io/component: {{ $name }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "claimassist.image" (dict "root" $root "name" $name "svc" $svc) | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            {{- if $svc.k8sConfig }}
            - name: SPRING_CONFIG_ADDITIONAL_LOCATIONS
              value: "file:/etc/claimassist/config/"
            {{- end }}
            {{- range $e := $svc.env }}
            - name: {{ $e.name }}
              value: {{ $e.value | quote }}
            {{- end }}
            {{- if and $svc.database $root.Values.postgresql.enabled }}
            # Task 6A-7: PostgreSQL wiring for this service (uses the K8s Service
            # DNS, never localhost). Username/password come from the Secret;
            # Flyway is DISABLED at app startup (migration is the separate Job);
            # ddl-auto is explicitly none (schema owned by Flyway).
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ $root.Values.postgresql.serviceName }}:{{ $root.Values.postgresql.port }}/{{ $svc.database }}"
            # Explicit JDBC driver. agent-service's packaged application.yaml
            # defaults driver-class-name to org.h2.Driver (${SPRING_DATASOURCE_DRIVER:...});
            # without this override it would try to open a Postgres URL with the H2
            # driver and fail to start. Setting it for every DB service is the robust
            # (and harmless) fix.
            - name: SPRING_DATASOURCE_DRIVER
              value: "org.postgresql.Driver"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.postgresql.credentials.secretName }}
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.postgresql.credentials.secretName }}
                  key: POSTGRES_PASSWORD
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "none"
            {{- end }}
            {{- if and $svc.redis $root.Values.redis.enabled }}
            # Task 6A-8: Redis wiring for this service. Uses the K8s Service DNS
            # (claimassist-redis:6379), never localhost. No password env is set:
            # Redis AUTH is intentionally NOT enabled (LOCAL uses no password, and
            # claims-service's manual RedisConfig does not read a password).
            - name: SPRING_DATA_REDIS_HOST
              value: {{ $root.Values.redis.serviceName }}
            - name: SPRING_DATA_REDIS_PORT
              value: {{ $root.Values.redis.port | quote }}
            {{- end }}
            {{- if and $svc.kafka $root.Values.kafka.enabled }}
            # Task 6A-9: Kafka wiring for this service. Uses the K8s Service DNS
            # (claimassist-kafka:9092), never localhost / docker-compose service
            # names. Single property override feeds OutboxKafkaConfig's outbox
            # producer + all outbox consumers (spring.kafka.bootstrap-servers).
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "{{ $root.Values.kafka.serviceName }}:{{ $root.Values.kafka.internalPort }}"
            {{- end }}
            {{- if and (eq $name "api-gateway") $root.Values.keycloak.enabled }}
            # Task 6A-10: Keycloak wiring for api-gateway (reactive resource server).
            # The gateway validates JWTs against the internal Keycloak JWKS via
            # spring.security.oauth2.resourceserver.jwt.jwk-set-uri (the code reads
            # this exact property; env vars outrank the packaged default). Internal
            # Service DNS - never localhost. Realm matches the env namespace.
            - name: KEYCLOAK_ISSUER_URI
              value: "http://{{ $root.Values.keycloak.serviceName }}:{{ $root.Values.keycloak.port }}/realms/{{ $root.Values.keycloak.realm }}"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI
              value: "http://{{ $root.Values.keycloak.serviceName }}:{{ $root.Values.keycloak.port }}/realms/{{ $root.Values.keycloak.realm }}/protocol/openid-connect/certs"
            {{- end }}
            {{- if and (ne $name "api-gateway") $root.Values.keycloak.enabled }}
            # Task 6A-10: Keycloak wiring for the servlet resource services.
            # sprin.security.oauth2.resourceserver.jwt issuer + JWKS are discovered
            # from KEYCLOAK_ISSUER_URI/KEYCLOAK_JWKS_URI (these exact env placeholders
            # exist in the packaged application YAML and config-repo). The customer
            # public client (claimassist-customer-app) and the confidential admin
            # client (claimassist-admin-service) match the realm import. Internal
            # Service DNS - never localhost. Secrets come from the Keycloak Secret.
            - name: KEYCLOAK_SERVER_URL
              value: "http://{{ $root.Values.keycloak.serviceName }}:{{ $root.Values.keycloak.port }}"
            - name: KEYCLOAK_REALM
              value: {{ $root.Values.keycloak.realm | quote }}
            - name: KEYCLOAK_ISSUER_URI
              value: "http://{{ $root.Values.keycloak.serviceName }}:{{ $root.Values.keycloak.port }}/realms/{{ $root.Values.keycloak.realm }}"
            - name: KEYCLOAK_JWKS_URI
              value: "http://{{ $root.Values.keycloak.serviceName }}:{{ $root.Values.keycloak.port }}/realms/{{ $root.Values.keycloak.realm }}/protocol/openid-connect/certs"
            - name: KEYCLOAK_TOKEN_URI
              value: "http://{{ $root.Values.keycloak.serviceName }}:{{ $root.Values.keycloak.port }}/realms/{{ $root.Values.keycloak.realm }}/protocol/openid-connect/token"
            - name: SERVICE_TOKEN_URI
              value: "http://{{ $root.Values.keycloak.serviceName }}:{{ $root.Values.keycloak.port }}/realms/{{ $root.Values.keycloak.realm }}/protocol/openid-connect/token"
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: {{ $root.Values.keycloak.client.adminClientId | quote }}
            - name: SERVICE_CLIENT_ID
              value: {{ $root.Values.keycloak.client.adminClientId | quote }}
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.keycloak.credentials.secretName }}
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
            - name: SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.keycloak.credentials.secretName }}
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
            {{- end }}
            {{- if and (eq $name "customer-service") $root.Values.keycloak.enabled }}
            # Task 6A-10: customer-service also drives the Authorization Code + PKCE
            # flow (OAuth2AuthorizationService) using the PUBLIC customer client and
            # provisions users via the confidential admin client. The redirect URI
            # must match one registered in the environment's realm import.
            - name: KEYCLOAK_CLIENT_ID
              value: {{ $root.Values.keycloak.client.customerClientId | quote }}
            - name: KEYCLOAK_TOKEN_CLIENT_ID
              value: {{ $root.Values.keycloak.client.customerClientId | quote }}
            - name: KEYCLOAK_REDIRECT_URI
              value: {{ first $root.Values.keycloak.client.redirectUris | quote }}
            {{- end }}
          {{- if $svc.k8sConfig }}
          volumeMounts:
            - name: config
              mountPath: /etc/claimassist/config
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: {{ $root.Values.probes.startup.path }}
              port: {{ $svc.port }}
            periodSeconds: {{ $root.Values.probes.startup.periodSeconds }}
            failureThreshold: {{ $root.Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ $root.Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ $root.Values.probes.liveness.path }}
              port: {{ $svc.port }}
            periodSeconds: {{ $root.Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ $root.Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ $root.Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ $root.Values.probes.readiness.path }}
              port: {{ $svc.port }}
            periodSeconds: {{ $root.Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ $root.Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ $root.Values.probes.readiness.timeoutSeconds }}
            {{- if $root.Values.probes.readiness.initialDelaySeconds }}
            initialDelaySeconds: {{ $root.Values.probes.readiness.initialDelaySeconds }}
            {{- end }}
      {{- if $svc.k8sConfig }}
      volumes:
        - name: config
          configMap:
            name: claimassist-{{ $name }}-config
      {{- end }}
{{- end }}