{{- if .Values.ingress.enabled }}
{{- $gw := index .Values.services "api-gateway" }}
---
# Task 6A-11: PUBLIC application edge. Internet -> OCI VM public IP -> NodePort ->
# shared nginx ingress controller -> THIS Ingress -> claimassist-api-gateway:8080
# -> internal K8s Services. ONLY the API Gateway is exposed here (it is the
# application edge); every other microservice and all stateful resources remain
# internal ClusterIP-only. TLS terminates at the ingress using a certificate
# provisioned by cert-manager from the environment's ACME Issuer (staging for DEV,
# production for STAGE/PROD) - see templates/issuer.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claimassist-ingress
  namespace: {{ include "claimassist.namespace" . | quote }}
  labels:
    {{- include "claimassist.labels" . | nindent 4 }}
  annotations:
    # Force HTTP -> HTTPS so nothing transits the public edge in clear text.
    # This annotation is from the F5 NGINX Ingress Controller (OSS), NOT the
    # retired community ingress-nginx project. The two controllers are NOT
    # annotation-compatible - nginx.org/* is the F5, current controller.
    nginx.org/redirect-to-https: "true"
    # cert-manager issues/renews the certificate for ingress.host automatically
    # after DNS points the host at the cluster. Namespace-scoped Issuer (per-env).
    cert-manager.io/issuer: {{ .Values.certManager.issuerName | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" | quote }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | default "/" | quote }}
            pathType: {{ .Values.ingress.pathType | default "Prefix" | quote }}
            backend:
              service:
                name: claimassist-api-gateway
                port:
                  number: {{ $gw.port }}
{{- end }}
