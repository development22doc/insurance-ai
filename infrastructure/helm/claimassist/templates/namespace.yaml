{{- if .Values.namespace.create }}
# Foundation Namespace for the environment.
# The release is installed with `helm install -n <namespace>`; this renders a
# matching Namespace so the chart is self-contained. For strict separation,
# prefer `--create-namespace` at install and set namespace.create=false.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "claimassist.namespace" . | quote }}
  labels:
    {{- include "claimassist.labels" . | nindent 4 }}
{{- end }}
