{{- if .Values.secrets.create }}
# Foundation Secret for SENSITIVE values.
# Disabled by default (values.secrets.create=false). When enabled, values are
# injected at install time via an override file / --set - NEVER stored in the
# chart or committed to Git. Real credentials belong to the stateful-resource
# and application deployment tasks; this is the safe scaffolding pattern.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name | default "app-secrets" }}
  namespace: {{ include "claimassist.namespace" . | quote }}
  labels:
    {{- include "claimassist.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $val := .Values.secrets.values }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
{{- end }}