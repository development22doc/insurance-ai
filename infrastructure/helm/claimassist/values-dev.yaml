# =============================================================================
# ClaimAssist - DEV environment values
# Namespace: claimassist-dev | one shared K3s cluster.
# Stateless application workload overrides (Task 6A-6).
# =============================================================================
global:
  environment: dev
  app: claimassist
  managedBy: helm

image:
  registry: claimassistdev   # deployed by CD; matches running pods on OCI
  repository: claimassist     # local-only fallback when registry is empty
  tag: "b781cebe484a01fc9150f59cff7c5b9fc6ad2d0d"   # current running image on OCI (set by CD at deploy time)
  pullPolicy: Always
  # docker-registry imagePullSecret consumed by every application Deployment.
  # The DEV bootstrap creates it idempotently from the DOCKER_USERNAME/DOCKER_PASSWORD
  # GitHub secrets, so an ARM64 node can pull claimassistdev/* images from Docker Hub
  # without any out-of-band/manual kubectl step. Empty "" disables it.
  pullSecret: "claimassist-registry-credentials"

namespace:
  create: true

serviceAccounts:
  create: true

configMap:
  enabled: false
  data: {}

secrets:
  create: false
  values: {}

# Task 6A-7: PostgreSQL + Flyway for DEV (namespace claimassist-dev). One
# PostgreSQL StatefulSet + ClusterIP Service + PVC for this environment only.
# Real credentials are supplied at deploy time (postgresql.credentials.*) - never
# committed. App databases (claimassist_customer/claims/agent) live inside THIS
# instance; no cross-environment URLs.
postgresql:
  enabled: true
  storageClassName: ""        # K3s default (local-path); overridden at deploy time if provided
  storageSize: 8Gi
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  securityContext: {}
  # DEV-only VPN PostgreSQL external access.
  # When enabled, a NodePort Service exposes PostgreSQL (5432) on the K3s
  # node so Tailscale VPN clients can reach the database at the MagicDNS
  # hostname. Disabled in values.yaml (global); only DEV enables it.
  devExternalAccess: true
  devExternalHost: vnic.taild219f3.ts.net
  devNodePort: 30432

# Task 6A-8: Redis for DEV (namespace claimassist-dev). One internal Deployment +
# ClusterIP Service. Cache only (no PVC / no persistence). Conservative free-tier
# resources; overridable here without a template change.
redis:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
  # DEV-only VPN Redis external access.
  # When enabled, a NodePort Service exposes Redis (6379) on the K3s
  # node so Tailscale VPN clients can reach the cache at the MagicDNS
  # hostname. Disabled in values.yaml (global); only DEV enables it.
  devExternalAccess: true
  devExternalHost: vnic.taild219f3.ts.net
  devNodePort: 30379

# Task 6A-9: Kafka for DEV (namespace claimassist-dev). One KRaft broker
# StatefulSet + internal ClusterIP Service + PVC. Free-learning-tier (NOT HA):
# RF=1, single broker. Conservative resources; overridable here.
kafka:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 500m, memory: 1Gi }
  # DEV-only VPN Kafka external access (Task 6A-VPN-1).
  # When enabled, a NodePort Service exposes the DEV listener (19092) on the
  # K3s node so Tailscale VPN clients can reach the broker at the MagicDNS
  # hostname. Disabled in values.yaml (global); only DEV enables it.
  devExternalAccess: true
  devExternalHost: vnic.taild219f3.ts.net
  devNodePort: 30092

flyway:
  enabled: true

# Task 6A-10: Keycloak for DEV (namespace claimassist-dev). One self-hosted
# Keycloak + one dedicated Keycloak PostgreSQL, fully isolated in this namespace.
# Realm = claimassist-dev (ONE realm per environment). Internal Service DNS only;
# no Ingress/TLS until Task 6A-11. Real admin/DB/secret values supplied at deploy
# time (keycloak.credentials.* / keycloak.postgresql.credentials.*) - never here.
keycloak:
  enabled: true
  realm: claimassist-dev
  replicaCount: 1
  # DEV-only: KC_HOSTNAME set to the Tailscale IP so Keycloak advertises
  # the correct external issuer URL for browser/OIDC access. Internal Spring Boot
  # services also use this URL for JWT validation (issuer-uri must match exactly).
  # The JWKS endpoint is reachable via the NodePort from inside the cluster too.
  hostname: 100.114.133.69
  externalUrl: http://100.114.133.69:30080
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 500m, memory: 1024Mi }
  # DEV-only VPN Keycloak external access.
  # When enabled, a NodePort Service exposes Keycloak HTTP (8080) on the
  # K3s node so Tailscale VPN clients can reach the admin console at the
  # MagicDNS hostname. Disabled in values.yaml (global); only DEV enables it.
  devExternalAccess: true
  devExternalHost: vnic.taild219f3.ts.net
  devNodePort: 30080
  # DEV-only: external redirect URIs for browser OIDC flow via Tailscale NodePort.
  # The browser must reach the callback URL after Keycloak authentication.
  externalRedirectUris:
    - http://100.114.133.69:30080/customer/auth/callback
  externalWebOrigins:
    - http://100.114.133.69:30080
  postgresql:
    enabled: true
    storageClassName: ""        # K3s default (local-path); overridden at deploy time if provided
    storageSize: 2Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 250m, memory: 256Mi }
    # DEV-only VPN Keycloak PostgreSQL external access.
    # When enabled, a NodePort Service exposes Keycloak PostgreSQL (5432) on
    # the K3s node so Tailscale VPN clients can reach the database at the
    # MagicDNS hostname:NodePort for IntelliJ / database administration.
    # Disabled in values.yaml (global); only DEV enables it.
    devExternalAccess: true
    devExternalHost: vnic.taild219f3.ts.net
    devNodePort: 30433

# Task 6A-11: DEV public edge + TLS. Let's Encrypt STAGING certificate - DEV is
# explicitly NEVER issued a production certificate (staging avoids rate limits and
# costs nothing). `host` is a DEPLOYMENT-TIME placeholder; replace api-dev.<your-domain>
# with the real DEV host when DNS exists. certManager.server points at the staging
# ACME directory; certManager.email is a placeholder. No production issuer here.
ingress:
  enabled: true
  className: nginx
  host: ""
  tlsEnabled: false
  tlsSecretName: claimassist-api-gateway-tls

certManager:
  enabled: false
  issuerName: claimassist-letsencrypt
  issuerSecretName: claimassist-letsencrypt-account
  email: "cert-manager@example.com"    # DEPLOYMENT-TIME placeholder
  server: "https://acme-staging-v02.api.letsencrypt.org/directory"

# Task 6A-14 RBAC intent (DEV): team-read-only is permitted here for debugging
# (pods/log, deployments, events, HPA/PDB - NO secrets, NO write). Bindings stay
# inert until a real team group identity exists (rbac.teamReadOnly.binding.enabled
# default false; set true at bootstrap to bind claimassist-team in this namespace).
rbac:
  adminBinding:
    enabled: false
  teamReadOnly:
    binding:
      enabled: false
# Task 6A-12 + TASK 6A-14B-4B: Stateless application replicas (DEV).
# FREE-TIER PROFILE: DEV is the DEFAULT-ACTIVE environment (one active env at a
# time on the single 2-OCPU node). Single-replica => NO pod-level tolerance, NO
# zero-gap rollout, NO PDB (renders only at >= 2 replicas). When STAGE/PROD are
# verified, DEV is scaled down (replicas -> 0) at runtime - namespaces/values
# are never deleted.
# Task 6A-14B-4B: DEV is the environment left RUNNING by default. Its CPU/mem
# budget is ~1.0 OCPU / ~2.4GiB for apps+data + shared observability.
services:
  api-gateway:
    replicas: 1
    k8sConfig: true
  customer-service:
    replicas: 1
    k8sConfig: true
  claims-service:
    replicas: 1
    k8sConfig: true
  agent-service:
    replicas: 1
    k8sConfig: true

# Task 6A-14B-3 + TASK 6A-14B-4B: HPA (DEV). Low-cost learning environment:
# 1 baseline replica, bounded ceiling of 2. If a spike raises CPU above the 70%
# request-based target, HPA may add ONE extra pod on the shared node, then scale
# back after 5 minutes of idle (stabilization window). No uncontrolled growth.
# 2 replicas is an UPPER BOUND; if the node is CPU constrained the extra pod stays
# unschedulable. metrics-server must be present at bootstrap for the CPU metric.
hpa:
  services:
    api-gateway:
      min: 1
      max: 2
    customer-service:
      min: 1
      max: 2
    claims-service:
      min: 1
      max: 2
    agent-service:
      min: 1
      max: 2