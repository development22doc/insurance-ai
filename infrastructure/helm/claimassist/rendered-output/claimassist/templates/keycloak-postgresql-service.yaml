---
# Source: claimassist/templates/keycloak-postgresql-service.yaml
# Dedicated Keycloak PostgreSQL ClusterIP Service. INTERNAL ONLY - the Keycloak
# StatefulSet reaches it via the K8s Service DNS name (claimassist-keycloak-
# postgresql). No NodePort, no LoadBalancer, no Ingress - never exposed outside
# the cluster. Isolated per environment namespace (no cross-environment references).
apiVersion: v1
kind: Service
metadata:
  name: claimassist-keycloak-postgresql
  namespace: "default"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: keycloak-postgresql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/component: keycloak-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP

