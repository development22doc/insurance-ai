            - name: KEYCLOAK_SERVER_URL
              value: "http://100.114.133.69:30080"
            - name: KEYCLOAK_REALM
              value: "claimassist-dev"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://100.114.133.69:30080/realms/claimassist-dev"
            - name: KEYCLOAK_JWKS_URI
              value: "http://100.114.133.69:30080/realms/claimassist-dev/protocol/openid-connect/certs"
            # Explicit Spring Security resource-server JWKS URI. This is required
            # for Claims/Customer/Agent services to auto-create JwtDecoder.
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI
              value: "http://100.114.133.69:30080/realms/claimassist-dev/protocol/openid-connect/certs"
            - name: KEYCLOAK_TOKEN_URI
              value: "http://100.114.133.69:30080/realms/claimassist-dev/protocol/openid-connect/token"
            - name: SERVICE_TOKEN_URI
              value: "http://100.114.133.69:30080/realms/claimassist-dev/protocol/openid-connect/token"
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: "claimassist-admin-service"
