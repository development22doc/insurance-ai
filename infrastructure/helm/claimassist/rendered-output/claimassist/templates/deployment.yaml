# Deployment for api-gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimassist-api-gateway
  namespace: "default"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: api-gateway
spec:
  replicas: 1
  # Task 6A-11: ZERO-DOWNTIME rolling update. maxUnavailable: 1 allows one pod to be
  # unavailable during rollout. maxSurge: 0 prevents Kubernetes from requiring additional
  # CPU capacity for replacement pods on the single 2-OCPU node, eliminating the
