            - name: SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: claimassist-keycloak-admin
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
            
            
            - name: KEYCLOAK_CLIENT_ID
              value: "claimassist-customer-app"
            - name: KEYCLOAK_TOKEN_CLIENT_ID
              value: "claimassist-customer-app"
            - name: KEYCLOAK_REDIRECT_URI
              value: "http://100.114.133.69:30070/customer/auth/callback"
            
          
          volumeMounts:
            - name: config
              mountPath: /etc/claimassist/config
              readOnly: true
          
          resources:
            
            limits:
              cpu: 800m
              memory: 640Mi
            requests:
