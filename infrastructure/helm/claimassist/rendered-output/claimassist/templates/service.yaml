# Source: claimassist/templates/service.yaml
# ClusterIP Service for agent-service - stable K8s DNS, never exposed externally.
apiVersion: v1
kind: Service
metadata:
  name: claimassist-agent-service
  namespace: "default"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: agent-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/component: agent-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
