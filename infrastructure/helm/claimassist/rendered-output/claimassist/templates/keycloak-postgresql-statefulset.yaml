---
# Source: claimassist/templates/keycloak-postgresql-statefulset.yaml
# Dedicated Keycloak PostgreSQL StatefulSet - one per K8s environment namespace.
# ISOLATED from the application PostgreSQL (postgresql.*) with its own stable
# pod identity, ClusterIP Service and persistent storage via volumeClaimTemplates
# (NOT emptyDir: Keycloak schema is durable). Credentials come from the dedicated
# Secret. Probes use pg_isready against the Keycloak DB. Security context is
# intentionally left unset by default: the official postgres image must start as
# root to chown its volume during init (same reasoning as the app PostgreSQL).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claimassist-keycloak-postgresql
  namespace: "default"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: keycloak-postgresql
spec:
  serviceName: claimassist-keycloak-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "claimassist"
      app.kubernetes.io/component: keycloak-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "claimassist"
        app.kubernetes.io/instance: "claimassist"
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: "claimassist"
        app.kubernetes.io/managed-by: "Helm"
        environment: "dev"
        app.kubernetes.io/component: keycloak-postgresql
    spec:
      containers:
        - name: postgresql
          image: "postgres:16"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: claimassist-keycloak-postgresql-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: claimassist-keycloak-postgresql-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claimassist-keycloak-postgresql-credentials
                  key: POSTGRES_PASSWORD
            - name: TZ
              value: "Asia/Kolkata"
            - name: PGTZ
              value: "Asia/Kolkata"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            exec:
              command: ["/bin/sh","-c","pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh","-c","pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["/bin/sh","-c","pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: "claimassist"
          app.kubernetes.io/instance: "claimassist"
          app.kubernetes.io/version: "1.0.0"
          app.kubernetes.io/part-of: "claimassist"
          app.kubernetes.io/managed-by: "Helm"
          environment: "dev"
          app.kubernetes.io/component: keycloak-postgresql
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "2Gi"

