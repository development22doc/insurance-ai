---
# Source: claimassist/templates/kafka-dev-service.yaml
# Kafka DEV NodePort Service - Task 6A-VPN-1. DEV-only VPN Kafka exposure.
# Exposes the DEV listener (container port 19092) on a NodePort so Tailscale
# VPN clients can reach the broker via the MagicDNS hostname:NodePort.
# Rendered ONLY when kafka.devExternalAccess is true (DEV values only).
#
# IMPORTANT: This service exposes ONLY the DEV listener. The internal
# PLAINTEXT (9092) and controller (9093) listeners remain ClusterIP-only
# via the existing claimassist-kafka Service.
apiVersion: v1
kind: Service
metadata:
  name: claimassist-kafka-dev
  namespace: "default"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: kafka
    app.kubernetes.io/variant: dev-external
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/component: kafka
  ports:
    - name: external
      port: 19092
      targetPort: external
      nodePort: 30092
      protocol: TCP

