---
# Source: claimassist/templates/kafka-service.yaml
# Kafka ClusterIP Service - Task 6A-9. INTERNAL ONLY. Applications in the same
# namespace connect to claimassist-kafka:9092 via the K8s Service DNS. The
# controller listener (9093) is also exposed (ClusterIP) so the single combined
# node's controller quorum hostname (claimassist-kafka:9093) resolves. No
# NodePort, no LoadBalancer, no Ingress - Kafka is never exposed publicly and is
# never shared across environments (each env has its own namespace + broker).
apiVersion: v1
kind: Service
metadata:
  name: claimassist-kafka
  namespace: "default"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/component: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
      protocol: TCP
    - name: external
      port: 19092
      targetPort: external
      protocol: TCP
    - name: controller
      port: 9093
      targetPort: controller
      protocol: TCP

