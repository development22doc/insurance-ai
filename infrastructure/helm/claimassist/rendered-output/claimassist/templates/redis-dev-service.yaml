---
# Source: claimassist/templates/redis-dev-service.yaml
# Redis DEV NodePort Service - DEV-only VPN Redis access.
# Exposes Redis (container port 6379) on a NodePort so Tailscale
# VPN clients can reach the cache via the MagicDNS hostname:NodePort.
# Rendered ONLY when redis.devExternalAccess is true (DEV values only).
#
# IMPORTANT: This service exposes ONLY the application port. The internal
# ClusterIP Service remains unchanged via claimassist-redis.
apiVersion: v1
kind: Service
metadata:
  name: claimassist-redis-dev
  namespace: "default"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: redis
    app.kubernetes.io/variant: dev-external
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      nodePort: 30379
      protocol: TCP

