---
# Source: claimassist/templates/postgresql-dev-service.yaml
# PostgreSQL DEV NodePort Service - DEV-only VPN PostgreSQL access.
# Exposes PostgreSQL (container port 5432) on a NodePort so Tailscale
# VPN clients can reach the database via the MagicDNS hostname:NodePort.
# Rendered ONLY when postgresql.devExternalAccess is true (DEV values only).
#
# IMPORTANT: This service exposes ONLY the application port. The internal
# ClusterIP Service remains unchanged via claimassist-postgresql.
apiVersion: v1
kind: Service
metadata:
  name: claimassist-postgresql-dev
  namespace: "default"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/variant: dev-external
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      nodePort: 30432
      protocol: TCP

