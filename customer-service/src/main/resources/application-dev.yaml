spring:
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      enabled: true
      import-check:
        enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/claimassist_customer_dev
    username: ${POSTGRES_USER:claimassist}
    password: ${POSTGRES_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/claimassist}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8180/realms/claimassist/protocol/openid-connect/certs}

security:
  service-client:
    registration-id: internal-service
    client-id: ${SERVICE_CLIENT_ID:internal-service-client}
    client-secret: ${SERVICE_CLIENT_SECRET:internal-service-secret}
    token-uri: ${SERVICE_TOKEN_URI:http://keycloak:8180/realms/claimassist/protocol/openid-connect/token}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://discovery-service:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  tracing:
    sampling:
      probability: 0.5

logging:
  level:
    com.claimassist: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# Policy Service configuration for future migration
# Phase 6: Integration preparation only. Not activated in existing flow.
policy-service:
  uri: ${POLICY_SERVICE_URI:http://policy-service:8084}
