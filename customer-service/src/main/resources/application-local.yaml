server:
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:100.114.133.69}:${POSTGRES_PORT:30432}/claimassist_customer_local
    username: ${POSTGRES_USER:claimassist}
    password: ${POSTGRES_PASSWORD:claimassist}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  flyway:
    enabled: true

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:100.114.133.69}
      port: ${REDIS_PORT:30379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.114.133.69:30092}

    producer:
      acks: all
      retries: 2147483647
      batch-size: 16384
      linger-ms: 10
      compression-type: snappy
      delivery-timeout-ms: 120000
      properties:
        linger.ms: 10
        request.timeout.ms: 30000
        retry.backoff.ms: 1000

    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.114.133.69:30092}
      group-id: customer-service-local

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://100.114.133.69:30080/realms/claimassist-dev}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://100.114.133.69:30080/realms/claimassist-dev/protocol/openid-connect/certs}

      client:
        registration:
          internal-service:
            provider: keycloak
            client-id: ${SERVICE_CLIENT_ID:claimassist-admin-service}
            client-secret: ${SERVICE_CLIENT_SECRET:local-dev-admin-client-secret}
            authorization-grant-type: client_credentials

        provider:
          keycloak:
            token-uri: ${SERVICE_TOKEN_URI:http://100.114.133.69:30080/realms/claimassist-dev/protocol/openid-connect/token}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
    hostname: ${EUREKA_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    enable:
      jvm: true
      process: true
      logback: true

    distribution:
      percentiles-histogram:
        http.server.requests: true

    tags:
      application: ${spring.application.name}
      environment: local
      source: intellij
      developer: ${CLAIMASSIST_DEVELOPER_NAME:unknown}

  prometheus:
    metrics:
      export:
        enabled: true

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tracing:
  sampling:
    probability: 1.0

zipkin:
  tracing:
    endpoint: ${ZIPKIN_ENDPOINT:http://100.114.133.69:30941/api/v2/spans}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

# Policy Service configuration for future migration
# Phase 6: Integration preparation only. Not activated in existing flow.
policy-service:
  uri: ${POLICY_SERVICE_URI:http://localhost:8084}
