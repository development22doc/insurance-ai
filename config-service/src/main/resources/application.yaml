spring:
  application:
    name: config-service

  # Config Server (native, file:./config-repo) does not use a database. common-lib
  # brings spring-boot-starter-data-jpa onto the classpath; without these excludes
  # Boot would attempt to configure a DataSource/EntityManagerFactory and fail
  # because no datasource URL is set. Exclude only the JDBC/JPA/initialization
  # auto-configurations that are irrelevant to a native Config Server.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_NATIVE_SEARCH_LOCATIONS:file:./config-repo}

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
        # A Config Server holds credentials in resolved property sources (DB passwords,
        # Keycloak secrets). env/configprops would let a caller read them back - explicitly
        # exclude even though the Config Server auto-exposes them by default.
        exclude: env,configprops

  health:
    config:
      enabled: false

tracing:
  sampling:
    probability: 1.0

zipkin:
  tracing:
    endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.cloud.config: DEBUG

---

spring:
  config:
    activate:
      on-profile: k8s

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
