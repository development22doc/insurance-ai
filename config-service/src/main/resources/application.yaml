spring:
  application:
    name: config-service

  profiles:
    active: git

  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:file:./config-repo}
          default-label: ${CONFIG_GIT_LABEL:master}
          clone-on-start: true
          timeout: 10
          search-paths: ""

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: false
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    config:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.cloud.config: DEBUG

---
spring:
  config:
    activate:
      on-profile: k8s
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false