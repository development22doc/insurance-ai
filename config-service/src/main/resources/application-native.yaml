spring:
  cloud:
    config:
      server:
        native:
          # Use project-local config-repo by default. Allow override via
          # CONFIG_NATIVE_SEARCH_LOCATIONS environment variable.
          search-locations: ${CONFIG_NATIVE_SEARCH_LOCATIONS:file:./config-repo}

server:
  port: 8888

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.cloud.config: DEBUG

