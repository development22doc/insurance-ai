# ============================================================================
# ClaimAssist AI Platform - minimum project-side Sonar configuration
#
# This file only wires Sonar to the JaCoCo coverage reports already produced by
# each module's Maven build (Task 5A-8). No server URL, login, or token is set
# here - those MUST be provided externally (e.g. CI/CD secrets) at analysis time.
#
# Run from the repo root after `mvn clean test`:
#   mvn verify sonar:sonar \
#     -Dsonar.host.url=<SERVER_URL> \
#     -Dsonar.token=<TOKEN>
# ============================================================================

sonar.projectKey=claimassist-ai-platform
sonar.projectName=ClaimAssist AI Platform
sonar.projectVersion=1.0.0

# Sonar auto-detects Java sources/binaries per Maven module, but we explicitly
# scope the analysis to the source/test directories of the application modules.
sonar.sources=common-lib,discovery-service,config-service,api-gateway,customer-service,claims-service,agent-service
sonar.tests=common-lib/src/test,discovery-service/src/test,config-service/src/test,api-gateway/src/test,customer-service/src/test,claims-service/src/test,agent-service/src/test

# Consume the JaCoCo XML report each module emits into target/site/jacoco/.
# Missing reports are tolerated by Sonar until every module's tests run.
sonar.coverage.jacoco.xmlReportPaths=\
  common-lib/target/site/jacoco/jacoco.xml,\
  discovery-service/target/site/jacoco/jacoco.xml,\
  config-service/target/site/jacoco/jacoco.xml,\
  api-gateway/target/site/jacoco/jacoco.xml,\
  customer-service/target/site/jacoco/jacoco.xml,\
  claims-service/target/site/jacoco/jacoco.xml,\
  agent-service/target/site/jacoco/jacoco.xml

# Keep build/test artifacts and generated sources out of analysis.
sonar.exclusions=**/target/**,**/generated/**,**/*.yaml,**/*.yml,**/*.properties
