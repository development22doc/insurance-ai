# Redis Deployment - Task 6A-8. Redis is a CACHE / ephemeral state resource.
# Exactly ONE instance per K8s environment namespace (dev / stage / prod each get
# their own isolated claimassist-redis). A Deployment (not a StatefulSet) is used
# because Redis needs no stable pod identity and no persistent storage here.
#
# CACHE LOSS IS ACCEPTABLE: RDB save and AOF are disabled (--save "" --appendonly
# no) and /data is an ephemeral emptyDir, so a restart clears the cache and
# applications recover from their source of truth (PostgreSQL). Intentionally NO
# PVC, NO persistence, NO replication, NO Sentinel, NO Cluster.
#
# protected-mode is disabled because this cluster has no Redis AUTH (LOCAL uses
# no password), and the applications connect from OTHER pods via the ClusterIP
# Service (their pod IP, not loopback); protected-mode would otherwise reject
# those non-loopback connections. Runs as the official redis image user (999) with
# all capabilities dropped.
