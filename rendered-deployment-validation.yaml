# Source: claimassist/templates/kafka-statefulset.yaml
# Kafka StatefulSet - Task 6A-9. Kafka is an EVENT / LOG resource, so it needs
# stable identity + persistent storage: a StatefulSet (replicas 1) with a PVC via
# volumeClaimTemplates (NOT emptyDir - unlike Redis, event loss is not acceptable).
#
# KRaft combined broker+controller node (no ZooKeeper). The env mirrors the LOCAL
# docker-compose broker configuration EXACTLY, except the LOCAL compose service
# name (kafka) is replaced by the K8s Service DNS (claimassist-kafka) in the
# advertised listener + controller quorum. 9093 (controller) is also exposed via
# the ClusterIP Service so the single node's controller quorum hostname
# (claimassist-kafka:9093) resolves.
#
# SINGLE-BROKER HONESTY: this is the free-learning-tier architecture, NOT
# production HA. One broker => broker failure = Kafka downtime; RF = 1 everywhere
# (topics, consumer offsets, transaction state log); no failover / rack awareness.
# See the deployment help below.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claimassist-kafka
  namespace: "default"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: kafka
spec:
  serviceName: claimassist-kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "claimassist"
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "claimassist"
        app.kubernetes.io/instance: "claimassist"
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: "claimassist"
        app.kubernetes.io/managed-by: "Helm"
        environment: "dev"
        app.kubernetes.io/component: kafka
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: kafka
          image: "apache/kafka:3.8.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: kafka
              containerPort: 9092
              protocol: TCP
            - name: external
              containerPort: 19092
              protocol: TCP
            - name: controller
              containerPort: 9093
              protocol: TCP
          env:
            # KRaft single-node cluster identity.
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            # Internal listeners. The ADVERTISED broker listener uses the K8s
            # Service DNS (claimassist-kafka) so external clients (apps) resolve
            # the broker through the ClusterIP Service.
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,DEV://:19092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://claimassist-kafka.default.svc.cluster.local:9092,DEV://vnic.taild219f3.ts.net:30092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DEV:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            # SINGLE-NODE KRaft SELF-QUORUM. The combined broker+controller must be
            # able to reach the controller quorum BEFORE this pod is Ready. The
            # ClusterIP Service (claimassist-kafka) only gets an endpoint once the
            # pod passes readiness, and readiness requires KRaft startup to finish -
            # a cycle that dead-locks the "controller acknowledge caught up" step and
            # CrashLoopBackOffs the broker. Using the loopback address for the
            # single-node controller quorum breaks that cycle: the controller
            # listener binds :9093 on all interfaces, so the broker reaches its own
            # controller via 127.0.0.1 regardless of Service/endpoint status. The
            # controller listener is internal-only and never advertised to clients,
            # so loopback is safe for a single combined node.
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:9093"
            # Single broker => RF and ISR must be 1 everywhere (matches LOCAL
            # and the application's replication-factor:1 / min-isr:1 outbox topics).
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Topics are created by the application's NewTopic beans (KafkaAdmin)
            # and auto-created via this flag; no separate topic-init Job needed.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            # JVM heap cap so the free-tier broker stays within its memory limit.
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: data
              mountPath: "/var/lib/kafka/data"
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            exec:
              # Prefer a simple local TCP probe using bash if available (avoids
              # relying on Kafka metadata which may advertise the Service DNS
              # before endpoints are ready). If /bin/bash is not present in the
              # image, fall back to the existing kafka-broker-api-versions.sh
              # probe so we do not assume additional binaries.
              command: ["/bin/sh", "-c", "if [ -x /bin/bash ]; then /bin/bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9092'; else /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092; fi"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "if [ -x /bin/bash ]; then /bin/bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9092'; else /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092; fi"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "if [ -x /bin/bash ]; then /bin/bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9092'; else /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092; fi"]
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: "claimassist"
          app.kubernetes.io/instance: "claimassist"
          app.kubernetes.io/version: "1.0.0"
          app.kubernetes.io/part-of: "claimassist"
          app.kubernetes.io/managed-by: "Helm"
          environment: "dev"
          app.kubernetes.io/component: kafka
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "8Gi"



