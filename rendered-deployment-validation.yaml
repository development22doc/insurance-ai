kind: Deployment
metadata:
  name: claimassist-redis
  namespace: "default"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "claimassist"
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "claimassist"
        app.kubernetes.io/instance: "claimassist"
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: "claimassist"
        app.kubernetes.io/managed-by: "Helm"
        environment: "dev"
        app.kubernetes.io/component: redis
    spec:
      securityContext:
