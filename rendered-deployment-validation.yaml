# Source: claimassist/templates/networkpolicy.yaml
# 1) DEFAULT-DENY - ingress + egress for every managed pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claimassist-default-deny
  namespace: "default"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "claimassist"
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress: []
---
# Source: claimassist/templates/networkpolicy.yaml
# 2) INTRA-NAMESPACE TRUST BOUNDARY. Every legitimate connection required by the
#    locked architecture is between this chart's own pods in ONE namespace:
#      gateway -> customer/claims/agent            (K8s Service DNS routes)
#      customer/claims/agent -> PostgreSQL:5432    (DataSources)
#      all four apps        -> Redis:6379          (rate-limit / cache)
#      claims/agent         -> Kafka:9092          (producer + consumer)
#      Kafka controller self-quorum -> :9093       (single-node KRaft)
#      apps                 -> Keycloak:8080       (JWKS/issuer/admin client)
#      Keycloak             -> Keycloak-PostgreSQL:5432
#      Flyway Job           -> PostgreSQL:5432     (schema migrations)
#    Gridding out every peer x port here would only duplicate the egress matrix
#    without tightening the real trust boundary (the namespace) and invites
#    drift/guesswork. External and cross-environment traffic stay blocked.
#    FIX: Explicit namespaceSelector on egress to force kube-router to program
#    distinct EGRESS ipsets (bare podSelector fails on same-namespace peers).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claimassist-allow-internal
  namespace: "default"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "claimassist"
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "default"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "claimassist"
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "default"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "claimassist"
---
