management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
    tags:
      application: ${spring.application.name}
    enable:
      jvm: true
      process: true
      logback: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Common outbox defaults
outbox:
  publisher:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    retry:
      base-delay-ms: ${OUTBOX_RETRY_BASE_DELAY_MS:1000}
      max-delay-ms: ${OUTBOX_RETRY_MAX_DELAY_MS:60000}
      multiplier: ${OUTBOX_RETRY_MULTIPLIER:2.0}
  topics:
    partitions: ${OUTBOX_TOPIC_PARTITIONS:3}
    replication-factor: ${OUTBOX_TOPIC_REPLICATION_FACTOR:1}
    min-in-sync-replicas: ${OUTBOX_TOPIC_MIN_IN_SYNC_REPLICAS:1}

# Common internal API secret placeholder
internal:
  api:
    secret: ${INTERNAL_API_SECRET:}

