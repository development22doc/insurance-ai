spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

          routes:
            # ===========================
            # Customer Service
            # ===========================

            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customer/**
              filters:
                - StripPrefix=1

            - id: customer-auth-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            # ===========================
            # Claims Service
            # ===========================

            - id: claims-service
              uri: lb://CLAIMS-SERVICE
              predicates:
                - Path=/claims/**

            # ===========================
            # Agent Service
            # ===========================

            - id: agent-service
              uri: lb://AGENT-SERVICE
              predicates:
                - Path=/agent/**

            # ===========================
            # Policy APIs
            # ===========================

            - id: policy-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/policies/**

            # ===========================
            # Versioned Public API (V1)
            # ===========================
            # URI versioning foundation (Task 8.1). Strategy: Gateway-only
            # versioning (Option C). The gateway strips the /api/v1 prefix
            # (StripPrefix=2) and forwards the unversioned downstream path so
            # the existing service controllers, DTOs, and business logic are
            # reused unchanged - no business logic is duplicated and the old
            # unversioned routes above remain for backward compatibility.
            #
            # Compatibility: the /api/v1 routes reuse the exact same downstream
            # controllers as the unversioned routes (verified path mapping),
            # so V1 semantics, auth, authz, SSE, and status codes are identical.
            # Future /api/v2 routes can be added here without redesign.
            #
            # /internal/v1/** is NOT gateway-routed and is intentionally excluded
            # from the public /api/v1 namespace - internal Feign contracts stay
            # internal.

            - id: api-v1-claims-service
              uri: lb://CLAIMS-SERVICE
              predicates:
                - Path=/api/v1/claims/**
              filters:
                - StripPrefix=2

            - id: api-v1-agent-service
              uri: lb://AGENT-SERVICE
              predicates:
                - Path=/api/v1/agent/**
              filters:
                - StripPrefix=2

            - id: api-v1-customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/v1/customers/**
              filters:
                - StripPrefix=2

            - id: api-v1-policy-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/v1/policies/**
              filters:
                - StripPrefix=2

            - id: api-v1-auth-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=2

app:
  security:
    public-routes:
      - /auth/signup
      - /auth/authorize
      - /auth/callback
      - /auth/refresh
      - /auth/logout
      - /customer/webhooks/**
      - /api/v1/auth/signup
      - /api/v1/auth/authorize
      - /api/v1/auth/callback
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway

  metrics:
    enable:
      jvm: true
      process: true
      logback: true
      redis: true

    distribution:
      percentiles-histogram:
        http.server.requests: true
        redis.command.duration: true

    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tracing:
  sampling:
    probability: 1.0

zipkin:
  tracing:
    endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
    reactor.netty.http.client: DEBUG

  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

commonlib:
  performance:
    info-threshold-ms: 100
    warn-threshold-ms: 500
    error-threshold-ms: 2000
    categories:
      REQUEST:
        info: 100
        warn: 500
        error: 2000
