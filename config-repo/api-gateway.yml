spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

          routes:
            # ===========================
            # Customer Service
            # ===========================

            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customer/**
              filters:
                - StripPrefix=1

            # ===========================
            # Claims Service
            # ===========================

            - id: claims-service
              uri: lb://CLAIMS-SERVICE
              predicates:
                - Path=/claims/**

            # ===========================
            # Agent Service
            # ===========================

            - id: agent-service
              uri: lb://AGENT-SERVICE
              predicates:
                - Path=/agent/**

            # ===========================
            # Policy APIs
            # ===========================

            - id: policy-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/policies/**

app:
  security:
    public-routes:
      - /customer/auth/signup
      - /customer/auth/authorize
      - /customer/auth/callback
      - /customer/auth/refresh
      - /customer/auth/logout
      - /customer/webhooks/**
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway

  metrics:
    enable:
      jvm: true
      process: true
      logback: true
      redis: true

    distribution:
      percentiles-histogram:
        http.server.requests: true
        redis.command.duration: true

    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tracing:
  sampling:
    probability: 1.0

zipkin:
  tracing:
    endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
    reactor.netty.http.client: DEBUG

  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

commonlib:
  performance:
    info-threshold-ms: 100
    warn-threshold-ms: 500
    error-threshold-ms: 2000
    categories:
      REQUEST:
        info: 100
        warn: 500
        error: 2000
