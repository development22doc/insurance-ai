# Source: claimassist/templates/flyway-migrations-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: claimassist-flyway-migrations-customer-service
  namespace: "claimassist-dev"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist-dev"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: flyway-migrations
data:
  V1__init_customer_schema.sql: |-
    CREATE TABLE IF NOT EXISTS customers (
        id                 BIGSERIAL PRIMARY KEY,
        username           VARCHAR(255) NOT NULL UNIQUE,
        password           VARCHAR(255) NOT NULL,
        full_name          VARCHAR(255) NOT NULL,
        stripe_customer_id VARCHAR(255),
        kyc_status         VARCHAR(32) NOT NULL DEFAULT 'PENDING'
    );
    
    CREATE TABLE IF NOT EXISTS coverage_plans (
        id                   BIGSERIAL PRIMARY KEY,
        name                 VARCHAR(64) NOT NULL,
        product_type         VARCHAR(32) NOT NULL,
        annual_premium_cents BIGINT NOT NULL,
        deductible_cents     BIGINT NOT NULL,
        coverage_limit_cents BIGINT NOT NULL,
        stripe_price_id      VARCHAR(255)
    );
    
    CREATE TABLE IF NOT EXISTS policies (
        id                     BIGSERIAL PRIMARY KEY,
        customer_id            BIGINT NOT NULL REFERENCES customers(id),
        coverage_plan_id       BIGINT NOT NULL REFERENCES coverage_plans(id),
        policy_number          VARCHAR(64) NOT NULL UNIQUE,
        status                 VARCHAR(32) NOT NULL DEFAULT 'PENDING',
        effective_date         TIMESTAMP NOT NULL,
        renewal_date           TIMESTAMP,
        stripe_subscription_id VARCHAR(255)
    );
    
    -- A few starter coverage plans so the platform is usable out of the box.
    INSERT INTO coverage_plans (name, product_type, annual_premium_cents, deductible_cents, coverage_limit_cents)
    VALUES
        ('Basic', 'AUTO', 60000, 100000, 2500000),
        ('Standard', 'AUTO', 95000, 50000, 5000000),
        ('Comprehensive', 'AUTO', 140000, 25000, 10000000);
    
  V2__keycloak_migration.sql: |-
    -- Keycloak cutover.
    --
    -- `password` is no longer written or read by the application - Keycloak is
    -- now the sole holder of credentials. We deliberately do NOT drop the column
    -- in this release: existing rows keep their bcrypt hash as a rollback safety
    -- net (see docs/keycloak-migration-plan.md), and a later cleanup migration
    -- can drop it once the Keycloak cutover has been running in production for a
    -- full release cycle without incident.
    ALTER TABLE customers ALTER COLUMN password DROP NOT NULL;
    
    -- Keycloak's own user id (UUID) for this customer, populated by AuthController
    -- at signup time once the corresponding Keycloak user has been created.
    ALTER TABLE customers ADD COLUMN IF NOT EXISTS keycloak_id VARCHAR(64) UNIQUE;
    
  V3__add_refresh_tokens_table.sql: |-
    -- V3: Add refresh tokens table for local token management and rotation tracking
    CREATE TABLE IF NOT EXISTS refresh_tokens (
        id          BIGSERIAL PRIMARY KEY,
        token       VARCHAR(512) NOT NULL UNIQUE,
        customer_id BIGINT NOT NULL REFERENCES customers(id) ON DELETE CASCADE,
        issued_at   TIMESTAMP NOT NULL,
        expires_at  TIMESTAMP NOT NULL,
        revoked     BOOLEAN NOT NULL DEFAULT FALSE,
        rotated_to  VARCHAR(512)
    );
    
    -- Index for efficient customer-based queries
    CREATE INDEX idx_refresh_tokens_customer_id ON refresh_tokens(customer_id);
    
    -- Index for cleaning up expired tokens
    CREATE INDEX idx_refresh_tokens_expires_at ON refresh_tokens(expires_at);
    
    -- Index for token lookup
    CREATE INDEX idx_refresh_tokens_token ON refresh_tokens(token);
    
    
  V4__add_policy_customer_index.sql: |-
    -- V4: Add index on policies.customer_id to support customer policy queries.
    -- Supports PolicyRepository.findByCustomerId (plain and paginated) and
    -- PolicyRepository.findByIdAndCustomerId (customer_id half), all of which
    -- filter policies by customer_id.
    CREATE INDEX IF NOT EXISTS idx_policies_customer_id
        ON policies (customer_id);
  V5__widen_refresh_token_column.sql: |-
    -- V5: Widen refresh token columns for Keycloak-issued JWTs.
    --
    -- Phase 2: the local refresh_tokens table now stores the ACTUAL Keycloak-issued
    -- refresh token value (not a locally generated random token). Keycloak refresh
    -- tokens are signed JWTs that routinely exceed the previous VARCHAR(512) limit,
    -- which would otherwise truncate/fail persistence. TEXT is unbounded, matching
    -- the Keycloak token size.
    ALTER TABLE refresh_tokens ALTER COLUMN token TYPE TEXT;
    ALTER TABLE refresh_tokens ALTER COLUMN rotated_to TYPE TEXT;
  V6__drop_duplicate_refresh_token_index.sql: |-
    -- V6: Drop the redundant index on refresh_tokens.token.
    --
    -- V3 created refresh_tokens.token as "VARCHAR(512) NOT NULL UNIQUE". The UNIQUE
    -- constraint already materializes a unique B-tree index on token, so the
    -- explicit CREATE INDEX idx_refresh_tokens_token in V3 is a duplicate index.
    -- Both indexes serve the same "WHERE token = ?" predicate used by
    -- RefreshTokenRepository.findByToken and consumeForRotation, so the extra one
    -- adds only write overhead and storage with no query benefit.
    --
    -- Dropping it is backward compatible: PostgreSQL drops only the redundant index
    -- and the UNIQUE constraint index (idx_refresh_tokens_token_key) remains.
    DROP INDEX IF EXISTS idx_refresh_tokens_token;
---
# Source: claimassist/templates/flyway-migrations-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: claimassist-flyway-migrations-claims-service
  namespace: "claimassist-dev"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist-dev"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: flyway-migrations
data:
  V1__init_claims_schema.sql: |-
    CREATE TABLE IF NOT EXISTS claims (
        id                    BIGSERIAL PRIMARY KEY,
        claim_number          VARCHAR(64) NOT NULL UNIQUE,
        policy_id             BIGINT NOT NULL,
        incident_type         VARCHAR(64) NOT NULL,
        status                VARCHAR(32) NOT NULL,
        estimated_amount_cents BIGINT,
        approved_amount_cents  BIGINT,
        incident_date         TIMESTAMP NOT NULL,
        created_at            TIMESTAMP NOT NULL,
        updated_at            TIMESTAMP,
        deleted_at            TIMESTAMP
    );
    
    CREATE TABLE IF NOT EXISTS claim_parties (
        claim_id    BIGINT NOT NULL REFERENCES claims(id),
        user_id     BIGINT NOT NULL,
        claim_role  VARCHAR(32) NOT NULL,
        added_at    TIMESTAMP NOT NULL,
        PRIMARY KEY (claim_id, user_id)
    );
    
    CREATE TABLE IF NOT EXISTS claim_documents (
        id                BIGSERIAL PRIMARY KEY,
        claim_id          BIGINT NOT NULL REFERENCES claims(id),
        path              VARCHAR(512) NOT NULL,
        minio_object_key  VARCHAR(512) NOT NULL,
        doc_type          VARCHAR(64) NOT NULL,
        ocr_status        VARCHAR(32) NOT NULL DEFAULT 'PENDING',
        extracted_text    TEXT,
        fraud_signal_score DOUBLE PRECISION,
        uploaded_at       TIMESTAMP NOT NULL
    );
    
    -- Audit table: intentionally never Hibernate-ddl-auto-managed, even during a
    -- transition period, since it is the permanent record of every claim status
    -- change (including AI-agent-proposed changes) for compliance purposes.
    CREATE TABLE IF NOT EXISTS claim_status_history (
        id          BIGSERIAL PRIMARY KEY,
        claim_id    BIGINT NOT NULL REFERENCES claims(id),
        from_status VARCHAR(32) NOT NULL,
        to_status   VARCHAR(32) NOT NULL,
        changed_by  VARCHAR(64) NOT NULL,
        note        TEXT,
        changed_at  TIMESTAMP NOT NULL
    );
    
    CREATE TABLE IF NOT EXISTS outbox_events (
        id            BIGSERIAL PRIMARY KEY,
        aggregate_id  VARCHAR(255) NOT NULL,
        event_type    VARCHAR(255) NOT NULL,
        topic         VARCHAR(255) NOT NULL,
        partition_key VARCHAR(255),
        payload       TEXT NOT NULL,
        status        VARCHAR(32) NOT NULL,
        created_at    TIMESTAMP NOT NULL,
        published_at  TIMESTAMP,
        attempts      INTEGER NOT NULL DEFAULT 0,
        last_error    TEXT
    );
    CREATE INDEX IF NOT EXISTS idx_outbox_status_created ON outbox_events (status, created_at);
    
    CREATE TABLE IF NOT EXISTS processed_events (
        saga_id      VARCHAR(255) PRIMARY KEY,
        processed_at TIMESTAMP NOT NULL
    );
    
    CREATE TABLE IF NOT EXISTS idempotency_records (
        "key"         VARCHAR(255) PRIMARY KEY,
        user_id       BIGINT NOT NULL,
        operation     VARCHAR(255) NOT NULL,
        response_body TEXT NOT NULL,
        created_at    TIMESTAMP NOT NULL
    );
    
  V2__add_claims_reliability.sql: |-
    -- V2: Add reliability and tracking columns for claims processing
    ALTER TABLE claims
        ADD COLUMN IF NOT EXISTS version INTEGER NOT NULL DEFAULT 0;
    
    ALTER TABLE claims
        ADD COLUMN IF NOT EXISTS locked_by VARCHAR(255);
    
    ALTER TABLE claims
        ADD COLUMN IF NOT EXISTS locked_until TIMESTAMP;
    
    CREATE INDEX IF NOT EXISTS idx_claims_policy_status
        ON claims (policy_id, status);
    
    CREATE INDEX IF NOT EXISTS idx_claims_updated_at
        ON claims (updated_at DESC);
    
    
  V3__add_document_processing.sql: |-
    -- V3: Add document processing and fraud detection support
    ALTER TABLE claim_documents
        ADD COLUMN IF NOT EXISTS processing_status VARCHAR(32) NOT NULL DEFAULT 'PENDING';
    
    ALTER TABLE claim_documents
        ADD COLUMN IF NOT EXISTS processing_error TEXT;
    
    ALTER TABLE claim_documents
        ADD COLUMN IF NOT EXISTS processed_at TIMESTAMP;
    
    ALTER TABLE claim_documents
        ADD COLUMN IF NOT EXISTS fraud_flag BOOLEAN NOT NULL DEFAULT FALSE;
    
    CREATE INDEX IF NOT EXISTS idx_claim_documents_status
        ON claim_documents (claim_id, processing_status);
    
    CREATE INDEX IF NOT EXISTS idx_claim_documents_uploaded
        ON claim_documents (uploaded_at DESC);
    
    -- Enhanced claim_status_history for audit trail
    ALTER TABLE claim_status_history
        ADD COLUMN IF NOT EXISTS metadata TEXT;
    
    CREATE INDEX IF NOT EXISTS idx_claim_status_history_claim
        ON claim_status_history (claim_id, changed_at DESC);
    
    
  V4__enhance_outbox_reliability.sql: |-
    ALTER TABLE outbox_events
        ADD COLUMN IF NOT EXISTS last_attempt_at TIMESTAMP;
    
    ALTER TABLE outbox_events
        ADD COLUMN IF NOT EXISTS next_attempt_at TIMESTAMP;
    
    UPDATE outbox_events
    SET next_attempt_at = COALESCE(next_attempt_at, published_at, created_at, CURRENT_TIMESTAMP)
    WHERE next_attempt_at IS NULL;
    
    ALTER TABLE outbox_events
        ALTER COLUMN next_attempt_at SET NOT NULL;
    
    CREATE INDEX IF NOT EXISTS idx_outbox_status_next_attempt_created
        ON outbox_events (status, next_attempt_at, created_at);
    
    CREATE INDEX IF NOT EXISTS idx_outbox_aggregate_event_type
        ON outbox_events (aggregate_id, event_type);
    
  V5__add_saga_orchestrator_tables.sql: |-
    CREATE TABLE IF NOT EXISTS claim_saga_orchestrations (
        id                     BIGSERIAL PRIMARY KEY,
        saga_id                VARCHAR(255) NOT NULL UNIQUE,
        action                 VARCHAR(64) NOT NULL,
        status                 VARCHAR(64) NOT NULL,
        current_step           VARCHAR(64),
        claim_id               BIGINT,
        policy_id              BIGINT,
        incident_type          VARCHAR(255),
        incident_date          VARCHAR(255),
        estimated_amount_cents BIGINT,
        actor_user_id          BIGINT,
        note                   TEXT,
        idempotency_key        VARCHAR(255),
        attempts               INTEGER NOT NULL DEFAULT 0,
        compensation_required  BOOLEAN NOT NULL DEFAULT FALSE,
        expires_at             TIMESTAMP NOT NULL,
        created_at             TIMESTAMP NOT NULL,
        updated_at             TIMESTAMP NOT NULL,
        last_error             TEXT
    );
    
    CREATE INDEX IF NOT EXISTS idx_claim_saga_status_expires
        ON claim_saga_orchestrations (status, expires_at);
    
    CREATE INDEX IF NOT EXISTS idx_claim_saga_updated
        ON claim_saga_orchestrations (updated_at);
    
    CREATE TABLE IF NOT EXISTS saga_processed_messages (
        message_id   VARCHAR(255) PRIMARY KEY,
        processed_at TIMESTAMP NOT NULL
    );
    
  V6__add_saga_recovery_tracking.sql: |-
    -- V6__add_saga_recovery_tracking.sql
    -- Adds failure recovery and compensation tracking columns to saga orchestration
    
    ALTER TABLE claim_saga_orchestrations
        ADD COLUMN IF NOT EXISTS next_retry_at TIMESTAMP;
    
    ALTER TABLE claim_saga_orchestrations
        ADD COLUMN IF NOT EXISTS last_recovery_attempt_at TIMESTAMP;
    
    ALTER TABLE claim_saga_orchestrations
        ADD COLUMN IF NOT EXISTS last_recovery_error TEXT;
    
    ALTER TABLE claim_saga_orchestrations
        ADD COLUMN IF NOT EXISTS recovery_failure_count INTEGER DEFAULT 0;
    
    -- Index for recovery scanning
    CREATE INDEX IF NOT EXISTS idx_saga_recovery_status_next_retry
        ON claim_saga_orchestrations (status, next_retry_at);
    
    
  V7__add_outbox_trace_context.sql: |-
    -- V7__add_outbox_trace_context.sql
    -- Adds correlation context fields to outbox_events for distributed trace propagation
    -- These fields are captured at event creation time so they can be propagated to Kafka headers
    -- when publishing (OutboxEventPublisher runs in a scheduled thread with separate MDC)
    
    ALTER TABLE outbox_events
        ADD COLUMN IF NOT EXISTS correlation_id VARCHAR(255);
    
    ALTER TABLE outbox_events
        ADD COLUMN IF NOT EXISTS trace_id VARCHAR(255);
    
    ALTER TABLE outbox_events
        ADD COLUMN IF NOT EXISTS span_id VARCHAR(255);
    
    -- Create index to help with tracing queries
    CREATE INDEX IF NOT EXISTS idx_outbox_correlation_id
        ON outbox_events (correlation_id);
    
    CREATE INDEX IF NOT EXISTS idx_outbox_trace_id
        ON outbox_events (trace_id);
    
    
  V8__add_query_indexes.sql: |-
    -- V8: Add query indexes for claims-service access patterns.
    -- idx_claim_parties_user_id supports ClaimRepository.findAllAccessibleByUser,
    -- which filters claim_parties by user_id (the "my claims" listing). The
    -- composite primary key (claim_id, user_id) does not lead with user_id.
    CREATE INDEX IF NOT EXISTS idx_claim_parties_user_id
        ON claim_parties (user_id, claim_id);
    
    -- idx_claim_saga_status_updated_at supports
    -- ClaimSagaOrchestrationRepository.findRecoverableSagas:
    -- WHERE status = ? AND updated_at <= ? (equality column first, range second).
    CREATE INDEX IF NOT EXISTS idx_claim_saga_status_updated_at
        ON claim_saga_orchestrations (status, updated_at);
  V9__add_claim_version.sql: |-
    -- Phase 2 Task 10.1: Optimistic locking for Claim.
    -- Adds a version column that Hibernate/JPA @Version uses to detect concurrent
    -- (lost-update) writes to the same claim. Existing rows receive version 0 via
    -- the NOT NULL DEFAULT; new rows are initialized by Hibernate on insert.
    -- Non-destructive: no drop/recreate, no existing index changes.
    ALTER TABLE claims ADD COLUMN IF NOT EXISTS version BIGINT NOT NULL DEFAULT 0;
  V10__fix_claim_version_type.sql: |-
    -- Phase 14 Task 14.1: Align claims.version column type with the entity.
    -- The Claim entity maps @Version as Long (bigint) and V9 declared BIGINT, but the
    -- column was created earlier as INTEGER and V9's ADD COLUMN IF NOT EXISTS was a
    -- no-op, causing local-profile schema validation to fail (found int4, expecting
    -- bigint). This alters the existing column type non-destructively (no drop/recreate).
    ALTER TABLE claims ALTER COLUMN version TYPE BIGINT;
  V11__add_history_document_indexes.sql: |-
    -- V11: Add indexes for the two most frequent claim read paths.
    --
    -- Rationale (Phase 4, Section 5 - Database Index Review):
    --
    -- 1. claim_status_history(claim_id)
    --    Backs ClaimStatusHistoryRepository.findByClaimIdOrderByChangedAtAsc, which is
    --    invoked on EVERY get_claim_status call (InternalClaimsController / the
    --    agent-service get_claim_status tool) and on GET /claims/{id}. claim_status_history
    --    is an append-only audit trail (never deleted), so it grows without bound; without
    --    this index every status read is a sequential scan over the whole history table.
    --    The (claim_id, changed_at) composite keeps the ORDER BY changed_at ASC index-only
    --    instead of requiring a separate sort. Selectivity is high (one claim's rows),
    --    and writes (append-only inserts) are unaffected because new rows insert at the
    --    trailing edge of the index.
    --
    -- 2. claim_documents(claim_id)
    --    Backs ClaimDocumentRepository.findByClaimId, used by
    --    InternalClaimsController.getClaimDocuments. The table has no index on the
    --    claim_id FK today (only the BIGSERIAL PK), so document listings scan the table.
    --    claim_id is highly selective (a claim owns a handful of documents) and the FK
    --    write path is unchanged.
    --
    -- Both indexes are created with IF NOT EXISTS to stay idempotent. They are NEW
    -- indexes in a NEW migration - V1/V8 are already applied and are never modified.
    CREATE INDEX IF NOT EXISTS idx_claim_status_history_claim_id
        ON claim_status_history (claim_id, changed_at);
    
    CREATE INDEX IF NOT EXISTS idx_claim_documents_claim_id
        ON claim_documents (claim_id);
    
  V13__add_outbox_request_id.sql: |-
    -- Mirrors claims-service/src/main/resources/db/migration/V13__add_outbox_request_id.sql.
    ALTER TABLE outbox_events
        ADD COLUMN IF NOT EXISTS request_id VARCHAR(255);
    
    CREATE INDEX IF NOT EXISTS idx_outbox_request_id
        ON outbox_events (request_id);
---
# Source: claimassist/templates/flyway-migrations-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: claimassist-flyway-migrations-agent-service
  namespace: "claimassist-dev"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist-dev"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: flyway-migrations
data:
  V1__init_agent_schema.sql: |-
    CREATE TABLE IF NOT EXISTS agent_sessions (
        claim_id BIGINT NOT NULL,
        user_id  BIGINT NOT NULL,
        PRIMARY KEY (claim_id, user_id)
    );
    
    CREATE TABLE IF NOT EXISTS agent_messages (
        id          BIGSERIAL PRIMARY KEY,
        claim_id    BIGINT NOT NULL,
        user_id     BIGINT NOT NULL,
        role        VARCHAR(32) NOT NULL,
        content     TEXT,
        tokens_used INTEGER NOT NULL DEFAULT 0,
        created_at  TIMESTAMP NOT NULL,
        FOREIGN KEY (claim_id, user_id) REFERENCES agent_sessions(claim_id, user_id)
    );
    
    -- Permanent audit trail of every AI-agent action, whether accepted or
    -- rejected - see AgentEvent's Javadoc. Never Hibernate-ddl-auto-managed.
    CREATE TABLE IF NOT EXISTS agent_events (
        id                BIGSERIAL PRIMARY KEY,
        agent_message_id  BIGINT NOT NULL REFERENCES agent_messages(id),
        type              VARCHAR(32) NOT NULL,
        status            VARCHAR(32) NOT NULL,
        sequence_order    INTEGER NOT NULL,
        content           TEXT,
        saga_id           VARCHAR(255),
        proposed_status   VARCHAR(32)
    );
    CREATE INDEX IF NOT EXISTS idx_agent_events_saga_id ON agent_events (saga_id);
    
    CREATE TABLE IF NOT EXISTS outbox_events (
        id            BIGSERIAL PRIMARY KEY,
        aggregate_id  VARCHAR(255) NOT NULL,
        event_type    VARCHAR(255) NOT NULL,
        topic         VARCHAR(255) NOT NULL,
        partition_key VARCHAR(255),
        payload       TEXT NOT NULL,
        status        VARCHAR(32) NOT NULL,
        created_at    TIMESTAMP NOT NULL,
        published_at  TIMESTAMP,
        attempts      INTEGER NOT NULL DEFAULT 0,
        last_error    TEXT
    );
    CREATE INDEX IF NOT EXISTS idx_outbox_status_created ON outbox_events (status, created_at);
    
  V2__add_session_tracking.sql: |-
    -- V2: Add agent session tracking and message reliability columns
    ALTER TABLE agent_sessions
        ADD COLUMN IF NOT EXISTS session_started_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP;
    
    ALTER TABLE agent_sessions
        ADD COLUMN IF NOT EXISTS session_ended_at TIMESTAMP;
    
    ALTER TABLE agent_sessions
        ADD COLUMN IF NOT EXISTS is_active BOOLEAN NOT NULL DEFAULT TRUE;
    
    ALTER TABLE agent_messages
        ADD COLUMN IF NOT EXISTS message_id VARCHAR(255);
    
    ALTER TABLE agent_messages
        ADD COLUMN IF NOT EXISTS response_tokens INTEGER NOT NULL DEFAULT 0;
    
    CREATE INDEX IF NOT EXISTS idx_agent_sessions_active
        ON agent_sessions (claim_id, is_active);
    
    CREATE INDEX IF NOT EXISTS idx_agent_messages_created
        ON agent_messages (claim_id, created_at DESC);
    
    
  V3__add_event_processing.sql: |-
    -- V3: Add event processing and tool execution tracking
    ALTER TABLE agent_events
        ADD COLUMN IF NOT EXISTS created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP;
    
    ALTER TABLE agent_events
        ADD COLUMN IF NOT EXISTS tool_call_id VARCHAR(255);
    
    ALTER TABLE agent_events
        ADD COLUMN IF NOT EXISTS tool_name VARCHAR(255);
    
    ALTER TABLE agent_events
        ADD COLUMN IF NOT EXISTS tool_status VARCHAR(32);
    
    ALTER TABLE agent_events
        ADD COLUMN IF NOT EXISTS result_data TEXT;
    
    CREATE INDEX IF NOT EXISTS idx_agent_events_status
        ON agent_events (status, created_at DESC);
    
    CREATE INDEX IF NOT EXISTS idx_agent_events_tool
        ON agent_events (tool_name, tool_status);
    
    -- Add version for optimistic locking
    ALTER TABLE agent_messages
        ADD COLUMN IF NOT EXISTS version INTEGER NOT NULL DEFAULT 0;
    
    
  V4__enhance_outbox_reliability.sql: |-
    ALTER TABLE outbox_events
        ADD COLUMN IF NOT EXISTS last_attempt_at TIMESTAMP;
    
    ALTER TABLE outbox_events
        ADD COLUMN IF NOT EXISTS next_attempt_at TIMESTAMP;
    
    UPDATE outbox_events
    SET next_attempt_at = COALESCE(next_attempt_at, published_at, created_at, CURRENT_TIMESTAMP)
    WHERE next_attempt_at IS NULL;
    
    ALTER TABLE outbox_events
        ALTER COLUMN next_attempt_at SET NOT NULL;
    
    CREATE INDEX IF NOT EXISTS idx_outbox_status_next_attempt_created
        ON outbox_events (status, next_attempt_at, created_at);
    
    CREATE INDEX IF NOT EXISTS idx_outbox_aggregate_event_type
        ON outbox_events (aggregate_id, event_type);
    
  V5__add_outbox_trace_context.sql: |-
    -- V5__add_outbox_trace_context.sql
    -- Adds correlation context fields to outbox_events for distributed trace propagation
    -- These fields are captured at event creation time so they can be propagated to Kafka headers
    -- when publishing (OutboxEventPublisher runs in a scheduled thread with separate MDC)
    
    ALTER TABLE outbox_events
        ADD COLUMN IF NOT EXISTS correlation_id VARCHAR(255);
    
    ALTER TABLE outbox_events
        ADD COLUMN IF NOT EXISTS trace_id VARCHAR(255);
    
    ALTER TABLE outbox_events
        ADD COLUMN IF NOT EXISTS span_id VARCHAR(255);
    
    -- Create index to help with tracing queries
    CREATE INDEX IF NOT EXISTS idx_outbox_correlation_id
        ON outbox_events (correlation_id);
    
    CREATE INDEX IF NOT EXISTS idx_outbox_trace_id
        ON outbox_events (trace_id);
    
    
  V6__add_query_indexes.sql: |-
    -- V6: Add query indexes for agent-service access patterns.
    -- idx_agent_events_message_id supports the JOIN FETCH between agent_messages
    -- and agent_events in AgentMessageRepository.findByAgentSessionWithEvents.
    CREATE INDEX IF NOT EXISTS idx_agent_events_message_id
        ON agent_events (agent_message_id);
    
    -- idx_agent_messages_session_created supports
    -- AgentMessageRepository.findByAgentSessionWithEvents:
    -- WHERE claim_id = ? AND user_id = ? ORDER BY created_at ASC
    -- (equality columns first, sort column last).
    CREATE INDEX IF NOT EXISTS idx_agent_messages_session_created
        ON agent_messages (claim_id, user_id, created_at);

