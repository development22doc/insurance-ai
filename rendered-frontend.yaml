# Kubernetes application configuration for agent-service.
# Rendered as a profile-specific application-k8s.yaml and activated together with
# the existing Spring `k8s` profile (SPRING_PROFILES_ACTIVE=k8s). Loaded via
# SPRING_CONFIG_ADDITIONAL_LOCATIONS (file:/etc/claimassist/config/).
# LOCKED K8s model: runtime configuration comes from this ConfigMap (+ Secret),
# NOT from Config Server and NOT from config-repo. No Eureka (K8s Service DNS).
apiVersion: v1
kind: ConfigMap
metadata:
  name: claimassist-agent-service-config
  namespace: "claimassist-dev"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist-dev"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: agent-service
data:
  application-k8s.yaml: |

    # Kubernetes runtime configuration for agent-service.
    # Activated via the existing Spring `k8s` profile (SPRING_PROFILES_ACTIVE=k8s).
    # LOCKED K8s model: no Config Server, no Eureka/discovery - Kubernetes Service DNS.
    # agent-service also disables spring.cloud.config locally (config client off),
    # and its base application.yaml now imports config server optionally; the empty
    # override here guarantees no Config Server dependency at runtime.
    spring:
      config:
        import: ""
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: ${KEYCLOAK_ISSUER_URI}
              jwk-set-uri: ${KEYCLOAK_JWKS_URI}
      cloud:
        discovery:
          enabled: false
      autoconfigure:
        exclude:
          - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
          - org.springframework.cloud.config.client.ConfigClientAutoConfiguration
    
    eureka:
      client:
        enabled: false
    
    server:
      port: 8083
