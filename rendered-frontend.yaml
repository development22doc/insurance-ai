# Source: claimassist/templates/kafka-statefulset.yaml
# Kafka StatefulSet - Task 6A-9. Kafka is an EVENT / LOG resource, so it needs
# stable identity + persistent storage: a StatefulSet (replicas 1) with a PVC via
# volumeClaimTemplates (NOT emptyDir - unlike Redis, event loss is not acceptable).
#
# KRaft combined broker+controller node (no ZooKeeper). The env mirrors the LOCAL
# docker-compose broker configuration EXACTLY, except the LOCAL compose service
# name (kafka) is replaced by the K8s Service DNS (claimassist-kafka) in the
# advertised listener + controller quorum. 9093 (controller) is also exposed via
# the ClusterIP Service so the single node's controller quorum hostname
# (claimassist-kafka:9093) resolves.
#
# SINGLE-BROKER HONESTY: this is the free-learning-tier architecture, NOT
# production HA. One broker => broker failure = Kafka downtime; RF = 1 everywhere
# (topics, consumer offsets, transaction state log); no failover / rack awareness.
# See the deployment help below.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claimassist-kafka
  namespace: "claimassist-dev"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist-dev"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: kafka
spec:
  serviceName: claimassist-kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "claimassist"
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "claimassist"
        app.kubernetes.io/instance: "claimassist-dev"
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: "claimassist"
        app.kubernetes.io/managed-by: "Helm"
        environment: "dev"
        app.kubernetes.io/component: kafka
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: kafka
          image: "apache/kafka:3.8.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: kafka
              containerPort: 9092
              protocol: TCP
            - name: external
              containerPort: 19092
              protocol: TCP
            - name: controller
              containerPort: 9093
              protocol: TCP
          env:
            # KRaft single-node cluster identity.
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            # Internal listeners. The ADVERTISED broker listener uses the K8s
            # Service DNS (claimassist-kafka) so external clients (apps) resolve
            # the broker through the ClusterIP Service.
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,DEV://:19092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://claimassist-kafka.claimassist-dev.svc.cluster.local:9092,DEV://localhost:19092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DEV:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            # SINGLE-NODE KRaft SELF-QUORUM. The combined broker+controller must be
            # able to reach the controller quorum BEFORE this pod is Ready. The
            # ClusterIP Service (claimassist-kafka) only gets an endpoint once the
            # pod passes readiness, and readiness requires KRaft startup to finish -
            # a cycle that dead-locks the "controller acknowledge caught up" step and
            # CrashLoopBackOffs the broker. Using the loopback address for the
            # single-node controller quorum breaks that cycle: the controller
            # listener binds :9093 on all interfaces, so the broker reaches its own
            # controller via 127.0.0.1 regardless of Service/endpoint status. The
            # controller listener is internal-only and never advertised to clients,
            # so loopback is safe for a single combined node.
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:9093"
            # Single broker => RF and ISR must be 1 everywhere (matches LOCAL
            # and the application's replication-factor:1 / min-isr:1 outbox topics).
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Topics are created by the application's NewTopic beans (KafkaAdmin)
            # and auto-created via this flag; no separate topic-init Job needed.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            # JVM heap cap so the free-tier broker stays within its memory limit.
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: data
              mountPath: "/var/lib/kafka/data"
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            exec:
              # Prefer a simple local TCP probe using bash if available (avoids
              # relying on Kafka metadata which may advertise the Service DNS
              # before endpoints are ready). If /bin/bash is not present in the
              # image, fall back to the existing kafka-broker-api-versions.sh
              # probe so we do not assume additional binaries.
              command: ["/bin/sh", "-c", "if [ -x /bin/bash ]; then /bin/bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9092'; else /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092; fi"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "if [ -x /bin/bash ]; then /bin/bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9092'; else /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092; fi"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "if [ -x /bin/bash ]; then /bin/bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9092'; else /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092; fi"]
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: "claimassist"
          app.kubernetes.io/instance: "claimassist-dev"
          app.kubernetes.io/version: "1.0.0"
          app.kubernetes.io/part-of: "claimassist"
          app.kubernetes.io/managed-by: "Helm"
          environment: "dev"
          app.kubernetes.io/component: kafka
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "8Gi"



---
# Source: claimassist/templates/keycloak-postgresql-statefulset.yaml
# Dedicated Keycloak PostgreSQL StatefulSet - one per K8s environment namespace.
# ISOLATED from the application PostgreSQL (postgresql.*) with its own stable
# pod identity, ClusterIP Service and persistent storage via volumeClaimTemplates
# (NOT emptyDir: Keycloak schema is durable). Credentials come from the dedicated
# Secret. Probes use pg_isready against the Keycloak DB. Security context is
# intentionally left unset by default: the official postgres image must start as
# root to chown its volume during init (same reasoning as the app PostgreSQL).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claimassist-keycloak-postgresql
  namespace: "claimassist-dev"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist-dev"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: keycloak-postgresql
spec:
  serviceName: claimassist-keycloak-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "claimassist"
      app.kubernetes.io/component: keycloak-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "claimassist"
        app.kubernetes.io/instance: "claimassist-dev"
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: "claimassist"
        app.kubernetes.io/managed-by: "Helm"
        environment: "dev"
        app.kubernetes.io/component: keycloak-postgresql
    spec:
      containers:
        - name: postgresql
          image: "postgres:16"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: claimassist-keycloak-postgresql-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: claimassist-keycloak-postgresql-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claimassist-keycloak-postgresql-credentials
                  key: POSTGRES_PASSWORD
            - name: TZ
              value: "Asia/Kolkata"
            - name: PGTZ
              value: "Asia/Kolkata"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            exec:
              command: ["/bin/sh","-c","pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh","-c","pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["/bin/sh","-c","pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: "claimassist"
          app.kubernetes.io/instance: "claimassist-dev"
          app.kubernetes.io/version: "1.0.0"
          app.kubernetes.io/part-of: "claimassist"
          app.kubernetes.io/managed-by: "Helm"
          environment: "dev"
          app.kubernetes.io/component: keycloak-postgresql
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "2Gi"

---
# Source: claimassist/templates/keycloak-statefulset.yaml
# Keycloak StatefulSet - one per K8s environment namespace. INTERNAL ONLY.
# replicaCount defaults to 1 (learning-tier; NOT real Keycloak HA - see values).
# Keycloak's persistent state lives in the dedicated Keycloak PostgreSQL, so it
# does NOT request a PVC (no volumeClaimTemplates). The deterministic realm import
# is mounted read-only from the realm ConfigMap and consumed with the official
# `start --import-realm` bootstrap (the SAME mechanism LOCAL uses). Admin and DB
# credentials come from Secrets - never committed. Probes use Keycloak's health
# endpoints with generous startup timing (Keycloak + PostgreSQL + realm import).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claimassist-keycloak
  namespace: "claimassist-dev"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist-dev"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: keycloak
spec:
  serviceName: claimassist-keycloak
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "claimassist"
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "claimassist"
        app.kubernetes.io/instance: "claimassist-dev"
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: "claimassist"
        app.kubernetes.io/managed-by: "Helm"
        environment: "dev"
        app.kubernetes.io/component: keycloak
    spec:
      # Deterministic dependency: do not start Keycloak (or crash-loop against a
      # still-initializing DB) until the dedicated Keycloak PostgreSQL accepts
      # connections. Polls pg_isready via Service DNS; runs as the postgres image's
      # own tooling but as a non-root numeric uid with dropped caps.
      initContainers:
        - name: wait-for-db
          image: "postgres:16"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              until pg_isready -h claimassist-keycloak-postgresql -p 5432 -U "$KC_DB_USERNAME" -d keycloak >/dev/null 2>&1; do
                echo "waiting for claimassist-keycloak-postgresql:5432 (keycloak) to be ready..."
                sleep 5
              done
              echo "claimassist-keycloak-postgresql is ready"
          env:
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: claimassist-keycloak-postgresql-credentials
                  key: POSTGRES_USER
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: realm-import
          configMap:
            name: claimassist-keycloak-realm
            defaultMode: 0444
      containers:
        - name: keycloak
          image: "quay.io/keycloak/keycloak:26.0"
          imagePullPolicy: IfNotPresent
          # `args` (NOT `command`): the Keycloak image ENTRYPOINT is
          # /opt/keycloak/bin/kc.sh, and `command` would REPLACE that entrypoint,
          # making kubelet exec an executable named `start` that is not on $PATH
          # (-> CrashLoopBackOff). `args` appends to the entrypoint, yielding the
          # correct `kc.sh start --import-realm`.
          args: ["start", "--import-realm"]
          # Container-level securityContext (NOT pod-level): every key here
          # (runAsNonRoot, allowPrivilegeEscalation, readOnlyRootFilesystem,
          # capabilities, seccompProfile) is a CONTAINER securityContext field.
          # Rendering them at spec.template.spec.securityContext is a Kubernetes
          # schema error and is rejected by the API server.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://claimassist-keycloak-postgresql:5432/keycloak"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: claimassist-keycloak-postgresql-credentials
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claimassist-keycloak-postgresql-credentials
                  key: POSTGRES_PASSWORD
            - name: KC_HOSTNAME
              value: "claimassist-keycloak"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: claimassist-keycloak-admin
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claimassist-keycloak-admin
                  key: KEYCLOAK_ADMIN_PASSWORD
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            limits:
              cpu: 500m
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /realms/claimassist-dev/.well-known/openid-configuration
              port: http
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /realms/claimassist-dev/.well-known/openid-configuration
              port: http
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /realms/claimassist-dev/.well-known/openid-configuration
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5

---
# Source: claimassist/templates/postgresql-statefulset.yaml
# PostgreSQL StatefulSet - exactly ONE per K8s environment namespace (dev /
# stage / prod each get their own instance + storage). Stable pod identity via a
# dedicated ClusterIP Service + persistent storage via volumeClaimTemplates (a
# PVC per pod). Data is NOT emptyDir. Credentials come from the Secret. Probes
# use pg_isready against the postgres maintenance db (`postgres` always exists),
# matching the LOCAL docker-compose healthcheck. Security context is
# intentionally left unset by default: the official postgres image must start as
# root to chown its volume during init, so runAsNonRoot would break it (see 6A-7
# change log).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claimassist-postgresql
  namespace: "claimassist-dev"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist-dev"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: postgresql
spec:
  serviceName: claimassist-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "claimassist"
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "claimassist"
        app.kubernetes.io/instance: "claimassist-dev"
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: "claimassist"
        app.kubernetes.io/managed-by: "Helm"
        environment: "dev"
        app.kubernetes.io/component: postgresql
    spec:
      volumes:
        - name: init-db
          configMap:
            name: claimassist-postgresql-init
            defaultMode: 0755
      containers:
        - name: postgresql
          image: "postgres:16"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: claimassist-postgresql-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claimassist-postgresql-credentials
                  key: POSTGRES_PASSWORD
            - name: TZ
              value: "Asia/Kolkata"
            - name: PGTZ
              value: "Asia/Kolkata"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-db
              mountPath: /docker-entrypoint-initdb.d
          resources:
            limits:
              cpu: 500m
              memory: 768Mi
            requests:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            exec:
              command: ["/bin/sh","-c","pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh","-c","pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["/bin/sh","-c","pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: "claimassist"
          app.kubernetes.io/instance: "claimassist-dev"
          app.kubernetes.io/version: "1.0.0"
          app.kubernetes.io/part-of: "claimassist"
          app.kubernetes.io/managed-by: "Helm"
          environment: "dev"
          app.kubernetes.io/component: postgresql
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "8Gi"

---
# Source: claimassist/templates/ingress.yaml
# Task 6A-11: DEV public application edge.
# Free OCI IP-based deployment:
# Internet -> OCI public IP -> NGINX Ingress -> API Gateway.
#
# TLS and cert-manager are conditional. They remain disabled for the
# current no-domain/free-tier deployment.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claimassist-ingress
  namespace: "claimassist-dev"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist-dev"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"

spec:
  ingressClassName: "nginx"

  rules:
    -
      host: "<your-domain>"
      http:
        paths:
          - path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: claimassist-api-gateway
                port:
                  number: 8080
---
# Source: claimassist/templates/flyway-migrations-configmap.yaml
# Flyway migration sources - one ConfigMap per application database/service.
# The SQL is the EXACT repository migration set (copied verbatim under
# files/migrations/<service>/, validated in 6A-7). A ConfigMap volume mounts each
# key as a file, so these are mounted into the Flyway Job as
# /flyway/sql/<service>/<version>__<name>.sql. Non-sensitive - migrations are source.
---
# Source: claimassist/templates/hpa.yaml
# =============================================================================
# Task 6A-14B-3 + TASK 6A-14B-4B - HPA for the STATELESS application services ONLY.
#
#   api-gateway / customer-service / claims-service / agent-service
#
# NO HPA is ever created for PostgreSQL, Kafka, Redis, Keycloak-PostgreSQL or
# Keycloak (stateful; fixed single-replica on the free tier). Only a service
# listed in .Values.hpa.services gets an HPA - absent keys render nothing.
#
# CPU (Resource) target is driven by each pod's CPU *request* (see the Deployment
# resources), so scaling tracks real utilization without inventing thresholds.
# Task 6A-14B-4B bounds min/max to 1/2 for DEV, STAGE and PROD - max is NEVER 3.
#
# HPA SAFETY on the single 2-OCPU node: 2 replicas is an UPPER BOUND, not
# guaranteed simultaneous capacity. If CPU pressure drives several services toward
# their max together, the extra pods simply become unschedulable - the Kubernetes
# scheduler keeps the node under its capacity, so HPA cannot overflow the budget.
#
# POD-LEVEL scaling only - this is NOT node-level scaling. The single-node
# Always-Free A1.Flex (2 OCPU / 12GB) remains a node-level single point of
# failure; HPA only adds/removes pods on that one node.
# =============================================================================
---
# Source: claimassist/templates/networkpolicy.yaml
# =============================================================================
# Task 6A-14B-3 - NETWORKPOLICY + ENVIRONMENT ISOLATION.
#
# Isolation model (default-deny at the namespace trust boundary):
#   - A single DEFAULT-DENY (Ingress + Egress) selects every workload this chart
#     manages in THIS namespace. Nothing may reach a ClaimAssist pod, and no
#     ClaimAssist pod may leave the namespace, unless an allow policy below
#     (or a peer pod rule in the same namespace) permits it.
#   - CROSS-ENVIRONMENT isolation follows structurally: every allow rule selects
#     same-namespace pods OR specific shared infra namespaces
#     (kube-system for DNS, claimassist-observability for Prometheus,
#     nginx-ingress for the public edge). No rule in this chart can ever match a
#     pod in claimassist-stage / claimassist-prod, and vice versa - so dev can
#     never reach stage/prod (or the reverse) at the network layer, regardless of
#     any application-level configuration.
#   - This is enforced with the CURRENT Helm labels only (app.kubernetes.io/name,
#     app.kubernetes.io/instance, app.kubernetes.io/component). No legacy labels.
# =============================================================================
---
# Source: claimassist/templates/networkpolicy.yaml
# 3) EXPLICIT EGRESS RULES - Workaround for kube-router EGRESS ipset bug.
#    kube-router fails to populate EGRESS ipsets for same-namespace peer policies.
#    These explicit per-component egress rules use distinct selectors that kube-router
#    correctly programs, allowing client pods to reach their required dependencies.
---
# Source: claimassist/templates/networkpolicy.yaml
# 4) INGRESS RULES FOR INFRASTRUCTURE PODS
#    These allow application services to connect to infrastructure dependencies.
#    The default-deny blocks all ingress; these policies explicitly permit required connections.
---
# Source: claimassist/templates/serviceaccounts.yaml
# Foundation ServiceAccounts - one per application.
# LEAST PRIVILEGE:
# - No application is granted cluster-admin or additional RBAC permissions.
# - automountServiceAccountToken=false prevents Kubernetes API credentials
#   from being mounted into application pods.
# - ServiceAccounts are namespace-scoped to claimassist-<env>.
---
# Source: claimassist/templates/issuer.yaml
# Task 6A-11: cert-manager integration. This renders the cert-manager manifest required
# by this chart (an automatic TLS Issuer); it does NOT install the cert-manager
# operator itself (that is installed/deployed separately, out of scope for this task,
# and is a release-time prerequisite). cert-manager is NOT claimed to be present.
#
# DEV     -> Let's Encrypt STAGING (no production certificate, no rate-limit risk)
# STAGE   -> Let's Encrypt PRODUCTION
# PROD    -> Let's Encrypt PRODUCTION
#
# A namespace-scoped Issuer (not ClusterIssuer) is used deliberately: the cluster is
# ONE shared K3s node with three per-environment namespaces (claimassist-dev/stage/prod).
# A namespace-scoped Issuer keeps account key + ACME identity fully isolated per
# environment, collides with nothing across namespaces, and is removed cleanly with
# its own release. The Ingress references it via cert-manager.io/issuer.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: claimassist-letsencrypt
  namespace: "claimassist-dev"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist-dev"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
spec:
  acme:
    # Let's Encrypt API endpoint (env-specific): staging or production.
    server: ""
    # Operator contact email for the ACME account. Deployment-time value; no real
    # email is committed.
    email: "cert-manager@example.com"
    # The ACME account private key is held in a Secret managed by cert-manager.
    # Never committed. Per-environment (namespace-scoped) so it never collides.
    privateKeySecretRef:
      name: "claimassist-letsencrypt-account"
    solvers:
      - http01:
          ingress:
            class: "nginx"
---
# Source: claimassist/templates/flyway-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: claimassist-postgresql-flyway
  namespace: "claimassist-dev"
  labels:
    app.kubernetes.io/name: "claimassist"
    app.kubernetes.io/instance: "claimassist-dev"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: "claimassist"
    app.kubernetes.io/managed-by: "Helm"
    environment: "dev"
    app.kubernetes.io/component: flyway
  annotations:
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": "before-hook-creation"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "claimassist"
        app.kubernetes.io/instance: "claimassist-dev"
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: "claimassist"
        app.kubernetes.io/managed-by: "Helm"
        environment: "dev"
        app.kubernetes.io/component: flyway
    spec:
      restartPolicy: OnFailure
      containers:
        - name: flyway
          image: "flyway/flyway:11"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              echo "========================================"
              echo "ClaimAssist Flyway migration"
              echo "========================================"

              echo "==> Checking claimassist_customer"

              flyway \
                -url="jdbc:postgresql://claimassist-postgresql:5432/claimassist_customer" \
                -user="$FLYWAY_USER" \
                -password="$FLYWAY_PASSWORD" \
                -locations="filesystem:/flyway/sql/customer-service" \
                -connectRetries=120 \
                info

              echo "==> Migrating claimassist_customer (customer-service)"

              flyway \
                -url="jdbc:postgresql://claimassist-postgresql:5432/claimassist_customer" \
                -user="$FLYWAY_USER" \
                -password="$FLYWAY_PASSWORD" \
                -locations="filesystem:/flyway/sql/customer-service" \
                -connectRetries=120 \
                migrate

              echo "==> claimassist_customer migration completed"

              echo "==> Checking claimassist_claims"

              flyway \
                -url="jdbc:postgresql://claimassist-postgresql:5432/claimassist_claims" \
                -user="$FLYWAY_USER" \
                -password="$FLYWAY_PASSWORD" \
                -locations="filesystem:/flyway/sql/claims-service" \
                -connectRetries=120 \
                info

              echo "==> Migrating claimassist_claims (claims-service)"

              flyway \
                -url="jdbc:postgresql://claimassist-postgresql:5432/claimassist_claims" \
                -user="$FLYWAY_USER" \
                -password="$FLYWAY_PASSWORD" \
                -locations="filesystem:/flyway/sql/claims-service" \
                -connectRetries=120 \
                migrate

              echo "==> claimassist_claims migration completed"

              echo "==> Checking claimassist_agent"

              flyway \
                -url="jdbc:postgresql://claimassist-postgresql:5432/claimassist_agent" \
                -user="$FLYWAY_USER" \
                -password="$FLYWAY_PASSWORD" \
                -locations="filesystem:/flyway/sql/agent-service" \
                -connectRetries=120 \
                info

              echo "==> Migrating claimassist_agent (agent-service)"

              flyway \
                -url="jdbc:postgresql://claimassist-postgresql:5432/claimassist_agent" \
                -user="$FLYWAY_USER" \
                -password="$FLYWAY_PASSWORD" \
                -locations="filesystem:/flyway/sql/agent-service" \
                -connectRetries=120 \
                migrate

              echo "==> claimassist_agent migration completed"

              echo "========================================"
              echo "ALL FLYWAY MIGRATIONS COMPLETED"
              echo "========================================"

          env:
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: claimassist-postgresql-credentials
                  key: POSTGRES_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: claimassist-postgresql-credentials
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: mig-customer-service
              mountPath: /flyway/sql/customer-service
              readOnly: true
            - name: mig-claims-service
              mountPath: /flyway/sql/claims-service
              readOnly: true
            - name: mig-agent-service
              mountPath: /flyway/sql/agent-service
              readOnly: true

          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi

      volumes:
        - name: mig-customer-service
          configMap:
            name: claimassist-flyway-migrations-customer-service
        - name: mig-claims-service
          configMap:
            name: claimassist-flyway-migrations-claims-service
        - name: mig-agent-service
          configMap:
            name: claimassist-flyway-migrations-agent-service

