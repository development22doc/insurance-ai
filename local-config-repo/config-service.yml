management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    enable:
      jvm: true
      process: true
      logback: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
