server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    enable:
      jvm: true
      process: true
      logback: true
      tomcat: true
      jdbc: true
      redis: true
      kafka: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        jdbc.connections.usage: true
        redis.command.duration: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/claimassist_claims_local
    username: claimassist
    password: claimassist

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  kafka:
    # Default to the host Kafka listener. When running services from the host
    # (IntelliJ / java -jar) use the broker at `localhost:9092`. When running
    # services inside Docker compose override KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    # in the container environment.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      observation-enabled: ${KAFKA_PRODUCER_OBSERVATION_ENABLED:true}
      acks: ${KAFKA_PRODUCER_ACKS:all}
      retries: ${KAFKA_PRODUCER_RETRIES:2147483647}
      batch-size: ${KAFKA_PRODUCER_BATCH_SIZE:16384}
      linger-ms: ${KAFKA_PRODUCER_LINGER_MS:10}
      properties:
        compression.type: ${KAFKA_PRODUCER_COMPRESSION:snappy}
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:30000}
        retry.backoff.ms: ${KAFKA_RETRY_BACKOFF_MS:1000}
    listener:
      observation-enabled: ${KAFKA_LISTENER_OBSERVATION_ENABLED:true}
  security:
    oauth2:
      client:
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/claimassist/protocol/openid-connect/token}
        registration:
          internal-service:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: ${SERVICE_CLIENT_ID:claimassist-admin-service}
            client-secret: ${SERVICE_CLIENT_SECRET:}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/claimassist}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/claimassist/protocol/openid-connect/certs}

service-client:
  registration-id: ${SERVICE_CLIENT_REGISTRATION_ID:internal-service}

outbox:
  publisher:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    retry:
      base-delay-ms: ${OUTBOX_RETRY_BASE_DELAY_MS:1000}
      max-delay-ms: ${OUTBOX_RETRY_MAX_DELAY_MS:60000}
      multiplier: ${OUTBOX_RETRY_MULTIPLIER:2.0}
  topics:
    partitions: ${OUTBOX_TOPIC_PARTITIONS:3}
    replication-factor: ${OUTBOX_TOPIC_REPLICATION_FACTOR:1}
    min-in-sync-replicas: ${OUTBOX_TOPIC_MIN_IN_SYNC_REPLICAS:1}
internal:
  api:
    secret: ${INTERNAL_API_SECRET:}

saga:
  orchestrator:
    timeout-seconds: ${SAGA_TIMEOUT_SECONDS:180}
    timeout-scan-ms: ${SAGA_TIMEOUT_SCAN_MS:5000}
    recovery:
      retry-delay-seconds: ${SAGA_RECOVERY_RETRY_DELAY_SECONDS:30}
      scan-ms: ${SAGA_RECOVERY_SCAN_MS:15000}
      max-attempts: ${SAGA_RECOVERY_MAX_ATTEMPTS:3}
      backoff-multiplier: ${SAGA_RECOVERY_BACKOFF_MULTIPLIER:2.0}

cache:
  customer:
    ttl-seconds: ${CACHE_CUSTOMER_TTL_SECONDS:300}
  policy:
    ttl-seconds: ${CACHE_POLICY_TTL_SECONDS:600}
  claim:
    ttl-seconds: ${CACHE_CLAIM_TTL_SECONDS:60}
  lookup:
    ttl-seconds: ${CACHE_LOOKUP_TTL_SECONDS:3600}

cqrs:
   read-model:
     sync-enabled: ${CQRS_SYNC_ENABLED:true}
     invalidation-enabled: ${CQRS_INVALIDATION_ENABLED:true}

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1000
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - java.net.ConnectException
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
        ignore-exceptions:
          - feign.FeignException.BadRequest
          - feign.FeignException.NotFound
          - feign.FeignException.Unauthorized
          - org.springframework.security.authentication.CredentialsExpiredException
    instances:
      customerService:
        base-config: default
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 5000
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-enabled: true
        wait-duration-in-open-state: 10000
    instances:
      customerService:
        base-config: default
  timeout:
    configs:
      default:
        timeout-duration: 5000
        cancel-running-future: true
    instances:
      customerService:
        base-config: default
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 10
        max-wait-duration: 5000
    instances:
      customerService:
        base-config: default
  ratelimiter:
    configs:
      default:
        limit-refresh-period: 1m
        limit-for-period: 100
        timeout-duration: 5000
    instances:
      customerService:
        base-config: default
