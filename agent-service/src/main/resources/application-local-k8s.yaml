# LOCAL-K8S: Agent Service connecting to OCI K3s dependencies via SSH tunnels
# Profile: local-k8s
#
# This profile is for IntelliJ/local debugging against the real OCI K3s infrastructure.
#
# Prerequisites (run once):
#   scripts/oci-k8s-connect.ps1
#
# This establishes SSH tunnels:
#   PostgreSQL: localhost:15432 â†’ claimassist-postgresql:5432
#   Redis:      localhost:16379 â†’ claimassist-redis:6379
#   Kafka:      localhost:9092  â†’ claimassist-kafka:9092
#   Keycloak:   localhost:18080 â†’ claimassist-keycloak:8080

spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  config:
    import: ""
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:15432}/claimassist_agent?serverTimezone=UTC
    username: ${POSTGRES_USER:claimassist}
    password: ${POSTGRES_PASSWORD:claimassist}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
          time_zone: UTC

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 2147483647
      batch-size: 16384
      linger-ms: 10
      compression-type: snappy
      delivery-timeout-ms: 120000
      properties:
        linger.ms: 10
        request.timeout.ms: 30000
        retry.backoff.ms: 1000

    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      group-id: agent-service-local-k8s
      max-poll-records: 100
      session-timeout-ms: 30000
      enable-auto-commit: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:18080/realms/claimassist-dev}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://127.0.0.1:18080/realms/claimassist-dev/protocol/openid-connect/certs}

security:
  service-client:
    registration-id: internal-service
    client-id: ${SERVICE_CLIENT_ID:internal-service-client}
    client-secret: ${SERVICE_CLIENT_SECRET:internal-service-secret}
    token-uri: ${SERVICE_TOKEN_URI:http://127.0.0.1:18080/realms/claimassist-dev/protocol/openid-connect/token}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

outbox:
  publisher:
    poll-interval-ms: 999999999
    batch-size: 10
    max-attempts: 3

app:
  kafka:
    consumer-groups:
      agent: agent-group-local-${CLAIMASSIST_DEV_ID:local}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.springframework.kafka: WARN
    org.springframework.ai: WARN

