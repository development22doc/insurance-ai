# LOCAL-K8S: Agent Service connecting to OCI K3s dependencies via Tailscale NodePorts
# Profile: local-k8s
#
# This profile is for IntelliJ/local debugging against the real OCI K3s infrastructure.
# All services connect through the shared Tailscale-accessible NodePorts.
#
# Shared infrastructure NodePorts (Tailscale):
#   PostgreSQL: 100.114.133.69:30432
#   Redis:      100.114.133.69:30379
#   Kafka:      100.114.133.69:30092
#   Keycloak:   100.114.133.69:30080
#   Zipkin:     100.114.133.69:30941
#   Loki:       100.114.133.69:30310
#   Prometheus: 100.114.133.69:30900
#   Grafana:    100.114.133.69:30300

# Developer identity for observability
claimassist:
  dev:
    id: ${CLAIMASSIST_DEV_ID:local}
    name: ${CLAIMASSIST_DEVELOPER_NAME:unknown}

spring:
  config:
    import: optional:file:../application-local-k8s.properties
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: false
    openfeign:
      client:
        config:
          claims-service:
            url: ${CLAIMS_SERVICE_URI:http://localhost:8082}
            connect-timeout: 2000
            read-timeout: 5000
          customer-service:
            url: ${CUSTOMER_SERVICE_URI:http://localhost:8081}
            connect-timeout: 2000
            read-timeout: 5000
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:100.114.133.69}:${POSTGRES_PORT:30432}/claimassist_agent
    username: ${POSTGRES_USER:claimassist}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:100.114.133.69}
      port: ${REDIS_PORT:30379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.114.133.69:30092}
    producer:
      acks: all
      retries: 2147483647
      batch-size: 16384
      linger-ms: 10
      compression-type: snappy
      delivery-timeout-ms: 120000
      properties:
        linger.ms: 10
        request.timeout.ms: 30000
        retry.backoff.ms: 1000

    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:100.114.133.69:30092}
      group-id: agent-service-local-k8s
      max-poll-records: 100
      session-timeout-ms: 30000
      enable-auto-commit: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://100.114.133.69:30080/realms/claimassist-dev}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://100.114.133.69:30080/realms/claimassist-dev/protocol/openid-connect/certs}

security:
  service-client:
    registration-id: internal-service
    client-id: ${SERVICE_CLIENT_ID}
    client-secret: ${SERVICE_CLIENT_SECRET}
    token-uri: ${SERVICE_TOKEN_URI}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:false}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://100.114.133.69:30941/api/v2/spans}

outbox:
  publisher:
    poll-interval-ms: 999999999
    batch-size: 10
    max-attempts: 3

app:
  kafka:
    consumer-groups:
      agent: agent-group-local-${CLAIMASSIST_DEV_ID:local}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.springframework.kafka: WARN
    org.springframework.ai: WARN
