logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

spring:
  application:
    name: agent-service
  cloud:
    config:
      # Disable config client locally so service can start even when config server is down
      enabled: false
    openfeign:
      client:
        config:
          claims-service:
            connect-timeout: 2000
            read-timeout: 5000
          customer-service:
            connect-timeout: 2000
            read-timeout: 5000
  config:
    # Make config server import optional so service can start when config server is unavailable
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  main:
    allow-bean-definition-overriding: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:3b}
          temperature: 0.2
          num-ctx: 8192
  datasource:
    # Default to an in-memory H2 datasource for local developer startup when no profile is active
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:agentdb;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
  flyway:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 25s
  # spring.ai runtime + guard limits for the agent's LLM/tool loop
agent:
  ai:
    max-tool-calls: ${AGENT_AI_MAX_TOOL_CALLS:10}
    tool-timeout-ms: ${AGENT_AI_TOOL_TIMEOUT_MS:15000}
    agent-timeout-ms: ${AGENT_AI_AGENT_TIMEOUT_MS:60000}
    ollama-connect-timeout-ms: ${AGENT_AI_OLLAMA_CONNECT_TIMEOUT_MS:5000}
    ollama-read-timeout-ms: ${AGENT_AI_OLLAMA_READ_TIMEOUT_MS:60000}
    max-tool-result-chars: ${AGENT_AI_MAX_TOOL_RESULT_CHARS:10000}
  cache:
    enabled: ${AGENT_CACHE_ENABLED:true}
    version: ${AGENT_CACHE_VERSION:v1}
    claim-status-ttl: ${AGENT_CACHE_CLAIM_STATUS_TTL:30s}
    policy-coverage-ttl: ${AGENT_CACHE_POLICY_COVERAGE_TTL:5m}
    claim-documents-ttl: ${AGENT_CACHE_CLAIM_DOCUMENTS_TTL:2m}

server:
  port: 8083
  shutdown: graceful

outbox:
  publisher:
    poll-interval-ms: 2000
    batch-size: 100
    max-attempts: 5
    retry:
      base-delay-ms: 1000
      max-delay-ms: 60000
      multiplier: 2.0
  topics:
    partitions: 3
    replication-factor: 1
    min-in-sync-replicas: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin-service.claimassist-core.svc.cluster.local:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    instances:
      claimsService:
        sliding-window-size: 20
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      customerService:
        sliding-window-size: 20
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  bulkhead:
    instances:
      claimsService:
        max-concurrent-calls: 20
        max-wait-duration: 500ms
      customerService:
        max-concurrent-calls: 20
        max-wait-duration: 500ms
  ratelimiter:
    instances:
      claimsService:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0s
      customerService:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0s
  retry:
    instances:
      claimsService:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - java.io.IOException
        ignore-exceptions:
          - feign.FeignException.Unauthorized
          - feign.FeignException.NotFound
      customerService:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - java.io.IOException
        ignore-exceptions:
          - feign.FeignException.Unauthorized
          - feign.FeignException.NotFound
