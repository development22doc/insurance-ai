logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

spring:
  application:
    name: agent-service
  cloud:
    config:
      # Disable config client locally so service can start even when config server is down
      enabled: false
  config:
    # Make config server import optional so service can start when config server is unavailable
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  # Disable Spring AI auto-configurations that require extra dependencies not present locally
  autoconfigure:
    exclude:
      - org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiTextAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  main:
    allow-bean-definition-overriding: true
  datasource:
    # Default to an in-memory H2 datasource for local developer startup when no profile is active
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:agentdb;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 25s
  # spring.ai disabled for local startup; detailed AI settings are provided in environment-specific files

server:
  shutdown: graceful

outbox:
  publisher:
    poll-interval-ms: 2000
    batch-size: 100
    max-attempts: 5
    retry:
      base-delay-ms: 1000
      max-delay-ms: 60000
      multiplier: 2.0
  topics:
    partitions: 3
    replication-factor: 1
    min-in-sync-replicas: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin-service.claimassist-core.svc.cluster.local:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    instances:
      claimsService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      customerService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      claimsService:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - java.io.IOException
        ignore-exceptions:
          - feign.FeignException.Unauthorized
          - feign.FeignException.NotFound
      customerService:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - java.io.IOException
        ignore-exceptions:
          - feign.FeignException.Unauthorized
          - feign.FeignException.NotFound
