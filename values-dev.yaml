# Dev environment values
replicaCount:
  claimsService: 2
  customerService: 2
  agentService: 2
  apiGateway: 2
  configService: 1
  discoveryService: 1

image:
  registry: docker.io
  repository: claimassist
  tag: dev-latest
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  host: api-dev.claimassist.io

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

resources:
  claims:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { cpu: 800m, memory: 768Mi }
  customer:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { cpu: 800m, memory: 768Mi }
  agent:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { cpu: 800m, memory: 768Mi }
  gateway:
    requests: { cpu: 150m, memory: 192Mi }
    limits: { cpu: 400m, memory: 384Mi }
  config:
    requests: { cpu: 75m, memory: 192Mi }
    limits: { cpu: 400m, memory: 384Mi }

persistence:
  postgres:
    size: 20Gi
    storageClass: fast

prometheus:
  enabled: true
  retention: 7d

grafana:
  enabled: true
