# Local development environment values
replicaCount:
  claimsService: 1
  customerService: 1
  agentService: 1
  apiGateway: 1
  configService: 1
  discoveryService: 1

image:
  registry: localhost:5000
  repository: claimassist
  tag: latest
  pullPolicy: Always

ingress:
  enabled: false

autoscaling:
  enabled: false

resources:
  claims:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  customer:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  agent:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  gateway:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
  config:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

persistence:
  postgres:
    size: 5Gi

prometheus:
  enabled: true
  retention: 1d

grafana:
  enabled: true
