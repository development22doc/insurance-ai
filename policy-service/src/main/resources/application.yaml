spring:
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      enabled: true
      import-check:
        enabled: true
  application:
    name: policy-service
  # Flyway is DISABLED by default as a safety measure
  # Individual profiles (local) can explicitly enable it for local databases
  flyway:
    enabled: false
    # Use empty locations as a safety default - only specific profiles should override this
    locations: ""
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/claimassist}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/claimassist/protocol/openid-connect/certs}

server:
  port: 8084

security:
  internal:
    trusted-service-client-ids: ${TRUSTED_SERVICE_CLIENT_IDS:claimassist-admin-service,claims-service,agent-service}

policy:
  migration:
    legacy-coverage-plan-map: {}

# Stripe Configuration - Test Mode Only
# STRIPE_SECRET_KEY: Must be a Stripe TEST MODE secret key (starts with sk_test_)
# Never use live keys (sk_live_) in development
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-signing-secret: ${SPRING_STRIPE_WEBHOOK_SIGNING_SECRET:}

# Defer config imports to environment-specific files (local/local-k8s/dev)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    enable:
      jvm: true
      process: true
      logback: true

    distribution:
      percentiles-histogram:
        http.server.requests: true

    tags:
      application: ${spring.application.name}
      environment: local
      source: intellij
      developer: ${CLAIMASSIST_DEVELOPER_NAME:unknown}

  prometheus:
    metrics:
      export:
        enabled: true

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tracing:
  sampling:
    probability: 1.0

zipkin:
  tracing:
    endpoint: ${ZIPKIN_ENDPOINT:http://100.114.133.69:30941/api/v2/spans}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
