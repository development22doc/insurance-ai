spring:
  config:
    import:
      - optional:file:../application-local-k8s.properties
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      enabled: true
      import-check:
        enabled: true
  # CRITICAL WARNING: This profile connects to OCI PostgreSQL through Tailscale
  # Flyway is DISABLED by default to protect the OCI read-only boundary
  # DO NOT set FLYWAY_ENABLED=true - this WILL modify the remote OCI database
  # OCI PostgreSQL is STRICTLY READ-ONLY - no migrations allowed
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:100.114.133.69}:${POSTGRES_PORT:30432}/claimassist_policy
    username: ${POSTGRES_USER:claimassist}
    password: ${POSTGRES_PASSWORD}
  flyway:
    # CRITICAL: Flyway is DISABLED for local-k8s to protect OCI read-only boundary
    # WARNING: If FLYWAY_ENABLED=true is set as an environment variable, it WILL override this setting
    # and Flyway WILL run against OCI PostgreSQL, violating the read-only boundary
    enabled: false
    # Use empty locations to ensure no migrations can run even if enabled accidentally
    locations: ""
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://100.114.133.69:30080/realms/claimassist-dev}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://100.114.133.69:30080/realms/claimassist-dev/protocol/openid-connect/certs}

server:
  port: 8084

security:
  internal:
    trusted-service-client-ids: ${TRUSTED_SERVICE_CLIENT_IDS:claimassist-admin-service,claims-service,agent-service,customer-service}

policy:
  migration:
    legacy-coverage-plan-map: {}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    enable:
      jvm: true
      process: true
      logback: true

    distribution:
      percentiles-histogram:
        http.server.requests: true

    tags:
      application: ${spring.application.name}
      environment: local-k8s
      source: intellij
      developer: ${CLAIMASSIST_DEVELOPER_NAME:unknown}

  prometheus:
    metrics:
      export:
        enabled: true

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tracing:
  sampling:
    probability: 1.0

zipkin:
  tracing:
    endpoint: ${ZIPKIN_ENDPOINT:http://100.114.133.69:30941/api/v2/spans}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
