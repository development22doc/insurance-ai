# LOCAL profile: run policy-service locally against localhost PostgreSQL
# SAFETY: Flyway is DISABLED by default
# Set FLYWAY_ENABLED=true ONLY for local development with genuinely local PostgreSQL
# DO NOT use FLYWAY_ENABLED=true when connecting to remote databases (including OCI)
spring:
  config:
    import:
      - optional:file:../application-local.properties
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      enabled: true
      import-check:
        enabled: true
  datasource:
    url: jdbc:postgresql://${POLICY_DB_HOST:localhost}:${POLICY_DB_PORT:5432}/claimassist_policy
    username: ${POLICY_DB_USER:policy}
    password: ${POLICY_DB_PASSWORD:policy}
  flyway:
    # SAFETY: Flyway is DISABLED by default for local profile
    # ONLY enable with FLYWAY_ENABLED=true when:
    # 1. Using a genuinely local PostgreSQL database (localhost)
    # 2. The database is NOT connected to OCI or any remote production database
    # 3. You want to run V9 synthetic seed data for local testing
    # DO NOT enable when connecting to remote databases
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://100.114.133.69:30080/realms/claimassist-dev}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://100.114.133.69:30080/realms/claimassist-dev/protocol/openid-connect/certs}

server:
  port: 8084

security:
  internal:
    trusted-service-client-ids: ${TRUSTED_SERVICE_CLIENT_IDS:claimassist-admin-service,claims-service,agent-service,customer-service}

policy:
  migration:
    legacy-coverage-plan-map: {}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    enable:
      jvm: true
      process: true
      logback: true

    distribution:
      percentiles-histogram:
        http.server.requests: true

    tags:
      application: ${spring.application.name}
      environment: local
      source: intellij
      developer: ${CLAIMASSIST_DEVELOPER_NAME:unknown}

  prometheus:
    metrics:
      export:
        enabled: true

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tracing:
  sampling:
    probability: 1.0

zipkin:
  tracing:
    endpoint: ${ZIPKIN_ENDPOINT:http://100.114.133.69:30941/api/v2/spans}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
