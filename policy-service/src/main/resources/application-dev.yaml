spring:
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      enabled: true
      import-check:
        enabled: true
  # Flyway is DISABLED by default for dev environments
  # Dev migrations should be managed through explicit database administration
  flyway:
    enabled: false
    # Use empty locations to ensure no migrations can run even if enabled accidentally
    locations: ""
  datasource:
    url: jdbc:postgresql://${POLICY_DB_HOST:postgres}:${POLICY_DB_PORT:5432}/claimassist_policy_dev
    username: ${POLICY_DB_USER:policy}
    password: ${POLICY_DB_PASSWORD:policy}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/claimassist}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8180/realms/claimassist/protocol/openid-connect/certs}

server:
  port: 8084

security:
  internal:
    trusted-service-client-ids: ${TRUSTED_SERVICE_CLIENT_IDS:claimassist-admin-service,claims-service,agent-service}

policy:
  migration:
    legacy-coverage-plan-map: {}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    enable:
      jvm: true
      process: true
      logback: true

    distribution:
      percentiles-histogram:
        http.server.requests: true

    tags:
      application: ${spring.application.name}
      environment: dev
      source: k8s
      developer: ${CLAIMASSIST_DEVELOPER_NAME:unknown}

  prometheus:
    metrics:
      export:
        enabled: true

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tracing:
  sampling:
    probability: 1.0

zipkin:
  tracing:
    endpoint: ${ZIPKIN_ENDPOINT:http://zipkin-service.claimassist-observability.svc.cluster.local:9411/api/v2/spans}

logging:
  level:
    com.claimassist: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
